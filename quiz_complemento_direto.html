<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz -- Complemento Direto</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', Arial, sans-serif; background: #f0f4f8; color: #2d3748; min-height: 100vh; padding: 20px; }
  .container { max-width: 680px; margin: 0 auto; }
  header { text-align: center; padding: 30px 0 20px; }
  header h1 { font-size: 1.8rem; color: #553c9a; margin-bottom: 6px; }
  header p { color: #718096; font-size: 0.95rem; }
  .back-link { display: inline-block; margin-bottom: 16px; color: #718096; font-size: 0.88rem; text-decoration: none; }
  .back-link:hover { color: #553c9a; }
  .filter-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
  .filter-btn { padding: 7px 16px; border-radius: 20px; border: 2px solid #e2e8f0; background: white; font-size: 0.85rem; font-weight: 600; cursor: pointer; color: #718096; transition: all 0.15s; }
  .filter-btn.active { background: #553c9a; border-color: #553c9a; color: white; }
  .filter-btn:hover:not(.active) { border-color: #d6bcfa; color: #553c9a; }
  .progress-bar-wrap { background: #e2e8f0; border-radius: 8px; height: 8px; margin: 20px 0; }
  .progress-bar { height: 8px; border-radius: 8px; background: linear-gradient(90deg, #553c9a, #d6bcfa); transition: width 0.4s ease; }
  .progress-label { text-align: right; font-size: 0.82rem; color: #718096; margin-top: 4px; }
  .card { background: white; border-radius: 16px; padding: 30px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); margin-bottom: 20px; }
  .category-badge { display: inline-block; font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; padding: 3px 10px; border-radius: 20px; margin-bottom: 14px; }
  .badge-regra { background: #faf5ff; color: #553c9a; }
  .badge-rz { background: #ebf8ff; color: #2c5282; }
  .badge-nasal { background: #fffaf0; color: #744210; }
  .badge-com { background: #f0fff4; color: #276749; }
  .question { font-size: 1.1rem; font-weight: 600; line-height: 1.6; margin-bottom: 20px; }
  .options { display: flex; flex-direction: column; gap: 10px; }
  .option-btn { background: #f7fafc; border: 2px solid #e2e8f0; border-radius: 10px; padding: 13px 18px; font-size: 1rem; text-align: left; cursor: pointer; transition: all 0.15s; color: #2d3748; }
  .option-btn:hover:not(:disabled) { background: #faf5ff; border-color: #d6bcfa; }
  .option-btn.correct { background: #f0fff4; border-color: #68d391; color: #276749; font-weight: 600; }
  .option-btn.wrong { background: #fff5f5; border-color: #fc8181; color: #c53030; }
  .option-btn:disabled { cursor: default; }
  .feedback { margin-top: 16px; padding: 12px 16px; border-radius: 10px; font-size: 0.9rem; line-height: 1.5; display: none; }
  .feedback.show { display: block; }
  .feedback.ok  { background: #f0fff4; color: #276749; border-left: 4px solid #68d391; }
  .feedback.err { background: #fff5f5; color: #c53030; border-left: 4px solid #fc8181; }
  .next-btn { display: none; margin-top: 18px; width: 100%; padding: 14px; background: #553c9a; color: white; border: none; border-radius: 10px; font-size: 1rem; font-weight: 600; cursor: pointer; }
  .next-btn:hover { background: #44337a; }
  .next-btn.show { display: block; }
  .results { display: none; text-align: center; padding: 40px 30px; }
  .results.show { display: block; }
  .score-circle { width: 120px; height: 120px; border-radius: 50%; background: linear-gradient(135deg, #553c9a, #d6bcfa); display: flex; flex-direction: column; align-items: center; justify-content: center; margin: 0 auto 20px; color: white; }
  .score-circle .num { font-size: 2.2rem; font-weight: 700; line-height: 1; }
  .score-circle .denom { font-size: 0.85rem; opacity: 0.85; }
  .results h2 { font-size: 1.5rem; margin-bottom: 8px; }
  .results p { color: #718096; margin-bottom: 24px; }
  .btn-row { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  .restart-btn { padding: 13px 32px; background: #553c9a; color: white; border: none; border-radius: 10px; font-size: 1rem; font-weight: 600; cursor: pointer; }
  .home-btn { padding: 13px 32px; background: #edf2f7; color: #4a5568; border: none; border-radius: 10px; font-size: 1rem; font-weight: 600; cursor: pointer; text-decoration: none; display: inline-block; }
  .mistakes-list { text-align: left; margin-top: 28px; }
  .mistakes-list h3 { font-size: 1rem; color: #c53030; margin-bottom: 12px; }
  .mistake-item { background: #fff5f5; border-radius: 8px; padding: 10px 14px; margin-bottom: 8px; font-size: 0.88rem; line-height: 1.5; }
  .mistake-item strong { color: #c53030; }
  .mistake-item .correct-ans { color: #276749; font-weight: 600; }
</style>
</head>
<body>
<div class="container">
  <a class="back-link" href="index.html">← Voltar ao menu</a>
  <header>
    <h1>Complemento Direto</h1>
    <p>o/a/os/as → lo/la · no/na · regras de colocação · com+pronome</p>
  </header>
  <div class="filter-row">
    <button class="filter-btn active" onclick="setFilter('todos',this)">Todos (18)</button>
    <button class="filter-btn" onclick="setFilter('regra',this)">Regra geral</button>
    <button class="filter-btn" onclick="setFilter('rz',this)">-r/-s/-z → lo/la</button>
    <button class="filter-btn" onclick="setFilter('nasal',this)">-ão/-m → no/na</button>
    <button class="filter-btn" onclick="setFilter('com',this)">com+pronome</button>
  </div>
  <div class="progress-bar-wrap"><div class="progress-bar" id="progressBar" style="width:0%"></div></div>
  <div class="progress-label" id="progressLabel"></div>
  <div class="card" id="quizCard">
    <div class="category-badge" id="badge"></div>
    <div class="question" id="question"></div>
    <div class="options" id="options"></div>
    <div class="feedback" id="feedback"></div>
    <button class="next-btn" id="nextBtn" onclick="nextQuestion()">Próxima questão →</button>
  </div>
  <div class="card results" id="results">
    <div class="score-circle"><span class="num" id="scoreNum"></span><span class="denom" id="scoreDenom"></span></div>
    <h2 id="resultsTitle"></h2><p id="resultsMsg"></p>
    <div class="btn-row">
      <button class="restart-btn" onclick="restart()">Repetir quiz</button>
      <a class="home-btn" href="index.html">Menu principal</a>
    </div>
    <div class="mistakes-list" id="mistakesList"></div>
  </div>
</div>
<script>
const allQuestions = [
  // Regra geral
  { cat:"regra", q:"Qual é a forma padrão do pronome CD masculino singular?", options:["lhe","o","lo","no"], answer:1, explanation:"A forma base é O (masc. sg.), A (fem. sg.), OS (masc. pl.), AS (fem. pl.). Estas formas mudam dependendo do som final do verbo." },
  { cat:"regra", q:"«Eu ___ vi.» (vi o Pedro → substituir «o Pedro»)", options:["lhe vi","o vi","vi-o","lo vi"], answer:2, explanation:"Posição padrão em PE: VER + pronome depois (ênclise) ou entre partes do verbo. Eu vi-o = Я его видел. Atenção: em frases negativas o pronome fica ANTES: Eu não o vi." },
  { cat:"regra", q:"«Eu não ___ conheço.» (não conheço ela)", options:["conheço-a","a conheço","conheço-la","la conheço"], answer:1, explanation:"Frase NEGATIVA → pronome ANTES do verbo (próclise). Eu não A conheço = Я её не знаю. Regra: não/nunca/já/ainda + pronome + verbo." },
  { cat:"regra", q:"«___ vejo todos os dias.» (vejo elas)", options:["Vejo-as","As vejo","Vejo-las","Las vejo"], answer:0, explanation:"Frase afirmativa simples → pronome DEPOIS (ênclise): VEJO-AS. Mas em PE formal, a ênclise é a norma em frases simples afirmativas." },
  // -r/-s/-z → lo/la
  { cat:"rz", q:"Regra: quando o verbo termina em -R, -S ou -Z, o pronome «o» transforma-se em:", options:["no","lhe","lo","o"], answer:2, explanation:"Verbo termina em -R, -S, -Z → o verbo perde essa letra final + pronome vira LO/LA/LOS/LAS. Exemplo: COMER + o = COMÊ-LO. O acento aparece!" },
  { cat:"rz", q:"«Eu quero ___» (quero comer o bolo → «o bolo» = CD)", options:["comê-lo","comê-o","comer-o","comê-lhe"], answer:0, explanation:"COMER + O → COMÊ-LO. Perde-se o -R do infinitivo, acrescenta-se acento circunflexo (ê) e o pronome torna-se LO." },
  { cat:"rz", q:"«Ela vai ___» (vai comprar as flores)", options:["comprá-las","comprar-as","comprá-as","comprá-lhe"], answer:0, explanation:"COMPRAR + AS → COMPRÁ-LAS. -R cai, acento agudo (á), pronome = LAS (plural feminino)." },
  { cat:"rz", q:"«Nós vamos ___» (vamos ver os filmes)", options:["vê-los","ver-os","vê-lhes","vê-os"], answer:0, explanation:"VER + OS → VÊ-LOS. -R cai, acento circunflexo (ê), pronome = LOS (plural masc.)." },
  { cat:"rz", q:"«Já ___» (já fiz o trabalho → já fiz + o)", options:["já fiz-o","já o fiz","já fiz-lo","já fi-lo"], answer:1, explanation:"Frase com JÁ → próclise (pronome antes): JÁ O FIZ. O -Z de fiz NÃO cai aqui porque o pronome está antes! Regra -z+lo aplica-se só quando o pronome SEGUE o verbo." },
  // -ão/-m → no/na
  { cat:"nasal", q:"Regra: quando o verbo termina em som nasal (-ão, -am, -em, -m), o pronome «o» vira:", options:["lo","lhe","no","o"], answer:2, explanation:"Verbo termina em nasal (-ão/-am/-em/-m) → pronome vira NO/NA/NOS/NAS. Exemplo: FAZEM + o = FAZEM-NO." },
  { cat:"nasal", q:"«Eles ___» (eles fazem o jantar)", options:["fazem-lhe","fazem-o","fazem-no","fazê-lo"], answer:2, explanation:"FAZEM + O → FAZEM-NO. Verbo termina em -m (som nasal) → o pronome vira NO." },
  { cat:"nasal", q:"«Elas ___» (elas comem a sopa)", options:["comem-a","comem-na","comê-la","comem-lhe"], answer:1, explanation:"COMEM + A → COMEM-NA. Verbo termina em -m → pronome feminino A vira NA." },
  { cat:"nasal", q:"«Eles vão ___» (vão chamar as crianças)", options:["chamar-as","chamá-las","chamá-as","chamam-nas"], answer:1, explanation:"CHAMAR + AS → CHAMÁ-LAS. O verbo no infinitivo termina em -R → lo/la/los/las. Chamam-nas seria com CHAMAM (3a pl presente)." },
  { cat:"nasal", q:"«Ela pôs ___» (ela pôs o livro na mesa)", options:["pôs-o","pô-lo","pôs-lo","pô-lhe"], answer:1, explanation:"PÔS + O → PÔ-LO. O -S de pôs cai (regra -s/-z), acento circunflexo (ô), pronome = LO." },
  // com+pronome
  { cat:"com", q:"«Queres vir ___ ?» (vir comigo)", options:["com me","comigo","com eu","com mim"], answer:1, explanation:"COM + EU → COMIGO. Formas especiais: comigo / contigo / consigo / connosco / convosco / com eles." },
  { cat:"com", q:"«Ela falou ___» (falou com tu)", options:["com tu","com você","contigo","con ti"], answer:2, explanation:"COM + TU → CONTIGO. Em PE, «você» é mais formal. Contigo é a forma natural na conversa com «tu»." },
  { cat:"com", q:"«Vamos sair ___?» (sair com nós)", options:["connosco","com nos","com nós","com nosso"], answer:0, explanation:"COM + NÓS → CONNOSCO (PE). No Brasil: CONOSCO (uma 'n'). Não confundir: CONNOSCO não tem acento." },
  { cat:"com", q:"«Ela trouxe o livro ___» (trouxe para ela mesma / ela = sujeito)", options:["com ela","com a ela","consigo","com si"], answer:2, explanation:"COM + SE (reflexivo) → CONSIGO. Usado quando o objeto da preposição é o mesmo que o sujeito: Ela trouxe o trabalho consigo = Она принесла работу с собой." },
];

const badges = { regra:"Regra geral", rz:"-r/-s/-z → lo/la", nasal:"-ão/-m → no/na", com:"com + pronome" };
const badgeClass = { regra:"badge-regra", rz:"badge-rz", nasal:"badge-nasal", com:"badge-com" };
let filtered = [...allQuestions], current = 0, score = 0, mistakes = [];

function setFilter(cat, btn) {
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  filtered = cat === 'todos' ? [...allQuestions] : allQuestions.filter(q => q.cat === cat);
  current = 0; score = 0; mistakes = [];
  document.getElementById('quizCard').style.display = '';
  document.getElementById('results').className = 'card results';
  document.getElementById('mistakesList').innerHTML = '';
  loadQuestion();
}

function loadQuestion() {
  const q = filtered[current];
  document.getElementById('progressBar').style.width = (current / filtered.length * 100) + '%';
  document.getElementById('progressLabel').textContent = `Questão ${current + 1} de ${filtered.length}`;
  const badge = document.getElementById('badge');
  badge.textContent = badges[q.cat];
  badge.className = 'category-badge ' + badgeClass[q.cat];
  document.getElementById('question').textContent = q.q;
  const opts = document.getElementById('options');
  opts.innerHTML = '';
  q.options.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.textContent = opt;
    btn.onclick = () => selectAnswer(i);
    opts.appendChild(btn);
  });
  document.getElementById('feedback').className = 'feedback';
  document.getElementById('nextBtn').className = 'next-btn';
}

function selectAnswer(i) {
  const q = filtered[current];
  const btns = document.querySelectorAll('.option-btn');
  btns.forEach(b => b.disabled = true);
  const fb = document.getElementById('feedback');
  if (i === q.answer) {
    score++;
    btns[i].classList.add('correct');
    fb.className = 'feedback ok show';
    fb.textContent = 'Correto! ' + q.explanation;
  } else {
    btns[i].classList.add('wrong');
    btns[q.answer].classList.add('correct');
    fb.className = 'feedback err show';
    fb.textContent = 'Incorreto. ' + q.explanation;
    mistakes.push({ q: q.q, yours: q.options[i], correct: q.options[q.answer] });
  }
  document.getElementById('nextBtn').className = 'next-btn show';
}

function nextQuestion() {
  current++;
  if (current < filtered.length) { loadQuestion(); }
  else { showResults(); }
}

function showResults() {
  document.getElementById('quizCard').style.display = 'none';
  const r = document.getElementById('results');
  r.className = 'card results show';
  document.getElementById('scoreNum').textContent = score;
  document.getElementById('scoreDenom').textContent = '/ ' + filtered.length;
  const pct = Math.round(score / filtered.length * 100);
  document.getElementById('resultsTitle').textContent = pct >= 80 ? 'Muito bem!' : pct >= 60 ? 'Bom trabalho!' : 'Continua a praticar!';
  document.getElementById('resultsMsg').textContent = `Acertaste ${score} de ${filtered.length} questões (${pct}%).`;
  const ml = document.getElementById('mistakesList');
  if (mistakes.length) {
    ml.innerHTML = '<h3>Erros para rever:</h3>' + mistakes.map(m =>
      `<div class="mistake-item"><strong>${m.q}</strong><br>A tua resposta: ${m.yours}<br><span class="correct-ans">Correto: ${m.correct}</span></div>`
    ).join('');
  }
}

function restart() {
  current = 0; score = 0; mistakes = [];
  document.getElementById('quizCard').style.display = '';
  document.getElementById('results').className = 'card results';
  document.getElementById('mistakesList').innerHTML = '';
  loadQuestion();
}

loadQuestion();
</script>
</body>
</html>
