<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz -- Imperfeito: Irregulares e Usos</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', Arial, sans-serif; background: #f0f4f8; color: #2d3748; min-height: 100vh; padding: 20px; }
  .container { max-width: 680px; margin: 0 auto; }
  header { text-align: center; padding: 30px 0 20px; }
  header h1 { font-size: 1.8rem; color: #553c9a; margin-bottom: 6px; }
  header p { color: #718096; font-size: 0.95rem; }
  .back-link { display: inline-block; margin-bottom: 16px; color: #718096; font-size: 0.88rem; text-decoration: none; }
  .back-link:hover { color: #553c9a; }
  .filter-wrap { margin-bottom: 16px; }
  .filter-label { font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: #a0aec0; margin-bottom: 8px; display: block; }
  .filter-buttons { display: flex; flex-wrap: wrap; gap: 7px; }
  .filter-btn { font-size: 0.78rem; font-weight: 600; padding: 5px 12px; border-radius: 20px; border: 2px solid #e2e8f0; cursor: pointer; background: white; color: #4a5568; transition: all 0.15s; }
  .filter-btn[data-cat="todos"].active-f    { background: #edf2f7; border-color: #a0aec0; }
  .filter-btn[data-cat="irregular"].active-f { background: #faf5ff; color: #553c9a; border-color: #b794f4; }
  .filter-btn[data-cat="usos"].active-f     { background: #fffbeb; color: #744210; border-color: #f6ad55; }
  .filter-btn[data-cat="por"].active-f      { background: #e6fffa; color: #234e52; border-color: #81e6d9; }
  .progress-bar-wrap { background: #e2e8f0; border-radius: 8px; height: 8px; margin: 16px 0 4px; }
  .progress-bar { height: 8px; border-radius: 8px; background: linear-gradient(90deg, #805ad5, #d6bcfa); transition: width 0.4s; }
  .progress-label { text-align: right; font-size: 0.82rem; color: #718096; margin-top: 4px; margin-bottom: 16px; }
  .card { background: white; border-radius: 16px; padding: 30px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); margin-bottom: 20px; }
  .category-badge { display: inline-block; font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; padding: 3px 10px; border-radius: 20px; margin-bottom: 14px; }
  .badge-irregular { background: #faf5ff; color: #553c9a; }
  .badge-usos      { background: #fffbeb; color: #744210; }
  .badge-por       { background: #e6fffa; color: #234e52; }
  .question { font-size: 1.1rem; font-weight: 600; line-height: 1.6; margin-bottom: 20px; }
  .options { display: flex; flex-direction: column; gap: 10px; }
  .option-btn { background: #f7fafc; border: 2px solid #e2e8f0; border-radius: 10px; padding: 13px 18px; font-size: 1rem; text-align: left; cursor: pointer; transition: all 0.15s; color: #2d3748; }
  .option-btn:hover:not(:disabled) { background: #faf5ff; border-color: #d6bcfa; }
  .option-btn.correct { background: #f0fff4; border-color: #68d391; color: #276749; font-weight: 600; }
  .option-btn.wrong { background: #fff5f5; border-color: #fc8181; color: #c53030; }
  .option-btn:disabled { cursor: default; }
  .feedback { margin-top: 16px; padding: 12px 16px; border-radius: 10px; font-size: 0.9rem; line-height: 1.5; display: none; }
  .feedback.show { display: block; }
  .feedback.ok  { background: #f0fff4; color: #276749; border-left: 4px solid #68d391; }
  .feedback.err { background: #fff5f5; color: #c53030; border-left: 4px solid #fc8181; }
  .next-btn { display: none; margin-top: 18px; width: 100%; padding: 14px; background: #805ad5; color: white; border: none; border-radius: 10px; font-size: 1rem; font-weight: 600; cursor: pointer; }
  .next-btn:hover { background: #553c9a; }
  .next-btn.show { display: block; }
  .results { display: none; text-align: center; padding: 40px 30px; }
  .results.show { display: block; }
  .score-circle { width: 120px; height: 120px; border-radius: 50%; background: linear-gradient(135deg, #805ad5, #d6bcfa); display: flex; flex-direction: column; align-items: center; justify-content: center; margin: 0 auto 20px; color: white; }
  .score-circle .num { font-size: 2.2rem; font-weight: 700; line-height: 1; }
  .score-circle .denom { font-size: 0.85rem; opacity: 0.85; }
  .results h2 { font-size: 1.5rem; margin-bottom: 8px; }
  .results p { color: #718096; margin-bottom: 24px; }
  .btn-row { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  .restart-btn { padding: 13px 32px; background: #805ad5; color: white; border: none; border-radius: 10px; font-size: 1rem; font-weight: 600; cursor: pointer; }
  .home-btn { padding: 13px 32px; background: #edf2f7; color: #4a5568; border: none; border-radius: 10px; font-size: 1rem; font-weight: 600; cursor: pointer; text-decoration: none; display: inline-block; }
  .mistakes-list { text-align: left; margin-top: 28px; }
  .mistakes-list h3 { font-size: 1rem; color: #c53030; margin-bottom: 12px; }
  .mistake-item { background: #fff5f5; border-radius: 8px; padding: 10px 14px; margin-bottom: 8px; font-size: 0.88rem; line-height: 1.5; }
  .mistake-item strong { color: #c53030; }
  .mistake-item .correct-ans { color: #276749; font-weight: 600; }
</style>
</head>
<body>
<div class="container">
  <a class="back-link" href="index.html">← Voltar ao menu</a>
  <header>
    <h1>Imperfeito: Irregulares e Usos</h1>
    <p>SER · TER · VIR · PÔR · IR · ESTAR · 7 usos do Imperfeito</p>
  </header>
  <div class="filter-wrap">
    <span class="filter-label">Filtrar por tema</span>
    <div class="filter-buttons">
      <button class="filter-btn active-f" data-cat="todos" onclick="setFilter('todos',this)">Todos</button>
      <button class="filter-btn" data-cat="irregular" onclick="setFilter('irregular',this)">Irregulares</button>
      <button class="filter-btn" data-cat="usos" onclick="setFilter('usos',this)">7 Usos</button>
      <button class="filter-btn" data-cat="por" onclick="setFilter('por',this)">PÔR</button>
    </div>
  </div>
  <div class="progress-bar-wrap"><div class="progress-bar" id="progressBar" style="width:0%"></div></div>
  <div class="progress-label" id="progressLabel"></div>
  <div class="card" id="quizCard">
    <div class="category-badge" id="badge"></div>
    <div class="question" id="question"></div>
    <div class="options" id="options"></div>
    <div class="feedback" id="feedback"></div>
    <button class="next-btn" id="nextBtn" onclick="nextQuestion()">Próxima questão →</button>
  </div>
  <div class="card results" id="results">
    <div class="score-circle"><span class="num" id="scoreNum"></span><span class="denom" id="scoreDenom"></span></div>
    <h2 id="resultsTitle"></h2><p id="resultsMsg"></p>
    <div class="btn-row">
      <button class="restart-btn" onclick="restart()">Repetir quiz</button>
      <a class="home-btn" href="index.html">Menu principal</a>
    </div>
    <div class="mistakes-list" id="mistakesList"></div>
  </div>
</div>
<script>
const allQuestions = [
  // SER
  { cat:"irregular", q:"SER, imperfeito: «Antigamente eu ___ professora.»", options:["fui","era","sou","seria"], answer:1, explanation:"SER imperfeito: eu ERA, tu eras, ele era, nós éramos, eles eram. Для характеристик/привычек в прошлом." },
  { cat:"irregular", q:"SER imperfeito: «Nós ___ amigos.» (ударение правильное?)", options:["éramos","eramos","somos","fomos"], answer:0, explanation:"ÉRAMOS -- обязательно с ударением на Е. Без ударения (eramos) -- это ошибка. nós éramos." },
  { cat:"irregular", q:"SER imperfeito: «As aulas ___ mais fáceis no ano passado.»", options:["foram","seriam","eram","são"], answer:2, explanation:"ERAM -- привычное состояние в прошлом (imperfeito). Foram -- конкретное событие (PPS)." },
  // TER
  { cat:"irregular", q:"TER, imperfeito: «Ela ___ um cão quando era pequena.»", options:["teve","tinha","tem","teria"], answer:1, explanation:"TER imperfeito: eu tinha, tu tinhas, ele TINHA, nós tínhamos, eles tinham. Предметы/животные → imperfeito." },
  { cat:"irregular", q:"TER imperfeito: «Quando eu era criança, ___ muito tempo livre.»", options:["tive","tinha","tínhamos","tenho"], answer:1, explanation:"TINHA -- обычное состояние в прошлом (детство = длительный период). TER + coisas/tempo → imperfeito." },
  { cat:"irregular", q:"TER imperfeito: «Nós ___ muitos amigos em Lisboa.»", options:["tivemos","tínhamos","temos","teriamos"], answer:1, explanation:"TÍNHAMOS -- с ударением на Í. nós tínhamos (imperfeito). tivemos = PPS (конкретный момент)." },
  // VIR
  { cat:"irregular", q:"VIR, imperfeito: «Eles sempre ___ visitar-nos ao fim de semana.»", options:["vieram","vinham","vêm","venham"], answer:1, explanation:"VIR imperfeito: eu vinha, tu vinhas, ele vinha, nós vínhamos, eles VINHAM. Регулярное действие в прошлом." },
  { cat:"irregular", q:"VIR imperfeito: «Ela ___ de Lisboa todas as semanas.»", options:["veio","vinha","venho","virá"], answer:1, explanation:"VINHA -- регулярное действие в прошлом. veio = PPS (один раз). vinha = привычка (imperfeito)." },
  // POR
  { cat:"por", q:"PÔR, presente: «Eu ___ os livros na mesa.»", options:["poo","põe","ponho","põe"], answer:2, explanation:"PÔR presente: eu PONHO (исключение!), tu pões, ele põe, nós pomos, eles põem." },
  { cat:"por", q:"PÔR, presente: «Ela ___ sal na sopa.»", options:["pona","ponha","põe","pomos"], answer:2, explanation:"PÔR: ele/ela PÕE. Atenção ao acento: põe (não: poe)." },
  { cat:"por", q:"PÔR, imperfeito: «Antes ela sempre ___ a mesa.»", options:["punha","põe","pôs","poria"], answer:0, explanation:"PÔR imperfeito: eu PUNHA, tu punhas, ele punha, nós púnhamos, eles punham. Заметьте: punha (не: punhava)." },
  { cat:"por", q:"PÔR, imperfeito: «Nós sempre ___ música durante o jantar.»", options:["puchamos","púnhamos","ponhamos","pusemos"], answer:1, explanation:"PÔR imperfeito nós: PÚNHAMOS (com acento em Ú). pusemos = PPS (если бы существовало, но PPS de pôr = pus/puseste/pôs/pusemos/puseram)." },
  { cat:"por", q:"Qual frase usa PÔR corretamente?", options:["Ela pões os óculos.","Eu ponho o casaco.","Nós pois a mesa.","Eles põmos a música."], answer:1, explanation:"EU PONHO -- правильная форма. pões = tu; pomos = nós (não põmos); põem = eles." },
  // IR
  { cat:"irregular", q:"IR, imperfeito: «Antigamente eles ___ à missa todos os domingos.»", options:["foram","iam","vão","iriam"], answer:1, explanation:"IR imperfeito: eu ia, tu ias, ele ia, nós íamos, eles IAM. Регулярное действие в прошлом." },
  { cat:"irregular", q:"IR imperfeito: «Nós ___ à praia todos os verões.»", options:["fomos","íamos","vamos","iríamos"], answer:1, explanation:"ÍAMOS -- с ударением на Í. nós íamos (imperfeito регулярное). fomos = PPS (один раз/конкретно)." },
  // ESTAR
  { cat:"irregular", q:"ESTAR, imperfeito: «Ela ___ triste quando eu cheguei.»", options:["esteve","estava","está","estaria"], answer:1, explanation:"ESTAR imperfeito: eu estava, tu estavas, ela ESTAVA, nós estávamos, eles estavam. Фоновое состояние = imperfeito." },
  { cat:"irregular", q:"ESTAR imperfeito: «Enquanto eu estudava, ele ___ a ver televisão.»", options:["esteve","estava","está","esteve a ver"], answer:1, explanation:"ESTAVA -- оба действия параллельны (enquanto + imperfeito + imperfeito). Фоновые действия." },
  // 7 USOS
  { cat:"usos", q:"«Eu queria um café, por favor.» Qual uso do Imperfeito é este?", options:["Sonho","Hipótese","Cortesia","Hábito passado"], answer:2, explanation:"Imperfeito de CORTESIA: queria/preferia/podia/gostava (mais suave que quero/pode). «Eu queria um café» = Um café, por favor (очень вежливо)." },
  { cat:"usos", q:"«Eu gostava de dormir mais.» Qual uso?", options:["Cortesia","Sonho/Desejo","Hipótese","Hábito"], answer:1, explanation:"Imperfeito de SONHO/DESEJO: adorava visitar / queria ter / gostava de... Выражает мечты и желания." },
  { cat:"usos", q:"«Eu ia correr, mas está a chover.» Qual uso?", options:["Sonho","Cortesia","Situação hipotética","Hábito passado"], answer:2, explanation:"Imperfeito HIPOTÉTICO (condicional): ia/falava/conseguia... + mas + obstáculo. «Eu ia correr, mas...»" },
  { cat:"usos", q:"«Antigamente eu costumava acordar cedo.» Qual uso?", options:["Cortesia","Hipótese","Sonho","Hábito passado (costumar)"], answer:3, explanation:"COSTUMAR no Imperfeito = «used to» (раньше обычно делал). costumava acordar = eu acordava regularmente no passado." },
  { cat:"usos", q:"«Quando eu era criança, tinha 8 anos.» Por que Imperfeito?", options:["Cortesia","Idade usa sempre Imperfeito","Hipótese","Sonho"], answer:1, explanation:"IDADE (возраст) com TER → sempre Imperfeito. «Tinha 8 anos» (não «tive 8 anos»). Исключение: «tive 8 anos» = совершенно неестественно." },
  { cat:"usos", q:"«As aulas eram às 9:00.» Por que Imperfeito?", options:["Característica geral","Cortesia","Horário habitual usa Imperfeito","Hipótese"], answer:2, explanation:"HORAS habituais (horário de funcionamento/aulas regulares) → Imperfeito. «As aulas eram às 9» = занятия были в 9 (регулярно). Mas: «O treino foi às 9» = конкретное событие." },
  { cat:"usos", q:"«Enquanto ela cozinhava, eu lia o jornal.» Qual estrutura?", options:["PPS + PPS","Imperfeito + Imperfeito","Imperfeito + PPS","PPS + Imperfeito"], answer:1, explanation:"ENQUANTO + duas ações simultâneas no passado = Imperfeito + Imperfeito. Оба действия длились параллельно." }
];

const badges = { irregular:"Verb. Irregular", usos:"7 Usos", por:"PÔR" };
const badgeClass = { irregular:"badge-irregular", usos:"badge-usos", por:"badge-por" };

let filtered = [...allQuestions], current = 0, score = 0, mistakes = [], activeFilter = "todos";

function setFilter(cat, btn) {
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active-f'));
  btn.classList.add('active-f');
  activeFilter = cat;
  filtered = cat === 'todos' ? [...allQuestions] : allQuestions.filter(q => q.cat === cat);
  restart();
}

function loadQuestion() {
  if (!filtered.length) return;
  const q = filtered[current];
  document.getElementById('progressBar').style.width = (current / filtered.length * 100) + '%';
  document.getElementById('progressLabel').textContent = `Questão ${current + 1} de ${filtered.length}`;
  const badge = document.getElementById('badge');
  badge.textContent = badges[q.cat];
  badge.className = 'category-badge ' + badgeClass[q.cat];
  document.getElementById('question').textContent = q.q;
  const opts = document.getElementById('options');
  opts.innerHTML = '';
  q.options.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.textContent = opt;
    btn.onclick = () => selectAnswer(i);
    opts.appendChild(btn);
  });
  document.getElementById('feedback').className = 'feedback';
  document.getElementById('nextBtn').className = 'next-btn';
}

function selectAnswer(i) {
  const q = filtered[current];
  const btns = document.querySelectorAll('.option-btn');
  btns.forEach(b => b.disabled = true);
  const fb = document.getElementById('feedback');
  if (i === q.answer) {
    score++;
    btns[i].classList.add('correct');
    fb.className = 'feedback ok show';
    fb.textContent = 'Correto! ' + q.explanation;
  } else {
    btns[i].classList.add('wrong');
    btns[q.answer].classList.add('correct');
    fb.className = 'feedback err show';
    fb.textContent = 'Incorreto. ' + q.explanation;
    mistakes.push({ q: q.q, yours: q.options[i], correct: q.options[q.answer] });
  }
  document.getElementById('nextBtn').className = 'next-btn show';
}

function nextQuestion() {
  current++;
  if (current < filtered.length) { loadQuestion(); }
  else { showResults(); }
}

function showResults() {
  document.getElementById('quizCard').style.display = 'none';
  const r = document.getElementById('results');
  r.className = 'card results show';
  document.getElementById('scoreNum').textContent = score;
  document.getElementById('scoreDenom').textContent = '/ ' + filtered.length;
  const pct = Math.round(score / filtered.length * 100);
  document.getElementById('resultsTitle').textContent = pct >= 80 ? 'Muito bem!' : pct >= 60 ? 'Bom trabalho!' : 'Continua a praticar!';
  document.getElementById('resultsMsg').textContent = `Acertaste ${score} de ${filtered.length} questões (${pct}%).`;
  const ml = document.getElementById('mistakesList');
  if (mistakes.length) {
    ml.innerHTML = '<h3>Erros para rever:</h3>' + mistakes.map(m =>
      `<div class="mistake-item"><strong>${m.q}</strong><br>A tua resposta: ${m.yours}<br><span class="correct-ans">Correto: ${m.correct}</span></div>`
    ).join('');
  }
}

function restart() {
  current = 0; score = 0; mistakes = [];
  document.getElementById('quizCard').style.display = '';
  document.getElementById('results').className = 'card results';
  loadQuestion();
}

loadQuestion();
</script>
</body>
</html>
