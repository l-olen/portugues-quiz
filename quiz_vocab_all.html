<!DOCTYPE html>
<html lang="pt">
<head>

<title>Quiz -- Vocabulário Completo</title>
<style>

  .container { max-width: 680px; margin: 0 auto; }

  .mode-btn { flex: 1; padding: 9px 6px; border: none; background: transparent; border-radius: 9px; font-size: 0.82rem; font-weight: 600; cursor: pointer; color: #718096; transition: all 0.2s; line-height: 1.3; }

  .filter-wrap { margin-bottom: 16px; }

  .filter-buttons { display: flex; flex-wrap: wrap; gap: 7px; }
  .filter-btn { font-size: 0.78rem; font-weight: 600; padding: 5px 12px; border-radius: 20px; border: 2px solid #e2e8f0; cursor: pointer; background: white; color: #4a5568; transition: all 0.15s; }
  .filter-btn.active-f { border-color: currentColor; }
  .filter-btn[data-cat="Todos"].active-f      { background: #edf2f7; }
  .filter-btn[data-cat="Natureza"]            { color: #276749; }

  .filter-btn[data-cat="Corpo"]               { color: #b83280; }
  .filter-btn[data-cat="Corpo"].active-f      { background: #fff0f3; }

  .filter-btn[data-cat="Emoções"].active-f    { background: #fefcbf; }

  .filter-btn[data-cat="Caráter"].active-f    { background: #fff5f0; }

  .progress-bar-wrap { background: #e2e8f0; border-radius: 8px; height: 8px; margin: 16px 0 4px; }

  .card { background: white; border-radius: 16px; padding: 28px 30px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); margin-bottom: 20px; }
  .category-badge { display: inline-block; font-size: 0.73rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; padding: 3px 10px; border-radius: 20px; margin-bottom: 14px; }

  .badge-com      { background: #fffaf0; color: #c05621; }
  .badge-corp     { background: #fff0f3; color: #b83280; }

  .question { font-size: 1.1rem; font-weight: 600; line-height: 1.6; margin-bottom: 20px; }

  .option-btn.wrong   { background: #fff5f5; border-color: #fc8181; color: #c53030; }
  .option-btn:disabled { cursor: default; }

  .ru-display { font-size: 1.6rem; font-weight: 700; color: #2d3748; margin-bottom: 4px; }
  .ru-hint-line { font-size: 0.83rem; color: #a0aec0; margin-bottom: 22px; }
  .write-prompt { font-size: 0.88rem; color: #718096; margin-bottom: 10px; }
  .accent-note { font-size: 0.78rem; color: #b7791f; background: #fefcbf; padding: 5px 10px; border-radius: 6px; margin-bottom: 14px; }
  .write-row { display: flex; gap: 10px; }
  .write-input { flex: 1; padding: 13px 16px; border: 2px solid #e2e8f0; border-radius: 10px; font-size: 1.05rem; font-family: inherit; color: #2d3748; outline: none; transition: border-color 0.15s; }
  .write-input:focus { border-color: #7f9cf5; }
  .write-input.correct-inp { border-color: #68d391; background: #f0fff4; }
  .write-input.wrong-inp   { border-color: #fc8181; background: #fff5f5; }
  .check-btn { padding: 13px 20px; background: #4c51bf; color: white; border: none; border-radius: 10px; font-size: 0.95rem; font-weight: 600; cursor: pointer; }
  .check-btn:hover { background: #434190; }
  .check-btn:disabled { background: #a0aec0; cursor: default; }

  .sentence-display { font-size: 1.05rem; font-weight: 500; line-height: 1.9; margin-bottom: 6px; color: #2d3748; }
  .sentence-blank { display: inline-block; min-width: 100px; border-bottom: 3px solid #4c51bf; color: #4c51bf; font-weight: 700; text-align: center; padding: 0 4px; vertical-align: bottom; }
  .frase-hint { font-size: 0.83rem; color: #a0aec0; margin-bottom: 18px; }
  .frase-hint span { color: #718096; font-style: italic; }

  .feedback { margin-top: 16px; padding: 12px 16px; border-radius: 10px; font-size: 0.9rem; line-height: 1.5; display: none; }
  .feedback.show { display: block; }
  .feedback.ok  { background: #f0fff4; color: #276749; border-left: 4px solid #68d391; }
  .feedback.err { background: #fff5f5; color: #c53030; border-left: 4px solid #fc8181; }

  .next-btn { display: none; margin-top: 18px; width: 100%; padding: 14px; background: #4c51bf; color: white; border: none; border-radius: 10px; font-size: 1rem; font-weight: 600; cursor: pointer; }
  .next-btn:hover { background: #434190; }
  .next-btn.show { display: block; }

  .results { display: none; text-align: center; padding: 40px 30px; }
  .results.show { display: block; }
  .score-circle { width: 120px; height: 120px; border-radius: 50%; background: linear-gradient(135deg, #4c51bf, #7f9cf5); display: flex; flex-direction: column; align-items: center; justify-content: center; margin: 0 auto 20px; color: white; }
  .score-circle .num { font-size: 2.2rem; font-weight: 700; line-height: 1; }
  .score-circle .denom { font-size: 0.85rem; opacity: 0.85; }
  .results h2 { font-size: 1.5rem; margin-bottom: 8px; }
  .results p { color: #718096; margin-bottom: 24px; }
  .btn-row { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  .restart-btn { padding: 13px 32px; background: #4c51bf; color: white; border: none; border-radius: 10px; font-size: 1rem; font-weight: 600; cursor: pointer; }
  .home-btn { padding: 13px 32px; background: #edf2f7; color: #4a5568; border: none; border-radius: 10px; font-size: 1rem; font-weight: 600; text-decoration: none; display: inline-block; }
  .mistakes-list { text-align: left; margin-top: 28px; }
  .mistakes-list h3 { font-size: 1rem; color: #c53030; margin-bottom: 12px; }
  .mistake-item { background: #fff5f5; border-radius: 10px; padding: 12px 16px; margin-bottom: 8px; font-size: 0.88rem; line-height: 1.5; }
  .mistake-item .mq { font-weight: 600; color: #2d3748; margin-bottom: 3px; }
  .mistake-item .ma { color: #276749; }
  footer { text-align: center; padding: 32px 0 20px; font-size: 0.8rem; color: #cbd5e0; }
  /* темы (сборка 28.10.2026) */
  .badge-familia { background: #fffaf0; color: #c05621; }
  .filter-btn[data-cat="Família"] { color: #c05621; }
  .filter-btn[data-cat="Família"].active-f { background: #fffaf0; }
  .badge-aspeto { background: #fff0f3; color: #b83280; }
  .filter-btn[data-cat="Aspeto físico"] { color: #b83280; }
  .filter-btn[data-cat="Aspeto físico"].active-f { background: #fff0f3; }
  .badge-personalidade { background: #fefcbf; color: #b7791f; }
  .filter-btn[data-cat="Personalidade e emoções"] { color: #b7791f; }
  .filter-btn[data-cat="Personalidade e emoções"].active-f { background: #fefcbf; }
  .badge-corpo { background: #fff5f5; color: #c53030; }
  .filter-btn[data-cat="Corpo e saúde"] { color: #c53030; }
  .filter-btn[data-cat="Corpo e saúde"].active-f { background: #fff5f5; }
  .badge-casa { background: #e6fffa; color: #2c7a7b; }
  .filter-btn[data-cat="Casa e morada"] { color: #2c7a7b; }
  .filter-btn[data-cat="Casa e morada"].active-f { background: #e6fffa; }
  .badge-cidade { background: #ebf8ff; color: #2b6cb0; }
  .filter-btn[data-cat="Cidade e transportes"] { color: #2b6cb0; }
  .filter-btn[data-cat="Cidade e transportes"].active-f { background: #ebf8ff; }
  .badge-comida { background: #fffaf0; color: #dd6b20; }
  .filter-btn[data-cat="Comida e restaurante"] { color: #dd6b20; }
  .filter-btn[data-cat="Comida e restaurante"].active-f { background: #fffaf0; }
  .badge-natureza { background: #f0fff4; color: #276749; }
  .filter-btn[data-cat="Natureza e animais"] { color: #276749; }
  .filter-btn[data-cat="Natureza e animais"].active-f { background: #f0fff4; }
  .badge-tempo { background: #ebf8ff; color: #3182ce; }
  .filter-btn[data-cat="Tempo e clima"] { color: #3182ce; }
  .filter-btn[data-cat="Tempo e clima"].active-f { background: #ebf8ff; }
  .badge-profissoes { background: #edf2f7; color: #4a5568; }
  .filter-btn[data-cat="Profissões e trabalho"] { color: #4a5568; }
  .filter-btn[data-cat="Profissões e trabalho"].active-f { background: #edf2f7; }
  .badge-objetos { background: #f5f0ff; color: #7e3af2; }
  .filter-btn[data-cat="Objetos e roupa"] { color: #7e3af2; }
  .filter-btn[data-cat="Objetos e roupa"].active-f { background: #f5f0ff; }
  .badge-verbos { background: #e6fffa; color: #285e61; }
  .filter-btn[data-cat="Verbos"] { color: #285e61; }
  .filter-btn[data-cat="Verbos"].active-f { background: #e6fffa; }
  .badge-expressoes { background: #ebf8ff; color: #2b6cb0; }
  .filter-btn[data-cat="Expressões"] { color: #2b6cb0; }
  .filter-btn[data-cat="Expressões"].active-f { background: #ebf8ff; }
  .badge-adjetivos { background: #faf5ff; color: #6b46c1; }
  .filter-btn[data-cat="Adjetivos e advérbios"] { color: #6b46c1; }
  .filter-btn[data-cat="Adjetivos e advérbios"].active-f { background: #faf5ff; }
  .badge-conceitos { background: #eef2ff; color: #4c51bf; }
  .filter-btn[data-cat="Conceitos"] { color: #4c51bf; }
  .filter-btn[data-cat="Conceitos"].active-f { background: #eef2ff; }
</style>
</head>
<body>
<div class="container">
  <a class="back-link" href="index.html">← Voltar ao menu</a>
  <header>
    <h1>Vocabulário Completo</h1>
    <p>598 palavras · 15 temas · Escolher · Escrever · Frase</p>
  </header>

  <div class="mode-wrap">
    <button class="mode-btn active" id="btnChoice" onclick="setMode('choice')">Escolher<br><small style="font-weight:400;opacity:.8">варианты RU</small></button>
    <button class="mode-btn" id="btnWrite" onclick="setMode('write')">Escrever<br><small style="font-weight:400;opacity:.8">RU → пиши PT</small></button>
    <button class="mode-btn" id="btnFrase" onclick="setMode('frase')">Frase<br><small style="font-weight:400;opacity:.8">вставь в предложение</small></button>
  </div>

  <div class="filter-wrap">
    <span class="filter-label">Tema</span>
    <div class="filter-buttons">
      <button class="filter-btn active-f" data-cat="Todos" onclick="setFilter('Todos',this)">Todos</button>
      <button class="filter-btn" data-cat="Família" onclick="setFilter('Família',this)">Família</button>
      <button class="filter-btn" data-cat="Aspeto físico" onclick="setFilter('Aspeto físico',this)">Aspeto físico</button>
      <button class="filter-btn" data-cat="Personalidade e emoções" onclick="setFilter('Personalidade e emoções',this)">Personalidade e emoções</button>
      <button class="filter-btn" data-cat="Corpo e saúde" onclick="setFilter('Corpo e saúde',this)">Corpo e saúde</button>
      <button class="filter-btn" data-cat="Casa e morada" onclick="setFilter('Casa e morada',this)">Casa e morada</button>
      <button class="filter-btn" data-cat="Cidade e transportes" onclick="setFilter('Cidade e transportes',this)">Cidade e transportes</button>
      <button class="filter-btn" data-cat="Comida e restaurante" onclick="setFilter('Comida e restaurante',this)">Comida e restaurante</button>
      <button class="filter-btn" data-cat="Natureza e animais" onclick="setFilter('Natureza e animais',this)">Natureza e animais</button>
      <button class="filter-btn" data-cat="Tempo e clima" onclick="setFilter('Tempo e clima',this)">Tempo e clima</button>
      <button class="filter-btn" data-cat="Profissões e trabalho" onclick="setFilter('Profissões e trabalho',this)">Profissões e trabalho</button>
      <button class="filter-btn" data-cat="Objetos e roupa" onclick="setFilter('Objetos e roupa',this)">Objetos e roupa</button>
      <button class="filter-btn" data-cat="Verbos" onclick="setFilter('Verbos',this)">Verbos</button>
      <button class="filter-btn" data-cat="Expressões" onclick="setFilter('Expressões',this)">Expressões</button>
      <button class="filter-btn" data-cat="Adjetivos e advérbios" onclick="setFilter('Adjetivos e advérbios',this)">Adjetivos e advérbios</button>
      <button class="filter-btn" data-cat="Conceitos" onclick="setFilter('Conceitos',this)">Conceitos</button>
    </div>
  </div>

  <div class="progress-bar-wrap"><div class="progress-bar" id="progressBar" style="width:0%"></div></div>
  <div class="progress-label" id="progressLabel">1 / ?</div>

  <div class="card" id="quizCard">
    <span class="category-badge" id="catBadge"></span>
    <div id="choiceArea">
      <div class="question" id="questionText"></div>
      <div class="options" id="optionsDiv"></div>
    </div>
    <div id="writeArea" style="display:none">
      <div class="ru-display" id="ruDisplay"></div>
      <div class="ru-hint-line" id="ruHintLine"></div>
      <div class="accent-note">Atenção: escreve com acentos correctos (ex.: coração, água, ação)</div>
      <div class="write-prompt">Escreve em português:</div>
      <div class="write-row">
        <input type="text" class="write-input" id="writeInput" placeholder="português..." autocomplete="off" autocorrect="off" spellcheck="false">
        <button class="check-btn" id="checkBtnW" onclick="checkWrite()">OK</button>
      </div>
    </div>
    <div id="fraseArea" style="display:none">
      <div class="sentence-display" id="sentenceDisplay"></div>
      <div class="frase-hint" id="fraseHint"></div>
      <div class="accent-note">Atenção: escreve com acentos correctos</div>
      <div class="write-row">
        <input type="text" class="write-input" id="fraseInput" placeholder="palavra em português..." autocomplete="off" autocorrect="off" spellcheck="false">
        <button class="check-btn" id="checkBtnF" onclick="checkFrase()">OK</button>
      </div>
    </div>
    <div class="feedback" id="feedback"></div>
    <button class="next-btn" id="nextBtn" onclick="nextQuestion()">Próxima →</button>
  </div>

  <div class="card results" id="resultsCard">
    <div class="score-circle"><div class="num" id="scoreNum">0</div><div class="denom" id="scoreDenom">/ 0</div></div>
    <h2 id="resultTitle"></h2><p id="resultMsg"></p>
    <div class="btn-row">
      <button class="restart-btn" onclick="restart()">Recomeçar</button>
      <a class="home-btn" href="index.html">Menu</a>
    </div>
    <div class="mistakes-list" id="mistakesList"></div>
  </div>
</div>
<footer>Português Europeu (PE) · Nível A2–B1</footer>

<script>
const allQ = [
  // ===== FAMÍLIA (40) =====
  { cat:"Família", badge:"badge-familia", q:"mãe", hint:"f.", answers:["мать", "мама"], options:["мать/мама", "внук", "мачеха", "тётя"], answer:0, ptAnswers:["mãe", "a mãe"], sentence:"A minha ___ chama-se Ana e é professora.", sentenceAnswers:["mãe"], explanation:"a mãe = мать, мама. O pai + a mãe = os pais (родители). Ex.: A minha mãe chama-se Ana e é professora." },
  { cat:"Família", badge:"badge-familia", q:"pai", hint:"m.", answers:["отец", "папа"], options:["отец/папа", "двоюродные братья и сёстры", "племянница", "пасынок"], answer:0, ptAnswers:["pai", "o pai"], sentence:"O ___ do João trabalha num hospital.", sentenceAnswers:["pai"], explanation:"o pai = отец, папа. Ex.: O pai do João trabalha num hospital." },
  { cat:"Família", badge:"badge-familia", q:"pais", hint:"m.pl.", answers:["родители"], options:["родители", "двоюродная сестра", "пасынок", "дедушка"], answer:0, ptAnswers:["pais", "os pais"], sentence:"Os meus ___ moram no Porto.", sentenceAnswers:["pais"], explanation:"os pais = родители. Не путать: os pais = родители, os países = страны. Ex.: Os meus pais moram no Porto." },
  { cat:"Família", badge:"badge-familia", q:"filho", hint:"m.", answers:["сын"], options:["сын", "тётя", "родитель (в документах)", "внук"], answer:0, ptAnswers:["filho", "o filho"], sentence:"O meu ___ anda na escola primária.", sentenceAnswers:["filho"], explanation:"o filho = сын. Ex.: O meu filho anda na escola primária." },
  { cat:"Família", badge:"badge-familia", q:"filha", hint:"f.", answers:["дочь"], options:["дочь", "племянница", "внуки", "отец"], answer:0, ptAnswers:["filha", "a filha"], sentence:"A ___ dela tem cinco anos.", sentenceAnswers:["filha"], explanation:"a filha = дочь. Ex.: A filha dela tem cinco anos." },
  { cat:"Família", badge:"badge-familia", q:"filhos", hint:"m.pl.", answers:["дети (сыновья и дочери)"], options:["дети (сыновья и дочери)", "сын", "бабушка и дедушка", "мачеха"], answer:0, ptAnswers:["filhos", "os filhos"], sentence:"Eles têm dois ___: um rapaz e uma rapariga.", sentenceAnswers:["filhos"], explanation:"os filhos = дети (сыновья и дочери). Os filhos = чьи-то дети; as crianças = дети вообще. Ex.: Eles têm dois filhos: um rapaz e uma rapariga." },
  { cat:"Família", badge:"badge-familia", q:"irmão", hint:"m.", answers:["брат"], options:["брат", "племянник", "шурин", "дядя и тётя"], answer:0, ptAnswers:["irmão", "o irmão"], sentence:"O meu ___ mais novo vive em Lisboa.", sentenceAnswers:["irmão"], explanation:"o irmão = брат. Ex.: O meu irmão mais novo vive em Lisboa." },
  { cat:"Família", badge:"badge-familia", q:"irmã", hint:"f.", answers:["сестра"], options:["сестра", "бабушка", "двоюродные братья и сёстры", "родители мужа / жены"], answer:0, ptAnswers:["irmã", "a irmã"], sentence:"Tenho uma ___ mais velha.", sentenceAnswers:["irmã"], explanation:"a irmã = сестра. Ex.: Tenho uma irmã mais velha." },

  { cat:"Aspeto físico", badge:"badge-aspeto", q:"usar óculos", hint:"выражение", answers:["носить очки"], options:["носить очки", "серый", "младший", "старший"], answer:0, ptAnswers:["usar óculos", "uso"], sentence:"Eu ___ óculos para ler.", sentenceAnswers:["uso"], explanation:"usar óculos = носить очки. Usar = носить (очки, одежду), а не только «использовать». Ex.: Eu uso óculos para ler." },

  { cat:"Personalidade e emoções", badge:"badge-personalidade", q:"desejo", hint:"m.", answers:["желание"], options:["желание", "радость", "страсть", "тоска"], answer:0, ptAnswers:["desejo"], sentence:"O meu maior ___ é viajar pelo mundo.", sentenceAnswers:["desejo"], explanation:"Desejo = желание. Desejar = хотеть, желать. Ex.: O meu maior desejo é viajar." },

  { cat:"Personalidade e emoções", badge:"badge-personalidade", q:"saudades", hint:"f.pl.", answers:["тоска", "ностальгия"], options:["тоска/ностальгия", "радость", "грусть", "одиночество"], answer:0, ptAnswers:["saudades"], sentence:"Tenho muitas ___ da minha família em Portugal.", sentenceAnswers:["saudades"], explanation:"Saudades = тоска, ностальгия (непереводимое слово). Tenho saudades de ti = я скучаю по тебе." },
  { cat:"Personalidade e emoções", badge:"badge-personalidade", q:"ter nojo de", hint:"выражение", answers:["испытывать отвращение к", "чувствовать тошноту от"], options:["испытывать отвращение к", "бояться", "скучать по", "стыдиться"], answer:0, ptAnswers:["ter nojo de"], sentence:"Ela tem ___ de baratas.", sentenceAnswers:["nojo"], explanation:"TER NOJO DE = испытывать отвращение. Que nojo! = Какая гадость! Estar com nojo = чувствовать тошноту прямо сейчас." },

  { cat:"Personalidade e emoções", badge:"badge-personalidade", q:"simpático/simpática", hint:"adj.", answers:["приятный", "дружелюбный", "милый"], options:["приятный/дружелюбный", "в плохом настроении", "нервный", "нетерпеливый"], answer:0, ptAnswers:["simpático", "simpática", "simpático/simpática"], sentence:"A vizinha é muito ___, cumprimenta sempre toda a gente.", sentenceAnswers:["simpática"], explanation:"simpático / simpática = приятный, дружелюбный, милый. В PT simpático = приятный в общении, а не «красивый». Ex.: A vizinha é muito simpática, cumprimenta sempre toda a gente." },
  { cat:"Personalidade e emoções", badge:"badge-personalidade", q:"antipático/antipática", hint:"adj.", answers:["неприятный", "недружелюбный"], options:["неприятный/недружелюбный", "раздражённый", "в плохом настроении", "мечтатель"], answer:0, ptAnswers:["antipático", "antipática", "antipático/antipática"], sentence:"O empregado foi ___ connosco.", sentenceAnswers:["antipático"], explanation:"antipático / antipática = неприятный, недружелюбный. Ex.: O empregado foi antipático connosco." },

  { cat:"Personalidade e emoções", badge:"badge-personalidade", q:"alegre", hint:"adj.", answers:["весёлый", "жизнерадостный"], options:["весёлый/жизнерадостный", "внимательный", "терпеливый", "неприятный"], answer:0, ptAnswers:["alegre"], sentence:"A minha tia é uma pessoa muito ___, está sempre a rir.", sentenceAnswers:["alegre"], explanation:"alegre = весёлый, жизнерадостный. Alegre — про характер и настроение. «Счастливый» = feliz. Ex.: A minha tia é uma pessoa muito alegre, está sempre a rir." },
  { cat:"Personalidade e emoções", badge:"badge-personalidade", q:"triste", hint:"adj.", answers:["грустный"], options:["грустный", "красота", "тревожный", "желание"], answer:0, ptAnswers:["triste"], sentence:"Estou ___ porque as férias acabaram.", sentenceAnswers:["triste"], explanation:"triste = грустный. Ex.: Estou triste porque as férias acabaram." },

  { cat:"Personalidade e emoções", badge:"badge-personalidade", q:"tranquilo/tranquila", hint:"adj.", answers:["спокойный", "безмятежный"], options:["спокойный/безмятежный", "скучать по", "застенчивый", "одиночество"], answer:0, ptAnswers:["tranquilo", "tranquila", "tranquilo/tranquila"], sentence:"O nosso bairro é muito ___ à noite.", sentenceAnswers:["tranquilo"], explanation:"tranquilo / tranquila = спокойный, безмятежный. Не «тихий», а «спокойный»; про место и про человека. Тихий (о звуке) — silencioso. Ex.: O nosso bairro é muito tranquilo à noite." },
  { cat:"Personalidade e emoções", badge:"badge-personalidade", q:"nervoso/nervosa", hint:"adj.", answers:["нервный", "взволнованный"], options:["нервный/взволнованный", "страсть", "впечатление", "радость"], answer:0, ptAnswers:["nervoso", "nervosa", "nervoso/nervosa"], sentence:"Fico sempre ___ antes de um exame.", sentenceAnswers:["nervoso"], explanation:"nervoso / nervosa = нервный, взволнованный. Ex.: Fico sempre nervoso antes de um exame." },

  { cat:"Personalidade e emoções", badge:"badge-personalidade", q:"introvertido/introvertida", hint:"adj.", answers:["замкнутый", "интроверт"], options:["замкнутый/интроверт", "весёлый", "спокойный", "мечтатель"], answer:0, ptAnswers:["introvertido", "introvertida", "introvertido/introvertida"], sentence:"Ele é ___, prefere ficar em casa a ler.", sentenceAnswers:["introvertido"], explanation:"introvertido / introvertida = замкнутый, интроверт. Ex.: Ele é introvertido, prefere ficar em casa a ler." },
  { cat:"Personalidade e emoções", badge:"badge-personalidade", q:"amigo/amiga", hint:"adj.", answers:["дружелюбный", "настоящий друг"], options:["дружелюбный/настоящий друг", "трудолюбивый", "рассеянный", "ленивый"], answer:0, ptAnswers:["amigo", "amiga", "amigo/amiga"], sentence:"O teu cão é muito ___ das crianças.", sentenceAnswers:["amigo"], explanation:"amigo / amiga = дружелюбный, настоящий друг. Ser amigo de alguém = хорошо относиться, дружить. Ex.: O teu cão é muito amigo das crianças." },

  { cat:"Personalidade e emoções", badge:"badge-personalidade", q:"trabalhador/trabalhadora", hint:"adj.", answers:["трудолюбивый"], options:["трудолюбивый", "тревожный", "честный", "ответственный"], answer:0, ptAnswers:["trabalhador", "trabalhadora", "trabalhador/trabalhadora"], sentence:"A Joana é muito ___, trabalha dez horas por dia.", sentenceAnswers:["trabalhadora"], explanation:"trabalhador / trabalhadora = трудолюбивый. Ex.: A Joana é muito trabalhadora, trabalha dez horas por dia." },
  { cat:"Personalidade e emoções", badge:"badge-personalidade", q:"preguiçoso/preguiçosa", hint:"adj.", answers:["ленивый"], options:["ленивый", "трудолюбивый", "радость", "пунктуальный"], answer:0, ptAnswers:["preguiçoso", "preguiçosa", "preguiçoso/preguiçosa"], sentence:"Ao domingo fico ___ e não saio do sofá.", sentenceAnswers:["preguiçosa"], explanation:"preguiçoso / preguiçosa = ленивый. A preguiça = лень. Ex.: Ao domingo fico preguiçosa e não saio do sofá." },
  { cat:"Personalidade e emoções", badge:"badge-personalidade", q:"responsável", hint:"adj.", answers:["ответственный"], options:["ответственный", "невоспитанный", "недоверие", "ласковый"], answer:0, ptAnswers:["responsável"], sentence:"Ele é ___: faz sempre os trabalhos a tempo.", sentenceAnswers:["responsável"], explanation:"responsável = ответственный. Ex.: Ele é responsável: faz sempre os trabalhos a tempo." },
  { cat:"Personalidade e emoções", badge:"badge-personalidade", q:"inteligente", hint:"adj.", answers:["умный"], options:["умный", "застенчивый", "надоесть", "страсть"], answer:0, ptAnswers:["inteligente"], sentence:"A tua sobrinha é muito ___.", sentenceAnswers:["inteligente"], explanation:"inteligente = умный. Ex.: A tua sobrinha é muito inteligente." },
  { cat:"Personalidade e emoções", badge:"badge-personalidade", q:"educado/educada", hint:"adj.", answers:["вежливый", "воспитанный"], options:["вежливый/воспитанный", "умный", "довольный", "организованный"], answer:0, ptAnswers:["educado", "educada", "educado/educada", "educados"], sentence:"Os teus filhos são muito ___, dizem sempre «obrigado».", sentenceAnswers:["educados"], explanation:"educado / educada = вежливый, воспитанный. Ложный друг: educado ≠ образованный (образованный = culto, instruído). Ex.: Os teus filhos são muito educados, dizem sempre «obrigado»." },
  { cat:"Personalidade e emoções", badge:"badge-personalidade", q:"mal-educado/mal-educada", hint:"adj.", answers:["невоспитанный", "грубый"], options:["невоспитанный/грубый", "ответственный", "чувствительный", "общительный"], answer:0, ptAnswers:["mal-educado", "mal-educada", "mal-educado/mal-educada"], sentence:"Não fales assim, é ___!", sentenceAnswers:["mal-educado"], explanation:"mal-educado / mal-educada = невоспитанный, грубый. Ex.: Não fales assim, é mal-educado!" },
  { cat:"Personalidade e emoções", badge:"badge-personalidade", q:"paciente", hint:"adj.", answers:["терпеливый"], options:["терпеливый", "упрямый", "умный", "рассеянный"], answer:0, ptAnswers:["paciente"], sentence:"A professora é muito ___ com os alunos.", sentenceAnswers:["paciente"], explanation:"paciente = терпеливый. Ter paciência = иметь терпение. Ex.: A professora é muito paciente com os alunos." },
  { cat:"Personalidade e emoções", badge:"badge-personalidade", q:"impaciente", hint:"adj.", answers:["нетерпеливый"], options:["нетерпеливый", "смелый", "замкнутый", "мечтатель"], answer:0, ptAnswers:["impaciente"], sentence:"Fico ___ quando o autocarro se atrasa.", sentenceAnswers:["impaciente"], explanation:"impaciente = нетерпеливый. Ex.: Fico impaciente quando o autocarro se atrasa." },
  { cat:"Personalidade e emoções", badge:"badge-personalidade", q:"honesto/honesta", hint:"adj.", answers:["честный"], options:["честный", "сострадательный", "надоесть", "ответственный"], answer:0, ptAnswers:["honesto", "honesta", "honesto/honesta"], sentence:"Ele é ___: diz sempre a verdade.", sentenceAnswers:["honesto"], explanation:"honesto / honesta = честный. Ex.: Ele é honesto: diz sempre a verdade." },
  { cat:"Personalidade e emoções", badge:"badge-personalidade", q:"sensível", hint:"adj.", answers:["чувствительный", "ранимый"], options:["чувствительный/ранимый", "упрямый", "влюбляться", "неприятный"], answer:0, ptAnswers:["sensível"], sentence:"Ela é muito ___ e chora com os filmes.", sentenceAnswers:["sensível"], explanation:"sensível = чувствительный, ранимый. Ex.: Ela é muito sensível e chora com os filmes." },
  { cat:"Personalidade e emoções", badge:"badge-personalidade", q:"corajoso/corajosa", hint:"adj.", answers:["смелый", "храбрый"], options:["смелый/храбрый", "организованный", "мечтатель", "неприятный"], answer:0, ptAnswers:["corajoso", "corajosa", "corajoso/corajosa"], sentence:"O bombeiro foi muito ___.", sentenceAnswers:["corajoso"], explanation:"corajoso / corajosa = смелый, храбрый. A coragem = смелость. Ex.: O bombeiro foi muito corajoso." },
  { cat:"Personalidade e emoções", badge:"badge-personalidade", q:"teimoso/teimosa", hint:"adj.", answers:["упрямый"], options:["упрямый", "в плохом настроении", "одиночество", "внимательный"], answer:0, ptAnswers:["teimoso", "teimosa", "teimoso/teimosa"], sentence:"O meu filho é ___: nunca muda de opinião.", sentenceAnswers:["teimoso"], explanation:"teimoso / teimosa = упрямый. Ex.: O meu filho é teimoso: nunca muda de opinião." },
  { cat:"Personalidade e emoções", badge:"badge-personalidade", q:"organizado/organizada", hint:"adj.", answers:["организованный", "аккуратный"], options:["организованный/аккуратный", "невоспитанный", "нервный", "ласковый"], answer:0, ptAnswers:["organizado", "organizada", "organizado/organizada"], sentence:"A minha secretária está sempre ___.", sentenceAnswers:["organizada"], explanation:"organizado / organizada = организованный, аккуратный. Ex.: A minha secretária está sempre organizada." },
  { cat:"Personalidade e emoções", badge:"badge-personalidade", q:"desorganizado/desorganizada", hint:"adj.", answers:["неорганизованный", "несобранный"], options:["неорганизованный/несобранный", "честный", "грустный", "ответственный"], answer:0, ptAnswers:["desorganizado", "desorganizada", "desorganizado/desorganizada"], sentence:"Sou um pouco ___ e perco sempre as chaves.", sentenceAnswers:["desorganizada"], explanation:"desorganizado / desorganizada = неорганизованный, несобранный. Ex.: Sou um pouco desorganizada e perco sempre as chaves." },
  { cat:"Personalidade e emoções", badge:"badge-personalidade", q:"atencioso/atenciosa", hint:"adj.", answers:["внимательный", "заботливый"], options:["внимательный/заботливый", "впечатление", "чувствительный", "в плохом настроении"], answer:0, ptAnswers:["atencioso", "atenciosa", "atencioso/atenciosa"], sentence:"O meu marido é muito ___: lembra-se de todas as datas.", sentenceAnswers:["atencioso"], explanation:"atencioso / atenciosa = внимательный, заботливый. Ex.: O meu marido é muito atencioso: lembra-se de todas as datas." },
  { cat:"Personalidade e emoções", badge:"badge-personalidade", q:"inseguro/insegura", hint:"adj.", answers:["неуверенный"], options:["неуверенный", "чувствительный", "желание", "вежливый"], answer:0, ptAnswers:["inseguro", "insegura", "inseguro/insegura"], sentence:"Ainda me sinto ___ quando falo ao telefone.", sentenceAnswers:["insegura"], explanation:"inseguro / insegura = неуверенный. Ex.: Ainda me sinto insegura quando falo ao telefone." },
  { cat:"Personalidade e emoções", badge:"badge-personalidade", q:"contente", hint:"adj.", answers:["довольный", "радостный"], options:["довольный/радостный", "уверенный", "трудолюбивый", "упрямый"], answer:0, ptAnswers:["contente"], sentence:"Fiquei muito ___ com a tua visita.", sentenceAnswers:["contente"], explanation:"contente = довольный, радостный. Не «счастливый» — это feliz. Ex.: Fiquei muito contente com a tua visita." },
  { cat:"Personalidade e emoções", badge:"badge-personalidade", q:"chateado/chateada", hint:"adj.", answers:["раздражённый", "расстроенный", "обиженный"], options:["раздражённый/расстроенный", "тревожный", "страсть", "скучать по"], answer:0, ptAnswers:["chateado", "chateada", "chateado/chateada"], sentence:"Ela está ___ comigo porque cheguei atrasada.", sentenceAnswers:["chateada"], explanation:"chateado / chateada = раздражённый, расстроенный, обиженный. Estar chateado com alguém = злиться/обижаться на кого-то. Chato = зануда, скучный. Ex.: Ela está chateada comigo porque cheguei atrasada." },
  { cat:"Personalidade e emoções", badge:"badge-personalidade", q:"estar farto de", hint:"выражение", answers:["надоесть", "быть сытым по горло"], options:["надоесть/быть сытым по горло", "довольный", "в плохом настроении", "уверенный"], answer:0, ptAnswers:["estar farto de", "fartos"], sentence:"Estamos ___ de chuva!", sentenceAnswers:["fartos"], explanation:"estar farto de = надоесть, быть сытым по горло. Estou farto/farta de… = мне надоело… Ex.: Estamos fartos de chuva!" },
  // ===== CORPO E SAÚDE (32) =====
  { cat:"Corpo e saúde", badge:"badge-corpo", q:"constipado", hint:"adj.", answers:["простуженный", "насморк (у меня)"], options:["простуженный/насморк", "сытый", "усталый", "сонный"], answer:0, ptAnswers:["constipado", "constipada"], sentence:"Estou ___ há dois dias e tenho muito nariz.", sentenceAnswers:["constipado", "constipada"], explanation:"Constipado = простуженный или насморк. Atenção: не значит 'constipated'! Estou constipado = у меня насморк." },
  { cat:"Corpo e saúde", badge:"badge-corpo", q:"nariz", hint:"m.", answers:["нос"], options:["нос", "ухо", "глаз", "рот"], answer:0, ptAnswers:["nariz"], sentence:"Estou constipado e tenho o ___ entupido.", sentenceAnswers:["nariz"], explanation:"Nariz = нос. Ex.: Estou com o nariz entupido = у меня заложен нос." },
  { cat:"Corpo e saúde", badge:"badge-corpo", q:"ouvido", hint:"m.", answers:["ухо", "слух"], options:["уши/слух", "глаза", "руки", "ноги"], answer:0, ptAnswers:["ouvido", "ouvidos"], sentence:"Tenho dores de ___ desde ontem à tarde.", sentenceAnswers:["ouvidos"], explanation:"Ouvido = ухо; слух. Ter bom ouvido = иметь хороший слух." },
  { cat:"Corpo e saúde", badge:"badge-corpo", q:"garganta", hint:"f.", answers:["горло"], options:["горло", "нос", "грудь", "живот"], answer:0, ptAnswers:["garganta"], sentence:"Tenho dores de ___ e dificuldade em engolir.", sentenceAnswers:["garganta"], explanation:"Garganta = горло. Ex.: Tenho dores de garganta = у меня болит горло." },
  { cat:"Corpo e saúde", badge:"badge-corpo", q:"gesso", hint:"m.", answers:["гипс"], options:["гипс", "бинт", "пластырь", "шина"], answer:0, ptAnswers:["gesso"], sentence:"Ele partiu o braço e ficou com ___ durante seis semanas.", sentenceAnswers:["gesso"], explanation:"Gesso = гипс. Ex.: Ele tem o braço no gesso = у него рука в гипсе." },
  { cat:"Corpo e saúde", badge:"badge-corpo", q:"medir a febre", hint:"выражение", answers:["измерять температуру", "мерить температуру"], options:["измерять температуру", "вызвать врача", "принять таблетку", "лечь в постель"], answer:0, ptAnswers:["medir a febre", "medir"], sentence:"Antes de ir ao médico, vou ___.", sentenceAnswers:["medir a febre"], explanation:"Medir a febre = измерять температуру. Ter febre = иметь температуру." },
  { cat:"Corpo e saúde", badge:"badge-corpo", q:"cérebro", hint:"m.", answers:["мозг"], options:["мозг", "сердце", "голова", "разум"], answer:0, ptAnswers:["cérebro"], sentence:"O ___ humano é muito complexo.", sentenceAnswers:["cérebro"], explanation:"Cérebro = мозг. Ex.: O cérebro humano é muito complexo." },
  { cat:"Corpo e saúde", badge:"badge-corpo", q:"ossos", hint:"m.pl.", answers:["кости"], options:["кости", "подбородок", "простуженный", "гипс"], answer:0, ptAnswers:["ossos", "os ossos"], sentence:"O cão está a roer os ___.", sentenceAnswers:["ossos"], explanation:"os ossos = кости. O osso = кость (у людей и животных). Ex.: O cão está a roer os ossos." },
  { cat:"Corpo e saúde", badge:"badge-corpo", q:"testa", hint:"f.", answers:["лоб"], options:["лоб", "локоть", "спина", "ухо (раковина)"], answer:0, ptAnswers:["testa", "a testa"], sentence:"Tenho uma dor na ___.", sentenceAnswers:["testa"], explanation:"a testa = лоб. Ex.: Tenho uma dor na testa." },
  { cat:"Corpo e saúde", badge:"badge-corpo", q:"queixo", hint:"m.", answers:["подбородок"], options:["подбородок", "ухо", "лоб", "болеть"], answer:0, ptAnswers:["queixo", "o queixo"], sentence:"Ele tem uma barba no ___.", sentenceAnswers:["queixo"], explanation:"o queixo = подбородок. Ex.: Ele tem uma barba no queixo." },
  { cat:"Corpo e saúde", badge:"badge-corpo", q:"sobrancelha", hint:"f.", answers:["бровь"], options:["бровь", "шея", "кости", "горло"], answer:0, ptAnswers:["sobrancelha", "a sobrancelha"], sentence:"Ela levantou a ___.", sentenceAnswers:["sobrancelha"], explanation:"a sobrancelha = бровь. Ex.: Ela levantou a sobrancelha." },
  { cat:"Corpo e saúde", badge:"badge-corpo", q:"orelha", hint:"f.", answers:["ухо (раковина)"], options:["ухо (раковина)", "кости", "живот", "спина"], answer:0, ptAnswers:["orelha", "a orelha", "orelhas"], sentence:"O menino tem as ___ grandes.", sentenceAnswers:["orelhas"], explanation:"a orelha = ухо (раковина). A orelha — снаружи, o ouvido — орган слуха. Ex.: O menino tem as orelhas grandes." },
  { cat:"Corpo e saúde", badge:"badge-corpo", q:"pescoço", hint:"m.", answers:["шея"], options:["шея", "лоб", "живот", "колено"], answer:0, ptAnswers:["pescoço", "o pescoço"], sentence:"Põe o cachecol no ___.", sentenceAnswers:["pescoço"], explanation:"o pescoço = шея. Ex.: Põe o cachecol no pescoço." },
  { cat:"Corpo e saúde", badge:"badge-corpo", q:"ombros", hint:"m.pl.", answers:["плечи"], options:["плечи", "горло", "измерять температуру", "ухо"], answer:0, ptAnswers:["ombros", "os ombros"], sentence:"Ela tem o cabelo pelos ___.", sentenceAnswers:["ombros"], explanation:"os ombros = плечи. Ex.: Ela tem o cabelo pelos ombros." },
  { cat:"Corpo e saúde", badge:"badge-corpo", q:"costas", hint:"f.pl.", answers:["спина"], options:["спина", "сжимать", "рука (от плеча до кисти)", "ухо (раковина)"], answer:0, ptAnswers:["costas", "as costas"], sentence:"Endireita as ___!", sentenceAnswers:["costas"], explanation:"as costas = спина. Всегда во мн. числе: as costas. Ex.: Endireita as costas!" },
  { cat:"Corpo e saúde", badge:"badge-corpo", q:"barriga", hint:"f.", answers:["живот"], options:["живот", "сжимать", "спина", "ухо (раковина)"], answer:0, ptAnswers:["barriga", "a barriga"], sentence:"Dói-me a ___.", sentenceAnswers:["barriga"], explanation:"a barriga = живот. Falar de barriga cheia = рассуждать, когда у самого всё хорошо. Ex.: Dói-me a barriga." },
  { cat:"Corpo e saúde", badge:"badge-corpo", q:"estômago", hint:"m.", answers:["желудок"], options:["желудок", "сгибать", "бровь", "подбородок"], answer:0, ptAnswers:["estômago", "o estômago"], sentence:"Comi demais e dói-me o ___.", sentenceAnswers:["estômago"], explanation:"o estômago = желудок. Ex.: Comi demais e dói-me o estômago." },
  { cat:"Corpo e saúde", badge:"badge-corpo", q:"braço", hint:"m.", answers:["рука (от плеча до кисти)"], options:["рука (от плеча до кисти)", "ударять(ся)", "пальцы", "грудь"], answer:0, ptAnswers:["braço", "o braço"], sentence:"Ele partiu o ___.", sentenceAnswers:["braço"], explanation:"o braço = рука (от плеча до кисти). Estar de braços cruzados = сидеть сложа руки. Ex.: Ele partiu o braço." },
  { cat:"Corpo e saúde", badge:"badge-corpo", q:"mão", hint:"f.", answers:["кисть руки", "рука"], options:["кисть руки/рука", "колено", "плечи", "грудь"], answer:0, ptAnswers:["mão", "a mão", "mãos"], sentence:"Lava as ___ depois da rua.", sentenceAnswers:["mãos"], explanation:"a mão = кисть руки, рука. Ex.: Lava as mãos depois da rua." },
  { cat:"Corpo e saúde", badge:"badge-corpo", q:"dedos", hint:"m.pl.", answers:["пальцы"], options:["пальцы", "сгибать", "грудь", "ухо"], answer:0, ptAnswers:["dedos", "os dedos"], sentence:"Tenho os ___ frios.", sentenceAnswers:["dedos"], explanation:"os dedos = пальцы. Ex.: Tenho os dedos frios." },
  { cat:"Corpo e saúde", badge:"badge-corpo", q:"pé", hint:"m.", answers:["ступня", "нога"], options:["ступня/нога", "желудок", "сгибать", "пальцы"], answer:0, ptAnswers:["pé", "o pé"], sentence:"Bati com o ___ na cadeira.", sentenceAnswers:["pé"], explanation:"o pé = ступня, нога. Andar a pé = ходить пешком; estar de pé = стоять; ao pé de = рядом с. Ex.: Bati com o pé na cadeira." },
  { cat:"Corpo e saúde", badge:"badge-corpo", q:"perna", hint:"f.", answers:["нога"], options:["нога", "гипс", "живот", "ухо (раковина)"], answer:0, ptAnswers:["perna", "a perna", "pernas"], sentence:"Doem-me as ___ quando treino muito.", sentenceAnswers:["pernas"], explanation:"a perna = нога. Ex.: Doem-me as pernas quando treino muito." },
  { cat:"Corpo e saúde", badge:"badge-corpo", q:"cotovelo", hint:"m.", answers:["локоть"], options:["локоть", "желудок", "гипс", "простуженный"], answer:0, ptAnswers:["cotovelo", "o cotovelo"], sentence:"Bati com o ___ na mesa.", sentenceAnswers:["cotovelo"], explanation:"o cotovelo = локоть. Ter dor de cotovelo = ревновать, завидовать. Ex.: Bati com o cotovelo na mesa." },
  { cat:"Corpo e saúde", badge:"badge-corpo", q:"joelho", hint:"m.", answers:["колено"], options:["колено", "рука (от плеча до кисти)", "растяжка", "мозг"], answer:0, ptAnswers:["joelho", "o joelho"], sentence:"Magoei-me no ___.", sentenceAnswers:["joelho"], explanation:"o joelho = колено. Ex.: Magoei-me no joelho." },
  { cat:"Corpo e saúde", badge:"badge-corpo", q:"peito", hint:"m.", answers:["грудь"], options:["грудь", "пальцы", "локоть", "гипс"], answer:0, ptAnswers:["peito", "o peito"], sentence:"Sinto uma dor no ___.", sentenceAnswers:["peito"], explanation:"o peito = грудь. Ex.: Sinto uma dor no peito." },
  { cat:"Corpo e saúde", badge:"badge-corpo", q:"endireitar", hint:"v.", answers:["выпрямлять"], options:["выпрямлять", "нос", "сгибать", "колено"], answer:0, ptAnswers:["endireitar", "endireita"], sentence:"___ as costas quando te sentas!", sentenceAnswers:["endireita"], explanation:"endireitar = выпрямлять. Endireitar-se = выпрямиться. Ex.: Endireita as costas quando te sentas!" },
  { cat:"Corpo e saúde", badge:"badge-corpo", q:"esticar", hint:"v.", answers:["вытягивать", "растягивать"], options:["вытягивать/растягивать", "подбородок", "рука (от плеча до кисти)", "сжимать"], answer:0, ptAnswers:["esticar", "estica"], sentence:"___ as pernas antes de correr.", sentenceAnswers:["estica"], explanation:"esticar = вытягивать, растягивать. Estar a esticar-se = перегибать палку. Ex.: Estica as pernas antes de correr." },
  { cat:"Corpo e saúde", badge:"badge-corpo", q:"dobrar", hint:"v.", answers:["сгибать", "складывать"], options:["сгибать/складывать", "спина", "ударять(ся)", "лоб"], answer:0, ptAnswers:["dobrar", "dobra"], sentence:"___ os joelhos devagar.", sentenceAnswers:["dobra"], explanation:"dobrar = сгибать, складывать. Ex.: Dobra os joelhos devagar." },
  { cat:"Corpo e saúde", badge:"badge-corpo", q:"apertar", hint:"v.", answers:["сжимать", "застёгивать", "пожимать"], options:["сжимать/застёгивать", "ударять(ся)", "грудь", "гипс"], answer:0, ptAnswers:["apertar", "apertaram"], sentence:"Aperta o cinto! / Eles ___ as mãos.", sentenceAnswers:["apertaram"], explanation:"apertar = сжимать, застёгивать, пожимать. Apertar a mão = пожать руку; apertar o casaco = застегнуть. Ex.: Aperta o cinto! / Eles apertaram as mãos." },

  { cat:"Verbos", badge:"badge-verbos", q:"pôr (pusemos)", hint:"v.", answers:["класть (мы положили)", "pôr = класть/ставить"], options:["мы положили/поставили", "мы взяли", "мы убрали", "мы нашли"], answer:0, ptAnswers:["pusemos", "pôr", "por"], sentence:"Nós ___ a mesa para o jantar.", sentenceAnswers:["pusemos"], explanation:"Pôr = класть, ставить. Nós pusemos = мы положили (PPS). Ex.: Pusemos a mesa = накрыли стол." },
  { cat:"Verbos", badge:"badge-verbos", q:"magoar", hint:"v.", answers:["обидеть", "причинить боль"], options:["мы обидели", "мы помогли", "мы услышали", "мы забыли"], answer:0, ptAnswers:["magoar", "magoamos"], sentence:"Sem querer, nós ___ os sentimentos dela.", sentenceAnswers:["magoamos"], explanation:"Magoar = обидеть, причинить боль. Magoei-me = я ушиб(ла)ся." },
  { cat:"Verbos", badge:"badge-verbos", q:"emprestar", hint:"v.", answers:["одалживать", "давать взаймы"], options:["одалживает", "берёт взаймы", "покупает", "дарит"], answer:0, ptAnswers:["emprestar", "empresta"], sentence:"Ela sempre ___ os seus livros aos amigos.", sentenceAnswers:["empresta"], explanation:"Emprestar = одалживать. Ex.: Podes emprestar-me o livro?" },
  { cat:"Verbos", badge:"badge-verbos", q:"despedir-se", hint:"v.", answers:["прощаться", "попрощаться"], options:["прощаться", "встречаться", "уходить", "приходить"], answer:0, ptAnswers:["despedir-se", "despedir-nos", "despedirmo-nos"], sentence:"Fomos ___ dele antes da viagem.", sentenceAnswers:["despedir-nos", "despedirmo-nos"], explanation:"Despedir-se = прощаться. Ex.: Fomos despedir-nos dele = мы пошли с ним проститься." },
  { cat:"Verbos", badge:"badge-verbos", q:"esquiar", hint:"v.", answers:["кататься на лыжах"], options:["катался на лыжах", "катался на велосипеде", "плавал", "бегал"], answer:0, ptAnswers:["esquiar", "esquiei"], sentence:"No inverno passado ___ pela primeira vez na vida.", sentenceAnswers:["esquiei"], explanation:"Esquiar = кататься на лыжах. Eu esquiei = я катался/ась (PPS)." },
  { cat:"Verbos", badge:"badge-verbos", q:"andar de patins", hint:"выражение", answers:["кататься на коньках", "кататься на роликах"], options:["кататься на коньках/роликах", "кататься на лыжах", "ехать на велосипеде", "прыгать"], answer:0, ptAnswers:["andar de patins"], sentence:"Ao fim de semana gosto de ___ no parque.", sentenceAnswers:["andar de patins"], explanation:"Andar de patins = кататься на коньках или роликах. Patins de gelo = коньки." },
  { cat:"Verbos", badge:"badge-verbos", q:"conviver", hint:"v.", answers:["общаться", "жить вместе"], options:["общаться/жить вместе", "trabalhar", "учиться", "путешествовать"], answer:0, ptAnswers:["conviver"], sentence:"É muito importante ___ com a família e os amigos.", sentenceAnswers:["conviver"], explanation:"Conviver = общаться, жить вместе. Ex.: É importante conviver com a família." },
  { cat:"Verbos", badge:"badge-verbos", q:"fugir", hint:"v.", answers:["сбежать", "убежать"], options:["сбежать", "узнать", "управлять", "реагировать"], answer:0, ptAnswers:["fugir"], sentence:"O ladrão tentou ___ da polícia.", sentenceAnswers:["fugir"], explanation:"Fugir = сбежать, убежать. Ex.: O ladrão tentou fugir da polícia." },
  { cat:"Verbos", badge:"badge-verbos", q:"descobrir", hint:"v.", answers:["узнать", "открыть", "обнаружить"], options:["узнать/открыть", "зажечь", "заменить", "бросить"], answer:0, ptAnswers:["descobrir"], sentence:"Ela ___ a verdade por acidente.", sentenceAnswers:["descobriu"], explanation:"Descobrir = узнать, открыть, обнаружить. Ex.: Ela descobriu a verdade por acidente." },
  { cat:"Verbos", badge:"badge-verbos", q:"acender", hint:"v.", answers:["зажечь", "включить (свет)"], options:["зажечь/включить", "убежать", "заменить", "светить"], answer:0, ptAnswers:["acender"], sentence:"Podes ___ a luz, por favor?", sentenceAnswers:["acender"], explanation:"Acender = зажечь, включить (свет). Apagar = выключить." },
  { cat:"Verbos", badge:"badge-verbos", q:"reagir", hint:"v.", answers:["реагировать"], options:["реагировать", "управлять", "бросать", "отправлять"], answer:0, ptAnswers:["reagir"], sentence:"Como é que ela vai ___ à notícia?", sentenceAnswers:["reagir"], explanation:"Reagir = реагировать. Ex.: Como é que ela vai reagir à notícia?" },
  { cat:"Verbos", badge:"badge-verbos", q:"substituir", hint:"v.", answers:["заменить"], options:["заменить", "объединить", "передать", "назначить"], answer:0, ptAnswers:["substituir"], sentence:"Temos de ___ o professor que ficou doente.", sentenceAnswers:["substituir"], explanation:"Substituir = заменить. Ex.: Temos de substituir o professor que ficou doente." },
  { cat:"Verbos", badge:"badge-verbos", q:"atirar", hint:"v.", answers:["бросать", "стрелять"], options:["бросать/стрелять", "зажигать", "управлять", "узнавать"], answer:0, ptAnswers:["atirar"], sentence:"Ela ___ a bola para ele.", sentenceAnswers:["atirou", "atirar"], explanation:"Atirar = бросать или стрелять. Ex.: Ela atirou a bola para ele." },
  { cat:"Verbos", badge:"badge-verbos", q:"enfrentar", hint:"v.", answers:["противостоять", "встретить лицом к лицу"], options:["противостоять", "убежать", "заменить", "потерять"], answer:0, ptAnswers:["enfrentar"], sentence:"Temos de ___ os nossos medos.", sentenceAnswers:["enfrentar"], explanation:"Enfrentar = противостоять, встретить лицом к лицу. Enfrentar um problema = справиться с проблемой." },
  { cat:"Verbos", badge:"badge-verbos", q:"enviar", hint:"v.", answers:["отправить"], options:["отправить", "наблюдать", "собрать", "искать"], answer:0, ptAnswers:["enviar"], sentence:"Podes ___ o documento por email?", sentenceAnswers:["enviar"], explanation:"Enviar = отправить. Ex.: Podes enviar o documento por email?" },
  { cat:"Verbos", badge:"badge-verbos", q:"surgir", hint:"v.", answers:["возникнуть", "появиться"], options:["возникнуть/появиться", "исчезнуть", "остаться", "бежать"], answer:0, ptAnswers:["surgir"], sentence:"___ um problema inesperado no sistema.", sentenceAnswers:["surgiu"], explanation:"Surgir = возникнуть, появиться. Ex.: Surgiu um problema inesperado." },
  { cat:"Verbos", badge:"badge-verbos", q:"lidar com", hint:"выражение", answers:["справляться с"], options:["справляться с", "убегать от", "бросить", "объединить"], answer:0, ptAnswers:["lidar"], sentence:"É difícil ___ com o stress do trabalho.", sentenceAnswers:["lidar"], explanation:"Lidar com = справляться с чем-то. Ex.: Não sei lidar com esta situação." },
  { cat:"Verbos", badge:"badge-verbos", q:"procurar", hint:"v.", answers:["искать"], options:["искать", "помнить", "учить", "наблюдать"], answer:0, ptAnswers:["procurar"], sentence:"Estou a ___ as minhas chaves.", sentenceAnswers:["procurar"], explanation:"Procurar = искать. Ex.: Estou a procurar as minhas chaves." },
  { cat:"Verbos", badge:"badge-verbos", q:"brilhar", hint:"v.", answers:["сиять", "блестеть"], options:["сиять/блестеть", "гореть", "светить", "темнеть"], answer:0, ptAnswers:["brilhar"], sentence:"Os olhos dela ___ de alegria.", sentenceAnswers:["brilhavam", "brilhar"], explanation:"Brilhar = сиять, блестеть. Ex.: Os olhos dela brilhavam de alegria." },
  { cat:"Verbos", badge:"badge-verbos", q:"transmitir", hint:"v.", answers:["передать", "транслировать"], options:["передать", "получить", "отправить", "наблюдать"], answer:0, ptAnswers:["transmitir"], sentence:"Ele conseguiu ___ a sua emoção ao público.", sentenceAnswers:["transmitir"], explanation:"Transmitir = передать. Ex.: Ele conseguiu transmitir a sua emoção ao público." },
  { cat:"Verbos", badge:"badge-verbos", q:"lembrar", hint:"v.", answers:["помнить", "вспоминать"], options:["помнить", "забыть", "искать", "знать"], answer:0, ptAnswers:["lembrar", "lembrar-se"], sentence:"Não me ___ do nome dele.", sentenceAnswers:["lembro"], explanation:"Lembrar = помнить. Não me lembro = не помню. Lembrar-se de = вспомнить о чём-то." },
  { cat:"Verbos", badge:"badge-verbos", q:"combinar", hint:"v.", answers:["договориться", "объединить"], options:["объединить/договориться", "отменить", "разделить", "сравнить"], answer:0, ptAnswers:["combinar"], sentence:"Vamos ___ um encontro para a próxima semana.", sentenceAnswers:["combinar"], explanation:"Combinar = объединить, сочетать, договориться. Ex.: Vamos combinar um encontro." },
  { cat:"Verbos", badge:"badge-verbos", q:"tornar-se", hint:"v.", answers:["стать", "сделаться"], options:["стать/сделать", "вернуть", "повернуть", "дать"], answer:0, ptAnswers:["tornar-se", "tornar"], sentence:"Ela ___ famosa com o primeiro livro.", sentenceAnswers:["tornou-se"], explanation:"Tornar(-se) = стать. Ex.: Ela tornou-se famosa. Tornar possível = сделать возможным." },
  { cat:"Verbos", badge:"badge-verbos", q:"rever", hint:"v.", answers:["снова увидеть", "встретиться снова"], options:["снова увидеть", "пересмотреть мнение", "вернуться", "забыть"], answer:0, ptAnswers:["rever"], sentence:"Foi tão bom ___ os amigos da infância.", sentenceAnswers:["rever"], explanation:"REVER = снова увидеть (после долгой разлуки). RE + VER. Que bom revê-la! = Как хорошо снова её увидеть!" },
  { cat:"Verbos", badge:"badge-verbos", q:"tentar", hint:"v.", answers:["стараться", "пытаться"], options:["стараться/пытаться", "успевать", "мочь", "хотеть"], answer:0, ptAnswers:["tentar"], sentence:"Vou ___ resolver o problema.", sentenceAnswers:["tentar"], explanation:"TENTAR = стараться, пытаться. Tentei mas não consegui = Я пытался, но не смог. Não confundir com CONSEGUIR (удаётся)." },
  { cat:"Verbos", badge:"badge-verbos", q:"experimentar", hint:"v.", answers:["попробовать", "испытать"], options:["попробовать/испытать", "приготовить", "купить", "предложить"], answer:0, ptAnswers:["experimentar"], sentence:"Queres ___ este bolo?", sentenceAnswers:["experimentar"], explanation:"EXPERIMENTAR = попробовать (еду, одежду, опыт). Vou experimentar a nova receita = Попробую новый рецепт. Mais amplo que PROVAR." },
  { cat:"Verbos", badge:"badge-verbos", q:"provar", hint:"v.", answers:["пробовать еду", "доказывать"], options:["пробовать еду", "готовить", "покупать", "нравиться"], answer:0, ptAnswers:["provar"], sentence:"___ este queijo — é delicioso!", sentenceAnswers:["prova"], explanation:"PROVAR = пробовать на вкус. Pode ser imperativo: Prova! = Попробуй! Também: provar (доказывать): provar que é inocente." },
  { cat:"Verbos", badge:"badge-verbos", q:"saborear", hint:"v.", answers:["смаковать", "наслаждаться вкусом"], options:["смаковать", "есть быстро", "готовить", "пробовать впервые"], answer:0, ptAnswers:["saborear"], sentence:"Ela ___ cada gole de café devagar.", sentenceAnswers:["saboreou"], explanation:"SABOREAR = смаковать, наслаждаться вкусом медленно. Saborear = sabor (вкус) + ear. Mais enfático que provar." },
  { cat:"Verbos", badge:"badge-verbos", q:"esconder", hint:"v.", answers:["прятать", "скрывать"], options:["прятать/скрывать", "искать", "находить", "давать"], answer:0, ptAnswers:["esconder"], sentence:"A criança ___ o brinquedo debaixo da cama.", sentenceAnswers:["escondeu"], explanation:"ESCONDER = прятать. ESCONDER-SE = прятаться. Onde está o gato escondido? = Где спрятался кот?" },
  { cat:"Verbos", badge:"badge-verbos", q:"aproveitar", hint:"v.", answers:["воспользоваться", "насладиться"], options:["воспользоваться/насладиться", "потерять", "ждать", "пропустить"], answer:0, ptAnswers:["aproveitar"], sentence:"___ o bom tempo e vai à praia!", sentenceAnswers:["aproveita"], explanation:"APROVEITAR = воспользоваться, не упустить момент. Aproveitar a vida = наслаждаться жизнью. Aproveitar a oportunidade = воспользоваться возможностью." },
  { cat:"Verbos", badge:"badge-verbos", q:"culpar", hint:"v.", answers:["винить", "обвинять"], options:["винить", "прощать", "помогать", "понимать"], answer:0, ptAnswers:["culpar"], sentence:"Não me ___ pelo que aconteceu!", sentenceAnswers:["culpes", "culpar"], explanation:"CULPAR = винить. A culpa = вина. Ter culpa = быть виноватым. Não é culpa minha = Это не моя вина." },
  { cat:"Verbos", badge:"badge-verbos", q:"desculpar", hint:"v.", answers:["прощать", "извинять"], options:["прощать", "обвинять", "забывать", "понимать"], answer:0, ptAnswers:["desculpar"], sentence:"___-me pelo atraso!", sentenceAnswers:["desculpa"], explanation:"DESCULPAR = прощать, извинять. Desculpa! = Извини! (неформ.) Peço desculpa = Прошу прощения. DES+CULPAR = снять вину." },
  { cat:"Verbos", badge:"badge-verbos", q:"fazer malha", hint:"выражение", answers:["вязать"], options:["вязать", "причёсываться", "обидеть", "присматривать за"], answer:0, ptAnswers:["fazer malha"], sentence:"A minha avó gosta de ___ ao fim da tarde.", sentenceAnswers:["fazer malha"], explanation:"fazer malha = вязать. PT-PT fazer malha; ещё tricotar. Ex.: A minha avó gosta de fazer malha ao fim da tarde." },
  { cat:"Verbos", badge:"badge-verbos", q:"tomar conta de", hint:"выражение", answers:["присматривать за", "заботиться о"], options:["присматривать за/заботиться о", "отказываться", "класть (мы положили)", "исправлять"], answer:0, ptAnswers:["tomar conta de", "toma conta"], sentence:"A avó ___ dos netos durante as férias.", sentenceAnswers:["toma conta"], explanation:"tomar conta de = присматривать за, заботиться о. Tomar conta das crianças = присматривать за детьми. Ex.: A avó toma conta dos netos durante as férias." },
  { cat:"Verbos", badge:"badge-verbos", q:"contar", hint:"v.", answers:["рассказывать", "считать"], options:["рассказывать/считать", "менять", "уносить", "следовать"], answer:0, ptAnswers:["contar", "conta"], sentence:"Conta-me o que aconteceu ontem! / Ele ___ uma história aos filhos.", sentenceAnswers:["conta"], explanation:"contar = рассказывать, считать. Contar uma história = рассказать; contar até dez = считать. Ex.: Conta-me o que aconteceu ontem! / Ele conta uma história aos filhos." },
  { cat:"Verbos", badge:"badge-verbos", q:"imprimir", hint:"v.", answers:["печатать (на принтере)"], options:["печатать (на принтере)", "делить", "договориться", "прощать"], answer:0, ptAnswers:["imprimir"], sentence:"Preciso de ___ duas folhas a preto e branco.", sentenceAnswers:["imprimir"], explanation:"imprimir = печатать (на принтере). Ex.: Preciso de imprimir duas folhas a preto e branco." },
  { cat:"Verbos", badge:"badge-verbos", q:"dividir", hint:"v.", answers:["делить"], options:["делить", "прятать", "печатать (на принтере)", "стараться"], answer:0, ptAnswers:["dividir"], sentence:"Vamos ___ a conta?", sentenceAnswers:["dividir"], explanation:"dividir = делить. Ex.: Vamos dividir a conta?" },
  { cat:"Verbos", badge:"badge-verbos", q:"discutir", hint:"v.", answers:["обсуждать", "спорить"], options:["обсуждать/спорить", "воспользоваться", "менять", "брать"], answer:0, ptAnswers:["discutir", "discutem"], sentence:"Eles ___ sempre sobre política.", sentenceAnswers:["discutem"], explanation:"discutir = обсуждать, спорить. Ex.: Eles discutem sempre sobre política." },
  { cat:"Verbos", badge:"badge-verbos", q:"mentir", hint:"v.", answers:["лгать"], options:["лгать", "защищать", "вязать", "садиться"], answer:0, ptAnswers:["mentir", "minto"], sentence:"Eu nunca ___.", sentenceAnswers:["minto"], explanation:"mentir = лгать. Eu minto (e→i). A mentira = ложь. Ex.: Eu nunca minto." },
  { cat:"Verbos", badge:"badge-verbos", q:"tossir", hint:"v.", answers:["кашлять"], options:["кашлять", "забрать", "звонить", "противостоять"], answer:0, ptAnswers:["tossir", "tusso"], sentence:"Eu ___ muito quando estou constipada.", sentenceAnswers:["tusso"], explanation:"tossir = кашлять. Eu tusso (o→u). Ex.: Eu tusso muito quando estou constipada." },
  { cat:"Verbos", badge:"badge-verbos", q:"conduzir", hint:"v.", answers:["водить (машину)"], options:["водить (машину)", "выговориться", "приезжать", "ненавидеть"], answer:0, ptAnswers:["conduzir", "conduz"], sentence:"Ele ___ muito bem.", sentenceAnswers:["conduz"], explanation:"conduzir = водить (машину). Ele conduz (без -e). Escola de condução = автошкола. Ex.: Ele conduz muito bem." },
  { cat:"Verbos", badge:"badge-verbos", q:"traduzir", hint:"v.", answers:["переводить"], options:["переводить", "ловить", "длиться", "забрать"], answer:0, ptAnswers:["traduzir"], sentence:"Podes ___ esta frase?", sentenceAnswers:["traduzir"], explanation:"traduzir = переводить. Ex.: Podes traduzir esta frase?" },
  { cat:"Verbos", badge:"badge-verbos", q:"corrigir", hint:"v.", answers:["исправлять"], options:["исправлять", "отправить", "убирать", "ложиться"], answer:0, ptAnswers:["corrigir", "corrige"], sentence:"A professora ___ os erros.", sentenceAnswers:["corrige"], explanation:"corrigir = исправлять. Eu corrijo. Ex.: A professora corrige os erros." },
  { cat:"Verbos", badge:"badge-verbos", q:"proteger", hint:"v.", answers:["защищать"], options:["защищать", "уносить", "вставать", "забрать"], answer:0, ptAnswers:["proteger", "protege"], sentence:"O protetor solar ___ a pele.", sentenceAnswers:["protege"], explanation:"proteger = защищать. Eu protejo. Ex.: O protetor solar protege a pele." },
  { cat:"Verbos", badge:"badge-verbos", q:"nascer", hint:"v.", answers:["рождаться"], options:["рождаться", "засыпать", "исправлять", "узнать"], answer:0, ptAnswers:["nascer", "nasci"], sentence:"Eu ___ em 1980.", sentenceAnswers:["nasci"], explanation:"nascer = рождаться. Eu nasço; eu nasci. «Ele foi nascido» — неправильно, правильно ele nasceu. Ex.: Eu nasci em 1980." },
  { cat:"Verbos", badge:"badge-verbos", q:"crescer", hint:"v.", answers:["расти"], options:["расти", "помнить", "попробовать", "пересекать"], answer:0, ptAnswers:["crescer", "crescem"], sentence:"As crianças ___ muito depressa.", sentenceAnswers:["crescem"], explanation:"crescer = расти. Ex.: As crianças crescem muito depressa." },
  { cat:"Verbos", badge:"badge-verbos", q:"descer", hint:"v.", answers:["спускаться"], options:["спускаться", "развлекаться", "кашлять", "трясти"], answer:0, ptAnswers:["descer"], sentence:"Vamos ___ as escadas.", sentenceAnswers:["descer"], explanation:"descer = спускаться. Ex.: Vamos descer as escadas." },

  { cat:"Verbos", badge:"badge-verbos", q:"demorar", hint:"v.", answers:["длиться", "занимать время", "задерживаться"], options:["длиться/занимать время", "останавливать(ся)", "справляться с", "благодарить"], answer:0, ptAnswers:["demorar", "demora"], sentence:"Quanto tempo ___ um jogo de futebol?", sentenceAnswers:["demora"], explanation:"demorar = длиться, занимать время, задерживаться. Ex.: Quanto tempo demora um jogo de futebol?" },
  { cat:"Verbos", badge:"badge-verbos", q:"estacionar", hint:"v.", answers:["парковаться"], options:["парковаться", "одеваться", "посещать (регулярно)", "расти"], answer:0, ptAnswers:["estacionar", "estaciono"], sentence:"___ sempre à frente da escola.", sentenceAnswers:["estaciono"], explanation:"estacionar = парковаться. Ex.: Estaciono sempre à frente da escola." },
  { cat:"Verbos", badge:"badge-verbos", q:"limpar", hint:"v.", answers:["убирать", "чистить"], options:["убирать/чистить", "исправлять", "трясти", "прятать"], answer:0, ptAnswers:["limpar", "limpo"], sentence:"Ao sábado ___ a casa.", sentenceAnswers:["limpo"], explanation:"limpar = убирать, чистить. Ex.: Ao sábado limpo a casa." },

function shuffle(arr) { return [...arr].sort(() => Math.random() - 0.5); }

// Strict matching: case-insensitive, accents required
function matchPT(input, accepted) {
  const raw = input.toLowerCase().trim();
  return accepted.some(a => a.toLowerCase() === raw);
}

let mode = 'choice';
let activeFilter = 'Todos';
let questions = [];
let current = 0;
let score = 0;
let mistakes = [];
let answered = false;
let shuffledOpts = [];

function setMode(m) {
  mode = m;
  document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('btn' + m.charAt(0).toUpperCase() + m.slice(1)).classList.add('active');
  restart();
}

function setFilter(cat, btn) {
  activeFilter = cat;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active-f'));
  btn.classList.add('active-f');
  restart();
}

function restart() {
  let pool = activeFilter === 'Todos' ? allQ : allQ.filter(q => q.cat === activeFilter);
  questions = shuffle(pool);
  current = 0; score = 0; mistakes = [];
  document.getElementById('quizCard').style.display = 'block';
  document.getElementById('resultsCard').classList.remove('show');
  showQuestion();
}

function showQuestion() {
  if (current >= questions.length) { showResults(); return; }
  const q = questions[current];
  answered = false;

  document.getElementById('progressBar').style.width = (current / questions.length * 100) + '%';
  document.getElementById('progressLabel').textContent = (current + 1) + ' / ' + questions.length;

  const badge = document.getElementById('catBadge');
  badge.textContent = q.cat;
  badge.className = 'category-badge ' + q.badge;

  const fb = document.getElementById('feedback');
  fb.className = 'feedback'; fb.textContent = '';
  document.getElementById('nextBtn').classList.remove('show');

  ['choiceArea','writeArea','fraseArea'].forEach(id => document.getElementById(id).style.display = 'none');

  if (mode === 'choice') {
    document.getElementById('choiceArea').style.display = 'block';
    document.getElementById('questionText').textContent = '\u00ab' + q.q + '\u00bb \u2014 \u0447\u0442\u043e \u044d\u0442\u043e?';
    const indexed = q.options.map((opt, i) => ({ opt, correct: i === q.answer }));
    shuffledOpts = shuffle(indexed);
    const div = document.getElementById('optionsDiv');
    div.innerHTML = '';
    shuffledOpts.forEach((item, i) => {
      const btn = document.createElement('button');
      btn.className = 'option-btn';
      btn.textContent = item.opt;
      btn.onclick = () => checkChoice(i, btn);
      div.appendChild(btn);
    });

  } else if (mode === 'write') {
    document.getElementById('writeArea').style.display = 'block';
    document.getElementById('ruDisplay').textContent = q.answers[0];
    document.getElementById('ruHintLine').textContent = q.hint + (q.answers.length > 1 ? '  \u00b7  ' + q.answers.slice(1).join(' / ') : '');
    const inp = document.getElementById('writeInput');
    inp.value = ''; inp.className = 'write-input'; inp.disabled = false;
    document.getElementById('checkBtnW').disabled = false;
    setTimeout(() => inp.focus(), 50);

  } else {
    document.getElementById('fraseArea').style.display = 'block';
    const parts = q.sentence.split('___');
    const sd = document.getElementById('sentenceDisplay');
    sd.innerHTML = '';
    sd.appendChild(document.createTextNode(parts[0]));
    const blank = document.createElement('span');
    blank.className = 'sentence-blank'; blank.textContent = '___'; blank.id = 'blankSpan';
    sd.appendChild(blank);
    sd.appendChild(document.createTextNode(parts[1] || ''));
    document.getElementById('fraseHint').innerHTML = '\u041f\u0435\u0440\u0435\u0432\u043e\u0434: <span>' + q.answers[0] + '</span>  \u00b7  ' + q.hint;
    const inp = document.getElementById('fraseInput');
    inp.value = ''; inp.className = 'write-input'; inp.disabled = false;
    document.getElementById('checkBtnF').disabled = false;
    setTimeout(() => inp.focus(), 50);
  }
}

function checkChoice(idx, btn) {
  if (answered) return;
  answered = true;
  const q = questions[current];
  document.querySelectorAll('.option-btn').forEach((b, i) => {
    b.disabled = true;
    if (shuffledOpts[i].correct) b.classList.add('correct');
  });
  const fb = document.getElementById('feedback');
  if (shuffledOpts[idx].correct) {
    score++; btn.classList.add('correct');
    fb.className = 'feedback ok show';
    fb.textContent = 'Correto! ' + q.explanation;
  } else {
    btn.classList.add('wrong');
    fb.className = 'feedback err show';
    fb.textContent = 'Errado. ' + q.explanation;
    mistakes.push({ q: q.q, explanation: q.explanation });
  }
  showNext();
}

function checkWrite() {
  if (answered) return;
  const q = questions[current];
  const inp = document.getElementById('writeInput');
  const raw = inp.value.trim();
  if (!raw) return;
  answered = true; inp.disabled = true;
  document.getElementById('checkBtnW').disabled = true;
  const correct = matchPT(raw, q.ptAnswers);
  const fb = document.getElementById('feedback');
  if (correct) {
    score++; inp.className = 'write-input correct-inp';
    fb.className = 'feedback ok show';
    fb.textContent = 'Correto! ' + q.explanation;
  } else {
    inp.className = 'write-input wrong-inp';
    fb.className = 'feedback err show';
    fb.textContent = 'Errado. Correto: ' + q.ptAnswers[0] + '. ' + q.explanation;
    mistakes.push({ q: q.answers[0] + ' (' + q.hint + ')', explanation: 'Correto: ' + q.ptAnswers[0] });
  }
  showNext();
}

function checkFrase() {
  if (answered) return;
  const q = questions[current];
  const inp = document.getElementById('fraseInput');
  const raw = inp.value.trim();
  if (!raw) return;
  answered = true; inp.disabled = true;
  document.getElementById('checkBtnF').disabled = true;
  const correct = matchPT(raw, q.sentenceAnswers);
  const blank = document.getElementById('blankSpan');
  const fb = document.getElementById('feedback');
  if (correct) {
    score++;
    blank.textContent = raw; blank.style.color = '#276749'; blank.style.borderColor = '#68d391';
    inp.className = 'write-input correct-inp';
    fb.className = 'feedback ok show';
    fb.textContent = 'Correto! ' + q.explanation;
  } else {
    blank.textContent = q.sentenceAnswers[0]; blank.style.color = '#c53030'; blank.style.borderColor = '#fc8181';
    inp.className = 'write-input wrong-inp';
    fb.className = 'feedback err show';
    fb.textContent = 'Errado. Correto: ' + q.sentenceAnswers[0] + '. ' + q.explanation;
    mistakes.push({ q: q.sentence.replace('___', '___'), explanation: 'Correto: ' + q.sentenceAnswers[0] });
  }
  showNext();
}

function showNext() {
  const btn = document.getElementById('nextBtn');
  btn.textContent = current < questions.length - 1 ? 'Pr\u00f3xima \u2192' : 'Ver resultados \u2192';
  btn.classList.add('show');
}

function nextQuestion() { current++; showQuestion(); }

function showResults() {
  document.getElementById('progressBar').style.width = '100%';
  document.getElementById('quizCard').style.display = 'none';
  document.getElementById('resultsCard').classList.add('show');
  document.getElementById('scoreNum').textContent = score;
  document.getElementById('scoreDenom').textContent = '/ ' + questions.length;
  const pct = Math.round(score / questions.length * 100);
  const msgs = [['Continua!','Revê as palavras e tenta outra vez.'],['Bom esforço!','Continua a praticar estas palavras.'],['Muito bem!','Só mais um pouco de prática.'],['Excelente!','Vocabulário dominado!']];
  const m = msgs[pct>=90?3:pct>=70?2:pct>=50?1:0];
  document.getElementById('resultTitle').textContent = m[0];
  document.getElementById('resultMsg').textContent = pct + '% correto. ' + m[1];
  const ml = document.getElementById('mistakesList');
  if (mistakes.length > 0) {
    ml.innerHTML = '<h3>Rever (' + mistakes.length + '):</h3>';
    mistakes.forEach(m => { ml.innerHTML += '<div class="mistake-item"><div class="mq">' + m.q + '</div><div class="ma">' + m.explanation + '</div></div>'; });
  } else {
    ml.innerHTML = '<p style="color:#276749;margin-top:16px">Sem erros! Perfeito!</p>';
  }
}

document.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    if (!answered) {
      if (mode === 'write') checkWrite();
      else if (mode === 'frase') checkFrase();
    } else if (document.getElementById('nextBtn').classList.contains('show')) {
      nextQuestion();
    }
  }
});

restart();
</script>
