<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  .filter-btn[data-cat="todos"].active-f    { background: #edf2f7; }

  /* Progress */
  .progress-bar-wrap { background: #e2e8f0; border-radius: 8px; height: 8px; margin: 16px 0 4px; }

  /* Card */
  .card { background: white; border-radius: 16px; padding: 30px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); margin-bottom: 20px; }
  .category-badge { display: inline-block; font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; padding: 3px 10px; border-radius: 20px; margin-bottom: 14px; }

  /* Choice mode */
  .question { font-size: 1.15rem; font-weight: 600; line-height: 1.5; margin-bottom: 20px; }
  .options { display: flex; flex-direction: column; gap: 10px; }
  .option-btn { background: #f7fafc; border: 2px solid #e2e8f0; border-radius: 10px; padding: 13px 18px; font-size: 1rem; text-align: left; cursor: pointer; transition: all 0.15s ease; color: #2d3748; }
  .option-btn:hover:not(:disabled) { background: #f0fff4; border-color: #9ae6b4; }

  /* Write mode */
  .sentence-display { font-size: 1.1rem; font-weight: 500; line-height: 1.9; margin-bottom: 8px; }

  .write-row { display: flex; gap: 10px; }
  .write-input { flex: 1; padding: 13px 16px; border: 2px solid #e2e8f0; border-radius: 10px; font-size: 1.05rem; font-family: inherit; color: #2d3748; outline: none; transition: border-color 0.15s; }
  .write-input:focus { border-color: #9ae6b4; }
  .write-input.correct-inp { border-color: #68d391; background: #f0fff4; }

  .check-btn { padding: 13px 20px; background: #38a169; color: white; border: none; border-radius: 10px; font-size: 0.95rem; font-weight: 600; cursor: pointer; }

  .accent-note { font-size: 0.78rem; color: #e67e22; margin-top: 8px; }

  /* Feedback */
  .feedback { margin-top: 16px; padding: 12px 16px; border-radius: 10px; font-size: 0.9rem; line-height: 1.5; display: none; }
  .feedback.show { display: block; }

  .next-btn { display: none; margin-top: 18px; width: 100%; padding: 14px; background: #38a169; color: white; border: none; border-radius: 10px; font-size: 1rem; font-weight: 600; cursor: pointer; }
  .next-btn:hover { background: #276749; }
  .next-btn.show { display: block; }

  .results { display: none; text-align: center; padding: 40px 30px; }

  .score-circle .denom { font-size: 0.85rem; opacity: 0.85; }

  .results p { color: #718096; margin-bottom: 24px; }
  .btn-row { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  .restart-btn { padding: 13px 32px; background: #38a169; color: white; border: none; border-radius: 10px; font-size: 1rem; font-weight: 600; cursor: pointer; }
  .home-btn { padding: 13px 32px; background: #edf2f7; color: #4a5568; border: none; border-radius: 10px; font-size: 1rem; font-weight: 600; cursor: pointer; text-decoration: none; display: inline-block; }
  .mistakes-list { text-align: left; margin-top: 28px; }

  .mistake-item { background: #fff5f5; border-radius: 8px; padding: 10px 14px; margin-bottom: 8px; font-size: 0.88rem; line-height: 1.5; }
  .mistake-item strong { color: #c53030; }
  .mistake-item .correct-ans { color: #276749; font-weight: 600; }
  .filter-btn[data-cat="ar"].active-f { background: #faf5ff; color: #6b46c1; }
  .cat-ar { background: #faf5ff; color: #6b46c1; }
  .filter-btn[data-cat="er"].active-f { background: #ebf8ff; color: #2b6cb0; }
  .cat-er { background: #ebf8ff; color: #2b6cb0; }
  .filter-btn[data-cat="ir"].active-f { background: #f0fff4; color: #276749; }
  .cat-ir { background: #f0fff4; color: #276749; }
  .filter-btn[data-cat="irreg"].active-f { background: #fff5f5; color: #c53030; }
  .cat-irreg { background: #fff5f5; color: #c53030; }
  .filter-btn[data-cat="uso"].active-f { background: #fffaf0; color: #c05621; }
  .cat-uso { background: #fffaf0; color: #c05621; }
</style>

<script>
// writeAnswer = форма, которую нужно напечатать точно (с акцентами)
const questions = [
  {"cat": "ar", "q": "Что означает \"Ela está a falar ao telefone\"?", "options": ["Она будет говорить по телефону", "Она говорила по телефону", "Она сейчас говорит по телефону", "Она говорит по телефону (обычно)"], "answer": 2, "writeAnswer": "Она сейчас говорит по телефону", "explanation": "ESTAR + A + INFINITIVO = действие в процессе (прямо сейчас). \"Ela está a falar\" = она сейчас разговаривает."},
  {"cat": "uso", "q": "Qual é a diferença: \"Eu como\" vs \"Eu estou a comer\"?", "options": ["Нет разницы", "Eu como = обычное действие; Eu estou a comer = сейчас ем", "Eu estou a comer = обычное; Eu como = сейчас", "Eu como используется только в прошлом"], "answer": 1, "writeAnswer": "Eu como = обычное действие; Eu estou a comer = сейчас ем", "explanation": "Presente simples = обычное действие (normalmente). ESTAR+A+INF = сейчас, в процессе. \"Eu como às 13:00\" vs \"Agora estou a comer.\""},
  {"cat": "ir", "q": "\"A essa hora já vou estar a nadar.\" Что это значит?", "options": ["В то время я плавал", "В то время я уже буду плавать", "В то время я плаваю", "В то время мне нужно плавать"], "answer": 1, "writeAnswer": "В то время я уже буду плавать", "explanation": "IR + ESTAR + A + INF = буду заниматься чем-то в будущем (в процессе). \"Vou estar a nadar\" = буду плавать (в тот момент)."},
  {"cat": "uso", "q": "\"Eu estava a comer quando ela chegou.\" Что это значит?", "options": ["Я ел, когда она пришла", "Я поел, и потом она пришла", "Я собирался есть, когда она пришла", "Я ел вместе с ней"], "answer": 0, "writeAnswer": "Я ел, когда она пришла", "explanation": "ESTAVA + A + INF = был в процессе (Imperfeito). \"Eu estava a comer\" = я ел (в процессе, фоновое действие). Quando + PPS = когда произошло другое событие."},
  {"cat": "ar", "q": "\"Eu estou a estar com fome.\" Frase correta?", "options": ["Sim, está correto", "Não, deve ser: Eu estou com fome", "Não, deve ser: Eu tenho fome", "Sim, mas só em linguagem informal"], "answer": 1, "writeAnswer": "Não, deve ser: Eu estou com fome", "explanation": "ESTAR + A + ESTAR é impossível! Estados (fome, frio, calor, sono) não usam o contínuo. Correto: \"Eu estou com fome\" (simplesmente)."},
  {"cat": "ar", "q": "\"Eu costumo acordar cedo.\" Что означает это предложение?", "options": ["Я обычно встаю рано", "Я привык вставать рано (раньше)", "Я хочу вставать рано", "Я буду вставать рано"], "answer": 0, "writeAnswer": "Я обычно встаю рано", "explanation": "COSTUMAR + INFINITIVO = обычно делать что-то (настоящее время). \"Eu costumo acordar cedo\" = я обычно встаю рано = \"Eu acordo cedo normalmente.\""},
  {"cat": "ar", "q": "Qual frase está ERRADA?", "options": ["Eu costumo ler à noite.", "Normalmente eu costumo ler.", "Ele costuma fazer desporto.", "O café costuma estar fechado ao sábado."], "answer": 1, "writeAnswer": "Normalmente eu costumo ler.", "explanation": "COSTUMAR + NORMALMENTE é redundante (говорит одно и то же). Правило: costumar = normalmente, поэтому их нельзя использовать вместе. \"Normalmente eu leio\" ИЛИ \"Eu costumo ler\" -- только одно."},
  {"cat": "ar", "q": "\"Eu costumava trabalhar na escola.\" Что это значит?", "options": ["Я обычно работаю в школе", "Раньше я обычно работал в школе", "Я привык работать в школе", "Я собираюсь работать в школе"], "answer": 1, "writeAnswer": "Раньше я обычно работал в школе", "explanation": "COSTUMAR в Imperfeito (costumava) = раньше обычно делал (\"used to\"). \"Eu costumava trabalhar na escola\" = я раньше работал в школе (регулярно)."},
  {"cat": "uso", "q": "Completa a frase no estilo PE: «Eu ______ a ver um filme agora.»", "options": ["estou vendo", "estou a ver", "sou a ver", "estou ver"], "answer": 1, "writeAnswer": "estou a ver", "explanation": "В европейском португальском (PE) продолжительное действие выражается через estar a + infinitivo. Форма «estou vendo» — бразильский вариант."},
  {"cat": "uso", "q": "Em PE (português europeu), como se diz «Eu estou a ler» (я читаю — в данный момент)?", "options": ["Eu estou lendo.", "Eu estou ler.", "Eu estou a ler.", "Eu estou de ler."], "answer": 2, "writeAnswer": "Eu estou a ler.", "explanation": "В европейском португальском герундий не используется. Конструкция «estar a + infinitivo» — аналог настоящего продолженного: «estou a ler»."},
  {"cat": "uso", "q": "Qual é a forma correta em PE para «Vocês estão a fazer o quê?»", "options": ["Você estão fazendo o quê?", "Vocês estão fazendo o quê?", "Vocês estão a fazer o quê?", "Vós estais fazendo o quê?"], "answer": 2, "writeAnswer": "Vocês estão a fazer o quê?", "explanation": "В PE: «vocês» для группы (не «você» во мн.ч.) и «estar a + infinitivo» (не герундий «fazendo», который характерен для бразильского варианта)."},
  {"cat": "uso", "q": "Qual frase está CORRETA em português europeu (PE)?", "options": ["Ela está comendo agora.", "Ela está a comer agora.", "Ela come agora mesmo.", "Ela está comida agora."], "answer": 1, "writeAnswer": "Ela está a comer agora.", "explanation": "В европейском португальском (PE) длящееся действие = 'estar a + infinitivo': está a comer, está a trabalhar. Форма 'está comendo' — бразильский португальский (PB)."},
  {"cat": "uso", "q": "Como é que estás? / Vou ____________. (resposta idiomática com ir + gerúndio)", "options": ["andando", "andar", "a andar", "andado"], "answer": 0, "writeAnswer": "andando", "explanation": "\"Vou andando\" é uma expressão idiomática (ir + gerúndio) para responder a \"como vai a vida\" — algo entre \"vou indo\" e \"mais ou menos\"."},
  {"cat": "uso", "q": "Qual frase está correta em português europeu para uma ação em curso agora?", "options": ["Eu estou a falar a verdade.", "Eu tou falando a verdade.", "Eu falando a verdade.", "Eu estou falar a verdade."], "answer": 0, "writeAnswer": "Eu estou a falar a verdade.", "explanation": "Em PE usa-se \"estar a + infinitivo\" para o progressivo (não o gerúndio simples, que é mais comum no Brasil)."},
  {"cat": "uso", "q": "Andando devagar pelos trilhos, ____________ ver as montanhas.", "options": ["conseguimos", "consigamos", "conseguir", "conseguindo"], "answer": 0, "writeAnswer": "conseguimos", "explanation": "O gerúndio adverbial (\"andando\") introduz a circunstância; o verbo principal fica no presente do indicativo — \"conseguimos\"."},
  {"cat": "uso", "q": "Comprando este casaco hoje, ____________ desconto de 10%.", "options": ["tens", "ter", "tendo", "tinhas"], "answer": 0, "writeAnswer": "tens", "explanation": "Gerúndio com valor condicional/adverbial (= \"se comprares\"): a frase principal continua no presente."},
  {"cat": "uso", "q": "Выберите правильную форму для европейского португальского: «Ela ___ a ler o livro agora.»", "options": ["está lendo", "está a ler", "é lendo", "tem lendo"], "answer": 1, "writeAnswer": "está a ler", "explanation": "В европейском португальском (PE) для выражения действия в процессе используется estar a + infinitivo. Форма «está lendo» — бразильская норма."},
  {"cat": "uso", "q": "Eu ____________ vou de férias sozinha — prefiro sempre companhia.", "options": ["nunca", "sempre", "às vezes", "todos os dias"], "answer": 0, "writeAnswer": "nunca", "explanation": "\"Nunca\" antes do verbo (sem duplo negativo em PE quando vem antes: \"nunca vou\", não \"não vou nunca\" nesta posição)."},
  {"cat": "uso", "q": "Qual das frases tem o advérbio de frequência bem colocado?", "options": ["Nós fazemos às vezes caminhadas na montanha.", "Nós às caminhadas vezes fazemos na montanha.", "Nós fazemos caminhadas às vezes na montanha na.", "Às nós vezes fazemos caminhadas na montanha."], "answer": 0, "writeAnswer": "Nós fazemos às vezes caminhadas na montanha.", "explanation": "\"Às vezes\" pode vir no início da frase ou logo depois do verbo — \"Nós fazemos às vezes...\" é natural em PE."},
  {"cat": "uso", "q": "O Gustavo já saiu? — Já. _____ sair. (há um minuto)", "options": ["Vai", "Está a", "Acabou de", "Acabou a"], "answer": 2, "writeAnswer": "Acabou de", "explanation": "Только что сделал — acabar de + infinitivo: acabei de, acabaste de, acabou de, acabámos de, acabaram de. Предлог именно 'de'."},
  {"cat": "uso", "q": "O que é que a Daniela está a fazer? — _____ a mesa.", "options": ["Está a pôr", "Vai pôr", "Acabou de pôr", "Está pôr"], "answer": 0, "writeAnswer": "Está a pôr", "explanation": "Действие прямо сейчас — estar a + infinitivo: está a pôr. Без 'a' (está pôr) нельзя; 'está pondo' — бразильский вариант."},
  {"cat": "uso", "q": "Já são 9h00 e ainda não estás pronta. — Pois não. _____ atrasada.", "options": ["Acabei de chegar", "Estou a chegar", "Vou chegar", "Chegava"], "answer": 2, "writeAnswer": "Vou chegar", "explanation": "Ближайшее будущее, которое уже понятно по ситуации — ir + infinitivo: vou chegar atrasada."},
  {"cat": "uso", "q": "Ele está muito cansado. _____ de viagem.", "options": ["Vai chegar", "Acabou de chegar", "Está a chegar", "Chegará"], "answer": 1, "writeAnswer": "Acabou de chegar", "explanation": "Устал, потому что только что приехал — acabou de chegar."},
  {"cat": "ar", "q": "Responde com 'acabar de': 'O Frederico já acordou?' (levantar-se)", "options": ["Já, acabou de levantar-se.", "Já, acabou a levantar-se.", "Já, vai levantar-se.", "Já, está a levantar-se."], "answer": 0, "writeAnswer": "Já, acabou de levantar-se.", "explanation": "Acabar de + infinitivo; как в ответах учебника (GA), местоимение ставим после инфинитива через дефис: acabou de levantar-se, acabou de vestir-se. Вариант «acabou de se levantar» тоже допустим (после предлога), но придерживаемся учебника."},
];

const labelMap = { ar:"-AR", er:"-ER", ir:"-IR", irreg:"Irregulares", uso:"Uso / contexto" };
const classMap = { ar:"cat-ar", er:"cat-er", ir:"cat-ir", irreg:"cat-irreg", uso:"cat-uso" };

let mode = 'choice', activeFilter = 'todos';
let shuffled = [], current = 0, score = 0, answered = false, mistakes = [];

function shuffle(arr) { return [...arr].sort(() => Math.random() - 0.5); }

function setMode(m) {
  mode = m;
  document.getElementById('btnChoice').classList.toggle('active', m === 'choice');
  document.getElementById('btnWrite').classList.toggle('active', m === 'write');
  restart();
}

function setFilter(cat, btn) {
  activeFilter = cat;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active-f'));
  btn.classList.add('active-f');
  restart();
}

function restart() {
  let pool = activeFilter === 'todos' ? questions : questions.filter(q => q.cat === activeFilter);
  if (mode === 'write') {
    const w = pool.filter(q => q.q.includes('___') && !q.writeAnswer.includes(' '));
    if (w.length) pool = w; else { mode = 'choice';
      document.getElementById('btnChoice').classList.add('active'); document.getElementById('btnWrite').classList.remove('active'); }
  }
  if (!pool.length) pool = questions;
  shuffled = shuffle(pool);
  current = 0; score = 0; answered = false; mistakes = [];
  document.getElementById('results').classList.remove('show');
  document.getElementById('quizCard').style.display = 'block';
  renderQuestion();
}

function renderQuestion() {
  if (current >= shuffled.length) { showResults(); return; }
  const q = shuffled[current];
  const total = shuffled.length;

  document.getElementById('progressBar').style.width = (current / total * 100) + '%';
  document.getElementById('progressLabel').textContent = 'Questão ' + (current + 1) + ' de ' + total;

  const badge = document.getElementById('badge');
  badge.textContent = labelMap[q.cat];
  badge.className = 'category-badge ' + classMap[q.cat];

  document.getElementById('feedback').className = 'feedback';
  document.getElementById('nextBtn').className = 'next-btn';
  answered = false;

  document.getElementById('choiceArea').style.display = 'none';
  document.getElementById('writeArea').style.display = 'none';

  if (mode === 'choice') {
    document.getElementById('choiceArea').style.display = 'block';
    document.getElementById('question').textContent = q.q;
    const optDiv = document.getElementById('options');
    optDiv.innerHTML = '';
    const indices = q.options.map((_,i) => i);
    const si = shuffle(indices);
    const newCorrect = si.indexOf(q.answer);
    si.forEach((origIdx, newIdx) => {
      const btn = document.createElement('button');
      btn.className = 'option-btn';
      btn.textContent = q.options[origIdx];
      btn.onclick = () => selectAnswer(newIdx, newCorrect, q);
      optDiv.appendChild(btn);
    });
  } else {
    document.getElementById('writeArea').style.display = 'block';
    // Split question to show blank
    const parts = q.q.split('___');
    const verbMatch = q.q.match(/\(([^)]+)\)/);
    const verbHintText = verbMatch ? 'Verbo: ' + verbMatch[1] : '';
    const sd = document.getElementById('sentenceDisplay');
    sd.innerHTML = '';
    sd.appendChild(document.createTextNode(parts[0]));
    const blankEl = document.createElement('span');
    blankEl.className = 'sentence-blank';
    blankEl.id = 'blankSpan';
    blankEl.textContent = '___';
    sd.appendChild(blankEl);
    sd.appendChild(document.createTextNode(parts[1] || ''));
    document.getElementById('verbHint').textContent = verbHintText;
    const inp = document.getElementById('writeInput');
    inp.value = ''; inp.className = 'write-input'; inp.disabled = false;
    document.getElementById('checkBtn').disabled = false;
    setTimeout(() => inp.focus(), 50);
  }
}

function selectAnswer(chosen, correct, q) {
  if (answered) return;
  answered = true;
  const btns = document.querySelectorAll('.option-btn');
  btns.forEach(b => b.disabled = true);
  btns[correct].classList.add('correct');
  const fb = document.getElementById('feedback');
  if (chosen === correct) {
    score++; btns[chosen].classList.add('correct');
    fb.className = 'feedback ok show';
    fb.textContent = 'Correto! ' + q.explanation;
  } else {
    btns[chosen].classList.add('wrong');
    fb.className = 'feedback err show';
    fb.textContent = 'Incorreto. ' + q.explanation;
    mistakes.push({ q: q.q, wrong: btns[chosen].textContent, right: q.writeAnswer });
  }
  document.getElementById('nextBtn').className = 'next-btn show';
}

function checkWrite() {
  if (answered) return;
  const q = shuffled[current];
  const inp = document.getElementById('writeInput');
  const raw = inp.value.trim();
  if (!raw) return;
  answered = true;
  inp.disabled = true;
  document.getElementById('checkBtn').disabled = true;

  // Strict: exact match (case insensitive, accents required)
  const correct = raw.toLowerCase() === q.writeAnswer.toLowerCase();
  const blank = document.getElementById('blankSpan');
  if (blank) {
    blank.textContent = correct ? raw : q.writeAnswer;
    blank.style.borderColor = correct ? '#68d391' : '#fc8181';
    blank.style.color = correct ? '#276749' : '#c53030';
  }
  const fb = document.getElementById('feedback');
  if (correct) {
    score++; inp.className = 'write-input correct-inp';
    fb.className = 'feedback ok show';
    fb.textContent = 'Correto! ' + q.explanation;
  } else {
    inp.className = 'write-input wrong-inp';
    fb.className = 'feedback err show';
    fb.textContent = 'Forma correta: «' + q.writeAnswer + '». ' + q.explanation;
    mistakes.push({ q: q.q, wrong: raw, right: q.writeAnswer });
  }
  document.getElementById('nextBtn').className = 'next-btn show';
}

function nextQuestion() { current++; renderQuestion(); }

function showResults() {
  document.getElementById('quizCard').style.display = 'none';
  document.getElementById('progressBar').style.width = '100%';
  const total = shuffled.length;
  const pct = Math.round(score / total * 100);
  document.getElementById('scoreNum').textContent = score;
  document.getElementById('scoreDenom').textContent = 'de ' + total;
  const msgs = pct >= 90 ? ['Excelente!','Dominas os verbos!'] : pct >= 70 ? ['Muito bem!','Revê os erros abaixo.'] : pct >= 50 ? ['Continua!','Há espaço para melhorar.'] : ['Não desistas!','Revê as conjugações!'];
  document.getElementById('resultsTitle').textContent = msgs[0];
  document.getElementById('resultsMsg').textContent = pct + '% correto. ' + msgs[1];
  const ml = document.getElementById('mistakesList');
  ml.innerHTML = mistakes.length ? '<h3>Erros para rever:</h3>' + mistakes.map(m =>
    '<div class="mistake-item"><div>' + m.q + '</div><div>Escreveste: <strong>' + m.wrong + '</strong> &nbsp;|&nbsp; Correto: <span class="correct-ans">' + m.right + '</span></div></div>'
  ).join('') : '<p style="color:#276749;margin-top:16px">Sem erros! Perfeito!</p>';
  document.getElementById('results').classList.add('show');
}

document.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  if (!answered && mode === 'write') checkWrite();
  else if (answered) { const nb = document.getElementById('nextBtn'); if (nb.classList.contains('show')) nextQuestion(); }
});

restart();
</script>
</body>
</html>
