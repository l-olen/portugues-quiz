<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz -- Futuro</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', Arial, sans-serif; background: #f0f4f8; color: #2d3748; min-height: 100vh; padding: 20px; }
  .container { max-width: 680px; margin: 0 auto; }
  header { text-align: center; padding: 30px 0 20px; }
  header h1 { font-size: 1.8rem; color: #276749; margin-bottom: 6px; }
  header p { color: #718096; font-size: 0.95rem; }
  .back-link { display: inline-block; margin-bottom: 16px; color: #718096; font-size: 0.88rem; text-decoration: none; }
  .back-link:hover { color: #276749; }

  /* Mode toggle */
  .mode-wrap { display: flex; gap: 0; background: white; border-radius: 12px; padding: 4px; box-shadow: 0 2px 8px rgba(0,0,0,0.07); margin-bottom: 20px; }
  .mode-btn { flex: 1; padding: 10px; border: none; background: transparent; border-radius: 9px; font-size: 0.88rem; font-weight: 600; cursor: pointer; color: #718096; transition: all 0.2s; }
  .mode-btn.active { background: #38a169; color: white; }

  /* Filter */
  .filter-wrap { margin-bottom: 16px; }
  .filter-label { font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: #a0aec0; margin-bottom: 8px; display: block; }
  .filter-buttons { display: flex; flex-wrap: wrap; gap: 7px; }
  .filter-btn { font-size: 0.78rem; font-weight: 600; padding: 5px 12px; border-radius: 20px; border: 2px solid #e2e8f0; cursor: pointer; background: white; color: #4a5568; transition: all 0.15s; }
  .filter-btn.active-f { border-color: currentColor; }
  .filter-btn[data-cat="todos"].active-f    { background: #edf2f7; }
  .filter-btn[data-cat="presente"].active-f { background: #faf5ff; color: #6b46c1; }
  .filter-btn[data-cat="pps"].active-f      { background: #f0fff4; color: #276749; }

  /* Progress */
  .progress-bar-wrap { background: #e2e8f0; border-radius: 8px; height: 8px; margin: 16px 0 4px; }
  .progress-bar { height: 8px; border-radius: 8px; background: linear-gradient(90deg, #38a169, #68d391); transition: width 0.4s ease; }
  .progress-label { text-align: right; font-size: 0.82rem; color: #718096; margin-top: 4px; margin-bottom: 16px; }

  /* Card */
  .card { background: white; border-radius: 16px; padding: 30px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); margin-bottom: 20px; }
  .category-badge { display: inline-block; font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; padding: 3px 10px; border-radius: 20px; margin-bottom: 14px; }
  .badge-presente { background: #faf5ff; color: #6b46c1; }
  .badge-pps      { background: #f0fff4; color: #276749; }

  /* Choice mode */
  .question { font-size: 1.15rem; font-weight: 600; line-height: 1.5; margin-bottom: 20px; }
  .options { display: flex; flex-direction: column; gap: 10px; }
  .option-btn { background: #f7fafc; border: 2px solid #e2e8f0; border-radius: 10px; padding: 13px 18px; font-size: 1rem; text-align: left; cursor: pointer; transition: all 0.15s ease; color: #2d3748; }
  .option-btn:hover:not(:disabled) { background: #f0fff4; border-color: #9ae6b4; }
  .option-btn.correct { background: #f0fff4; border-color: #68d391; color: #276749; font-weight: 600; }
  .option-btn.wrong { background: #fff5f5; border-color: #fc8181; color: #c53030; }
  .option-btn:disabled { cursor: default; }

  /* Write mode */
  .sentence-display { font-size: 1.1rem; font-weight: 500; line-height: 1.9; margin-bottom: 8px; }
  .sentence-blank { display: inline-block; min-width: 90px; border-bottom: 3px solid #38a169; color: #38a169; font-weight: 700; text-align: center; padding: 0 4px; vertical-align: bottom; }
  .verb-hint { font-size: 0.85rem; color: #a0aec0; margin-bottom: 18px; }
  .write-row { display: flex; gap: 10px; }
  .write-input { flex: 1; padding: 13px 16px; border: 2px solid #e2e8f0; border-radius: 10px; font-size: 1.05rem; font-family: inherit; color: #2d3748; outline: none; transition: border-color 0.15s; }
  .write-input:focus { border-color: #9ae6b4; }
  .write-input.correct-inp { border-color: #68d391; background: #f0fff4; }
  .write-input.wrong-inp   { border-color: #fc8181; background: #fff5f5; }
  .check-btn { padding: 13px 20px; background: #38a169; color: white; border: none; border-radius: 10px; font-size: 0.95rem; font-weight: 600; cursor: pointer; }
  .check-btn:hover { background: #276749; }
  .check-btn:disabled { background: #a0aec0; cursor: default; }
  .accent-note { font-size: 0.78rem; color: #e67e22; margin-top: 8px; }

  /* Feedback */
  .feedback { margin-top: 16px; padding: 12px 16px; border-radius: 10px; font-size: 0.9rem; line-height: 1.5; display: none; }
  .feedback.show { display: block; }
  .feedback.ok { background: #f0fff4; color: #276749; border-left: 4px solid #68d391; }
  .feedback.err { background: #fff5f5; color: #c53030; border-left: 4px solid #fc8181; }
  .next-btn { display: none; margin-top: 18px; width: 100%; padding: 14px; background: #38a169; color: white; border: none; border-radius: 10px; font-size: 1rem; font-weight: 600; cursor: pointer; }
  .next-btn:hover { background: #276749; }
  .next-btn.show { display: block; }

  /* Results */
  .results { display: none; text-align: center; padding: 40px 30px; }
  .results.show { display: block; }
  .score-circle { width: 120px; height: 120px; border-radius: 50%; background: linear-gradient(135deg, #38a169, #68d391); display: flex; flex-direction: column; align-items: center; justify-content: center; margin: 0 auto 20px; color: white; }
  .score-circle .num { font-size: 2.2rem; font-weight: 700; line-height: 1; }
  .score-circle .denom { font-size: 0.85rem; opacity: 0.85; }
  .results h2 { font-size: 1.5rem; margin-bottom: 8px; }
  .results p { color: #718096; margin-bottom: 24px; }
  .btn-row { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  .restart-btn { padding: 13px 32px; background: #38a169; color: white; border: none; border-radius: 10px; font-size: 1rem; font-weight: 600; cursor: pointer; }
  .home-btn { padding: 13px 32px; background: #edf2f7; color: #4a5568; border: none; border-radius: 10px; font-size: 1rem; font-weight: 600; cursor: pointer; text-decoration: none; display: inline-block; }
  .mistakes-list { text-align: left; margin-top: 28px; }
  .mistakes-list h3 { font-size: 1rem; color: #c53030; margin-bottom: 12px; }
  .mistake-item { background: #fff5f5; border-radius: 8px; padding: 10px 14px; margin-bottom: 8px; font-size: 0.88rem; line-height: 1.5; }
  .mistake-item strong { color: #c53030; }
  .mistake-item .correct-ans { color: #276749; font-weight: 600; }
  .filter-btn[data-cat="ar"].active-f { background: #faf5ff; color: #6b46c1; }
  .cat-ar { background: #faf5ff; color: #6b46c1; }
  .filter-btn[data-cat="er"].active-f { background: #ebf8ff; color: #2b6cb0; }
  .cat-er { background: #ebf8ff; color: #2b6cb0; }
  .filter-btn[data-cat="ir"].active-f { background: #f0fff4; color: #276749; }
  .cat-ir { background: #f0fff4; color: #276749; }
  .filter-btn[data-cat="irreg"].active-f { background: #fff5f5; color: #c53030; }
  .cat-irreg { background: #fff5f5; color: #c53030; }
  .filter-btn[data-cat="uso"].active-f { background: #fffaf0; color: #c05621; }
  .cat-uso { background: #fffaf0; color: #c05621; }
</style>
</head>
<body>
<div class="container">

  <a class="back-link" href="index.html">← Voltar ao menu</a>
  <header>
    <h1>Futuro</h1>
    <p>vou falar · falarei / farei / trarei · será que / estará? · 38 questões</p>
  </header>

  <div class="mode-wrap">
    <button class="mode-btn active" id="btnChoice" onclick="setMode('choice')">Escolher (variantes)</button>
    <button class="mode-btn" id="btnWrite" onclick="setMode('write')">Escrever (digitar forma)</button>
  </div>

  <div class="filter-wrap">
    <span class="filter-label">Tipo de verbo</span>
    <div class="filter-buttons">
      <button class="filter-btn active-f" data-cat="todos" onclick="setFilter('todos',this)">Todos</button>
      <button class="filter-btn" data-cat="ar" onclick="setFilter('ar',this)">-AR</button>
      <button class="filter-btn" data-cat="er" onclick="setFilter('er',this)">-ER</button>
      <button class="filter-btn" data-cat="ir" onclick="setFilter('ir',this)">-IR</button>
      <button class="filter-btn" data-cat="irreg" onclick="setFilter('irreg',this)">Irregulares</button>
      <button class="filter-btn" data-cat="uso" onclick="setFilter('uso',this)">Uso / contexto</button>
    </div>
  </div>

  <div class="progress-bar-wrap"><div class="progress-bar" id="progressBar" style="width:0%"></div></div>
  <div class="progress-label" id="progressLabel"></div>

  <div class="card" id="quizCard">
    <div class="category-badge" id="badge"></div>

    <!-- Choice mode -->
    <div id="choiceArea">
      <div class="question" id="question"></div>
      <div class="options" id="options"></div>
    </div>

    <!-- Write mode -->
    <div id="writeArea" style="display:none">
      <div class="sentence-display" id="sentenceDisplay"></div>
      <div class="verb-hint" id="verbHint"></div>
      <div class="write-row">
        <input type="text" class="write-input" id="writeInput" placeholder="forma correta..." autocomplete="off" autocorrect="off" spellcheck="false">
        <button class="check-btn" id="checkBtn" onclick="checkWrite()">OK</button>
      </div>
      <div class="accent-note">Atenção: acentos obrigatórios (estás, chegámos...)</div>
    </div>

    <div class="feedback" id="feedback"></div>
    <button class="next-btn" id="nextBtn" onclick="nextQuestion()">Próxima questão →</button>
  </div>

  <div class="card results" id="results">
    <div class="score-circle">
      <span class="num" id="scoreNum"></span>
      <span class="denom" id="scoreDenom"></span>
    </div>
    <h2 id="resultsTitle"></h2>
    <p id="resultsMsg"></p>
    <div class="btn-row">
      <button class="restart-btn" onclick="restart()">Repetir quiz</button>
      <a class="home-btn" href="index.html">Menu principal</a>
    </div>
    <div class="mistakes-list" id="mistakesList"></div>
  </div>

</div>
<script>
// writeAnswer = форма, которую нужно напечатать точно (с акцентами)
const questions = [
  {"cat": "uso", "q": "Amanhã eu ___ ao cinema. (я собираюсь / иду в кино)", "options": ["vou ir", "vou", "fui", "ia"], "answer": 1, "writeAnswer": "vou", "explanation": "С глаголом IR не говорят «vou ir»: просто «Amanhã vou ao cinema» (или формально «irei»). IR + инфинитив — для других глаголов: vou ver, vou comprar."},
  {"cat": "uso", "q": "Qual frase está ERRADA?", "options": ["Eles vão ter um filho.", "Amanhã eu vou estar em casa.", "Eu vou ao supermercado.", "Eu vou vir à festa."], "answer": 3, "writeAnswer": "Eu vou vir à festa.", "explanation": "\"Eu vou vir\" -- ERRADO! Quando eu me movimento para cá, usa-se apenas VIR: \"Eu venho à festa.\" Da mesma forma, \"eu vou ir\" está errado: o correto é \"eu vou ao cinema\" / \"irei ao cinema\"."},
  {"cat": "ir", "q": "O filme ___ interessante. (будет интересным -- futuro próximo)", "options": ["vai ser", "é", "foi", "será"], "answer": 0, "writeAnswer": "vai ser", "explanation": "IR + INFINITIVO для будущего: \"O filme vai ser interessante.\" Será também correto, mas mais formal."},
  {"cat": "ir", "q": "Na próxima semana eles ___ de Lisboa. (уедут)", "options": ["foram", "vão partir", "partem", "partirão"], "answer": 1, "writeAnswer": "vão partir", "explanation": "IR + INFINITIVO = планы на будущее. \"Eles vão partir de Lisboa na próxima semana.\""},
  {"cat": "uso", "q": "\"Será que hoje vai chover?\" Что это означает?", "options": ["Сегодня будет дождь.", "Интересно, сегодня будет дождь?", "Сегодня точно будет дождь.", "Сегодня не будет дождя."], "answer": 1, "writeAnswer": "Интересно, сегодня будет дождь?", "explanation": "SERÁ QUE = интересно, / а вдруг, / наверное... Выражает неуверенность, размышление. \"Será que vai chover?\" = Интересно, пойдёт ли дождь?"},
  {"cat": "uso", "q": "\"Será que eles já chegaram a casa?\" -- как это звучит по-русски?", "options": ["Они уже пришли домой?", "Интересно, они уже пришли домой?", "Они точно пришли домой.", "Когда они придут домой?"], "answer": 1, "writeAnswer": "Интересно, они уже пришли домой?", "explanation": "SERÁ QUE + PPS = размышление о прошлом (\"интересно, они уже...?\"). Не путать с прямым вопросом \"Já chegaram?\""},
  {"cat": "uso", "q": "Как выразить \"Интересно, она сейчас на работе?\" используя Será que:", "options": ["Ela está a trabalhar?", "Será que ela está a trabalhar?", "Será ela trabalha?", "Que será ela está a trabalhar?"], "answer": 1, "writeAnswer": "Será que ela está a trabalhar?", "explanation": "SERÁ QUE + глагол в соответствующем времени. \"Será que ela está a trabalhar?\" = Интересно, она сейчас работает?"},
  {"cat": "ar", "q": "Qual é a forma correta de expressar o futuro próximo em conversa do dia a dia?", "options": ["Eu falarei amanhã.", "Eu vou falar amanhã.", "Eu iria falar amanhã.", "Eu falava amanhã."], "answer": 1, "writeAnswer": "Eu vou falar amanhã.", "explanation": "'ir + infinitivo' используется в разговорной речи и неформальных ситуациях. 'Falarei' — футуро симплиш, он более формален и используется в документах."},
  {"cat": "irreg", "q": "Completa a frase: 'Ela _____ o bolo para a festa.' (trazer, futuro simples)", "options": ["vai trazer", "trazará", "trará", "trareia"], "answer": 2, "writeAnswer": "trará", "explanation": "Глагол 'trazer' — неправильный в futuro simples: eu trarei, tu trarás, ele trará. Форма 'trazará' не существует."},
  {"cat": "irreg", "q": "Qual é a forma correta do verbo 'fazer' no futuro simples para 'nós'?", "options": ["nós fazeremos", "nós faremos", "nós fazemos", "nós fazerão"], "answer": 1, "writeAnswer": "nós faremos", "explanation": "'Fazer' — неправильный глагол в futuro simples: eu farei, tu farás, ele fará, nós faremos, eles farão."},
  {"cat": "uso", "q": "Qual é a tradução correta de 'Será que vai chover hoje?'", "options": ["Будет ли дождь сегодня, наверное.", "Интересно, пойдёт ли сегодня дождь?", "Сегодня точно пойдёт дождь.", "Сегодня не будет дождя?"], "answer": 1, "writeAnswer": "Интересно, пойдёт ли сегодня дождь?", "explanation": "'Será que' используется для выражения сомнения или желания подтвердить что-то — аналог русского «интересно, …?» или «вот бы знать, …»."},
  {"cat": "uso", "q": "Quando é que se usa 'eu irei + infinitivo' em vez do futuro simples?", "options": ["Sempre que quisermos ser formais.", "Quando o verbo tem mais de 6 letras.", "Quando falamos de ações passadas.", "Quando a frase começa com 'será que'."], "answer": 1, "writeAnswer": "Quando o verbo tem mais de 6 letras.", "explanation": "Согласно правилу урока: 'eu irei + infinitivo' используется, когда слово длинное (более 6 букв), чтобы избежать громоздкой формы futuro simples."},
  {"cat": "uso", "q": "Escolhe a forma alternativa correta e mais formal para: 'Eu vou confirmar a minha presença amanhã.'", "options": ["Eu confirmava a minha presença amanhã.", "Eu confirmarei a minha presença amanhã.", "Eu tenho confirmado a minha presença amanhã.", "Eu confirmo a minha presença amanhã."], "answer": 1, "writeAnswer": "Eu confirmarei a minha presença amanhã.", "explanation": "Futuro simples 'confirmarei' — формальный эквивалент конструкции 'ir + infinitivo'. Используется в документах, электронных письмах, официальной речи."},
  {"cat": "uso", "q": "Transforma para futuro simples: 'Eles vão fazer a reserva.'", "options": ["Eles fazerão a reserva.", "Eles fariam a reserva.", "Eles farão a reserva.", "Eles vão farão a reserva."], "answer": 2, "writeAnswer": "Eles farão a reserva.", "explanation": "'Fazer' в futuro simples для 'eles' — 'farão'. Глагол неправильный: основа меняется на 'far-' во всех лицах."},
  {"cat": "uso", "q": "Como se transforma 'Será que está muito trânsito?' numa frase mais formal com futuro?", "options": ["Será que estará muito trânsito?", "Estará muito trânsito?", "Haverá muito trânsito será?", "Está muito trânsito, não é?"], "answer": 1, "writeAnswer": "Estará muito trânsito?", "explanation": "Конструкция 'Será que + ação' можно заменить на 'глагол в futuro simples + подлежащее?'. Таким образом, 'Será que está…?' → 'Estará…?'"},
  {"cat": "uso", "q": "Qual é a expressão de tempo que NÃO está associada ao futuro?", "options": ["amanhã", "depois de amanhã", "no próximo mês", "ontem à tarde"], "answer": 3, "writeAnswer": "ontem à tarde", "explanation": "'Ontem à tarde' — вчера вечером, это прошедшее время. Все остальные варианты (amanhã, depois de amanhã, no próximo mês) относятся к будущему."},
  {"cat": "uso", "q": "Escolhe a frase mais adequada para um email formal de cancelamento:", "options": ["Vou cancelar a minha subscrição, ok?", "A subscrição vai ser cancelada.", "A subscrição será cancelada após confirmação.", "Cancelo já a subscrição, obrigada."], "answer": 2, "writeAnswer": "A subscrição será cancelada após confirmação.", "explanation": "В официальных документах и письмах используется futuro simples ('será cancelada'). Эта форма пассивного залога с futuro simples типична для формальной переписки."},
  {"cat": "ar", "q": "Qual é a frase correta com 'mencionar' no futuro simples?", "options": ["Eu mencionarei o teu nome no trabalho.", "Eu mencionerei o teu nome no trabalho.", "Eu mencionerarei o teu nome no trabalho.", "Eu vou mencionerai o teu nome no trabalho."], "answer": 0, "writeAnswer": "Eu mencionarei o teu nome no trabalho.", "explanation": "'Mencionar' — правильный глагол, futuro simples образуется по стандартной модели: основа инфинитива + окончания (-ei, -ás, -á, -emos, -ão). Отсюда: mencionarei."},
  {"cat": "uso", "q": "Qual é a diferença principal entre 'vou fazer' e 'farei'?", "options": ["'Vou fazer' é mais antigo e formal.", "'Farei' é mais usado em conversas informais.", "'Vou fazer' é usado em conversas; 'farei' é mais formal, para documentos e emails.", "Não há diferença, são exatamente iguais."], "answer": 2, "writeAnswer": "'Vou fazer' é usado em conversas; 'farei' é mais formal, para documentos e emails.", "explanation": "'Ir + infinitivo' — разговорная и неформальная форма будущего. Futuro simples ('farei') — формальная, используется в документах, письмах, официальной речи."},
  {"cat": "ir", "q": "Ela diz que o médico _____ por volta das 17h00. (vir, futuro simples)", "options": ["virá", "vinhará", "vem-rá", "vai vir"], "answer": 0, "writeAnswer": "virá", "explanation": "Vir в futuro: virei, virás, virá, viremos, virão. 'Vai vir' не говорят — вместо него 'vem' или 'virá'."},
  {"cat": "irreg", "q": "O João diz que _____ presentes para todos. (trazer → ele)", "options": ["trazerá", "trará", "traz-rá", "trazirá"], "answer": 1, "writeAnswer": "trará", "explanation": "Глаголы на -zer теряют 'ze': trazer → trarei, trarás, trará; dizer → direi; fazer → farei."},
  {"cat": "irreg", "q": "Complete: 'Eu nunca _____ isso a ninguém.' (dizer, futuro simples)", "options": ["dizerei", "direi", "dirá", "dizirei"], "answer": 1, "writeAnswer": "direi", "explanation": "Dizer → direi, dirás, dirá, diremos, dirão (как fazer → farei)."},
  {"cat": "uso", "q": "Ele tem 17 anos. No próximo ano _____ 18 anos.", "options": ["terá", "terei", "tenhará", "vai ter-á"], "answer": 0, "writeAnswer": "terá", "explanation": "Ter — правильный в futuro: terei, terás, terá… Ele → terá."},
  {"cat": "uso", "q": "Não fumo nem nunca _____.", "options": ["fumo", "fumava", "fumarei", "vou fumo"], "answer": 2, "writeAnswer": "fumarei", "explanation": "Конструкция 'не делаю и никогда не буду': nem nunca + futuro simples — não fumo nem nunca fumarei."},
  {"cat": "uso", "q": "O professor não veio às aulas. _____ doente?", "options": ["Estará", "Estava", "Esteve", "Estarei"], "answer": 0, "writeAnswer": "Estará", "explanation": "Futuro в вопросе = догадка о настоящем ('интересно, не болен ли он?'): Estará doente? = Será que está doente?"},
  {"cat": "uso", "q": "Hoje está muito frio. _____ que vai nevar?", "options": ["Será", "É", "Seria", "Foi"], "answer": 0, "writeAnswer": "Será", "explanation": "Será que… — вопрос-сомнение: Será que vai nevar?"},
  {"cat": "ar", "q": "Eu ___ português no próximo ano. (falar)", "options": ["falo", "falarei", "falei", "falarás"], "answer": 1, "writeAnswer": "falarei", "explanation": "Futuro simples, verbo -AR: falarei / falarás / falará / falaremos / falarão."},
  {"cat": "ar", "q": "Nós ___ em Lisboa no próximo ano. (morar)", "options": ["moramos", "morámos", "morarei", "moraremos"], "answer": 3, "writeAnswer": "moraremos", "explanation": "Futuro simples, verbo -AR: morarei / morarás / morará / moraremos / morarão."},
  {"cat": "ar", "q": "Tu ___ num banco no próximo ano. (trabalhar)", "options": ["trabalhas", "trabalharás", "trabalhaste", "trabalharei"], "answer": 1, "writeAnswer": "trabalharás", "explanation": "Futuro simples, verbo -AR: trabalharei / trabalharás / trabalhará / trabalharemos / trabalharão."},
  {"cat": "ar", "q": "Eles ___ à noite no próximo ano. (estudar)", "options": ["estudam", "estudaram", "estudarei", "estudarão"], "answer": 3, "writeAnswer": "estudarão", "explanation": "Futuro simples, verbo -AR: estudarei / estudarás / estudará / estudaremos / estudarão."},
  {"cat": "er", "q": "Eles ___ peixe no próximo ano. (comer)", "options": ["comem", "comerão", "comeram", "comerei"], "answer": 1, "writeAnswer": "comerão", "explanation": "Futuro simples, verbo -ER: comerei / comerás / comerá / comeremos / comerão."},
  {"cat": "er", "q": "A Ana ___ café no próximo ano. (beber)", "options": ["bebe", "bebeu", "beberei", "beberá"], "answer": 3, "writeAnswer": "beberá", "explanation": "Futuro simples, verbo -ER: beberei / beberás / beberá / beberemos / beberão."},
  {"cat": "er", "q": "Eu ___ português no próximo ano. (aprender)", "options": ["aprendo", "aprenderei", "aprendi", "aprenderás"], "answer": 1, "writeAnswer": "aprenderei", "explanation": "Futuro simples, verbo -ER: aprenderei / aprenderás / aprenderá / aprenderemos / aprenderão."},
  {"cat": "er", "q": "Nós ___ emails no próximo ano. (escrever)", "options": ["escrevemos", "escreverei", "escreverás", "escreveremos"], "answer": 3, "writeAnswer": "escreveremos", "explanation": "Futuro simples, verbo -ER: escreverei / escreverás / escreverá / escreveremos / escreverão."},
  {"cat": "ir", "q": "Nós ___ para o Porto no próximo ano. (partir)", "options": ["partimos", "partiremos", "partirei", "partirás"], "answer": 1, "writeAnswer": "partiremos", "explanation": "Futuro simples, verbo -IR: partirei / partirás / partirá / partiremos / partirão."},
  {"cat": "ir", "q": "Tu ___ a janela no próximo ano. (abrir)", "options": ["abres", "abriste", "abrirei", "abrirás"], "answer": 3, "writeAnswer": "abrirás", "explanation": "Futuro simples, verbo -IR: abrirei / abrirás / abrirá / abriremos / abrirão."},
  {"cat": "ir", "q": "Eles ___ a data da viagem no próximo ano. (decidir)", "options": ["decidem", "decidirão", "decidiram", "decidirei"], "answer": 1, "writeAnswer": "decidirão", "explanation": "Futuro simples, verbo -IR: decidirei / decidirás / decidirá / decidiremos / decidirão."},
  {"cat": "ir", "q": "A Ana ___ a conta no próximo ano. (dividir)", "options": ["divide", "dividiu", "dividirei", "dividirá"], "answer": 3, "writeAnswer": "dividirá", "explanation": "Futuro simples, verbo -IR: dividirei / dividirás / dividirá / dividiremos / dividirão."},
];

const labelMap = { ar:"-AR", er:"-ER", ir:"-IR", irreg:"Irregulares", uso:"Uso / contexto" };
const classMap = { ar:"cat-ar", er:"cat-er", ir:"cat-ir", irreg:"cat-irreg", uso:"cat-uso" };

let mode = 'choice', activeFilter = 'todos';
let shuffled = [], current = 0, score = 0, answered = false, mistakes = [];

function shuffle(arr) { return [...arr].sort(() => Math.random() - 0.5); }

function setMode(m) {
  mode = m;
  document.getElementById('btnChoice').classList.toggle('active', m === 'choice');
  document.getElementById('btnWrite').classList.toggle('active', m === 'write');
  restart();
}

function setFilter(cat, btn) {
  activeFilter = cat;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active-f'));
  btn.classList.add('active-f');
  restart();
}

function restart() {
  let pool = activeFilter === 'todos' ? questions : questions.filter(q => q.cat === activeFilter);
  if (mode === 'write') {
    const w = pool.filter(q => q.q.includes('___') && !q.writeAnswer.includes(' '));
    if (w.length) pool = w; else { mode = 'choice';
      document.getElementById('btnChoice').classList.add('active'); document.getElementById('btnWrite').classList.remove('active'); }
  }
  if (!pool.length) pool = questions;
  shuffled = shuffle(pool);
  current = 0; score = 0; answered = false; mistakes = [];
  document.getElementById('results').classList.remove('show');
  document.getElementById('quizCard').style.display = 'block';
  renderQuestion();
}

function renderQuestion() {
  if (current >= shuffled.length) { showResults(); return; }
  const q = shuffled[current];
  const total = shuffled.length;

  document.getElementById('progressBar').style.width = (current / total * 100) + '%';
  document.getElementById('progressLabel').textContent = 'Questão ' + (current + 1) + ' de ' + total;

  const badge = document.getElementById('badge');
  badge.textContent = labelMap[q.cat];
  badge.className = 'category-badge ' + classMap[q.cat];

  document.getElementById('feedback').className = 'feedback';
  document.getElementById('nextBtn').className = 'next-btn';
  answered = false;

  document.getElementById('choiceArea').style.display = 'none';
  document.getElementById('writeArea').style.display = 'none';

  if (mode === 'choice') {
    document.getElementById('choiceArea').style.display = 'block';
    document.getElementById('question').textContent = q.q;
    const optDiv = document.getElementById('options');
    optDiv.innerHTML = '';
    const indices = q.options.map((_,i) => i);
    const si = shuffle(indices);
    const newCorrect = si.indexOf(q.answer);
    si.forEach((origIdx, newIdx) => {
      const btn = document.createElement('button');
      btn.className = 'option-btn';
      btn.textContent = q.options[origIdx];
      btn.onclick = () => selectAnswer(newIdx, newCorrect, q);
      optDiv.appendChild(btn);
    });
  } else {
    document.getElementById('writeArea').style.display = 'block';
    // Split question to show blank
    const parts = q.q.split('___');
    const verbMatch = q.q.match(/\(([^)]+)\)/);
    const verbHintText = verbMatch ? 'Verbo: ' + verbMatch[1] : '';
    const sd = document.getElementById('sentenceDisplay');
    sd.innerHTML = '';
    sd.appendChild(document.createTextNode(parts[0]));
    const blankEl = document.createElement('span');
    blankEl.className = 'sentence-blank';
    blankEl.id = 'blankSpan';
    blankEl.textContent = '___';
    sd.appendChild(blankEl);
    sd.appendChild(document.createTextNode(parts[1] || ''));
    document.getElementById('verbHint').textContent = verbHintText;
    const inp = document.getElementById('writeInput');
    inp.value = ''; inp.className = 'write-input'; inp.disabled = false;
    document.getElementById('checkBtn').disabled = false;
    setTimeout(() => inp.focus(), 50);
  }
}

function selectAnswer(chosen, correct, q) {
  if (answered) return;
  answered = true;
  const btns = document.querySelectorAll('.option-btn');
  btns.forEach(b => b.disabled = true);
  btns[correct].classList.add('correct');
  const fb = document.getElementById('feedback');
  if (chosen === correct) {
    score++; btns[chosen].classList.add('correct');
    fb.className = 'feedback ok show';
    fb.textContent = 'Correto! ' + q.explanation;
  } else {
    btns[chosen].classList.add('wrong');
    fb.className = 'feedback err show';
    fb.textContent = 'Incorreto. ' + q.explanation;
    mistakes.push({ q: q.q, wrong: btns[chosen].textContent, right: q.writeAnswer });
  }
  document.getElementById('nextBtn').className = 'next-btn show';
}

function checkWrite() {
  if (answered) return;
  const q = shuffled[current];
  const inp = document.getElementById('writeInput');
  const raw = inp.value.trim();
  if (!raw) return;
  answered = true;
  inp.disabled = true;
  document.getElementById('checkBtn').disabled = true;

  // Strict: exact match (case insensitive, accents required)
  const correct = raw.toLowerCase() === q.writeAnswer.toLowerCase();
  const blank = document.getElementById('blankSpan');
  if (blank) {
    blank.textContent = correct ? raw : q.writeAnswer;
    blank.style.borderColor = correct ? '#68d391' : '#fc8181';
    blank.style.color = correct ? '#276749' : '#c53030';
  }
  const fb = document.getElementById('feedback');
  if (correct) {
    score++; inp.className = 'write-input correct-inp';
    fb.className = 'feedback ok show';
    fb.textContent = 'Correto! ' + q.explanation;
  } else {
    inp.className = 'write-input wrong-inp';
    fb.className = 'feedback err show';
    fb.textContent = 'Forma correta: «' + q.writeAnswer + '». ' + q.explanation;
    mistakes.push({ q: q.q, wrong: raw, right: q.writeAnswer });
  }
  document.getElementById('nextBtn').className = 'next-btn show';
}

function nextQuestion() { current++; renderQuestion(); }

function showResults() {
  document.getElementById('quizCard').style.display = 'none';
  document.getElementById('progressBar').style.width = '100%';
  const total = shuffled.length;
  const pct = Math.round(score / total * 100);
  document.getElementById('scoreNum').textContent = score;
  document.getElementById('scoreDenom').textContent = 'de ' + total;
  const msgs = pct >= 90 ? ['Excelente!','Dominas os verbos!'] : pct >= 70 ? ['Muito bem!','Revê os erros abaixo.'] : pct >= 50 ? ['Continua!','Há espaço para melhorar.'] : ['Não desistas!','Revê as conjugações!'];
  document.getElementById('resultsTitle').textContent = msgs[0];
  document.getElementById('resultsMsg').textContent = pct + '% correto. ' + msgs[1];
  const ml = document.getElementById('mistakesList');
  ml.innerHTML = mistakes.length ? '<h3>Erros para rever:</h3>' + mistakes.map(m =>
    '<div class="mistake-item"><div>' + m.q + '</div><div>Escreveste: <strong>' + m.wrong + '</strong> &nbsp;|&nbsp; Correto: <span class="correct-ans">' + m.right + '</span></div></div>'
  ).join('') : '<p style="color:#276749;margin-top:16px">Sem erros! Perfeito!</p>';
  document.getElementById('results').classList.add('show');
}

document.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  if (!answered && mode === 'write') checkWrite();
  else if (answered) { const nb = document.getElementById('nextBtn'); if (nb.classList.contains('show')) nextQuestion(); }
});

restart();
</script>
</body>
</html>
