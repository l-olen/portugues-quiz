<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz -- Tempo e Clima</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', Arial, sans-serif; background: #f0f4f8; color: #2d3748; min-height: 100vh; padding: 20px; }
  .container { max-width: 680px; margin: 0 auto; }
  header { text-align: center; padding: 30px 0 20px; }
  header h1 { font-size: 1.8rem; color: #2c5282; margin-bottom: 6px; }
  header p { color: #718096; font-size: 0.95rem; }
  .back-link { display: inline-block; margin-bottom: 16px; color: #718096; font-size: 0.88rem; text-decoration: none; }
  .back-link:hover { color: #2c5282; }
  .filter-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
  .filter-btn { padding: 7px 16px; border-radius: 20px; border: 2px solid #e2e8f0; background: white; font-size: 0.85rem; font-weight: 600; cursor: pointer; color: #718096; transition: all 0.15s; }
  .filter-btn.active { background: #2c5282; border-color: #2c5282; color: white; }
  .filter-btn:hover:not(.active) { border-color: #90cdf4; color: #2c5282; }
  .progress-bar-wrap { background: #e2e8f0; border-radius: 8px; height: 8px; margin: 20px 0; }
  .progress-bar { height: 8px; border-radius: 8px; background: linear-gradient(90deg, #2c5282, #90cdf4); transition: width 0.4s ease; }
  .progress-label { text-align: right; font-size: 0.82rem; color: #718096; margin-top: 4px; }
  .card { background: white; border-radius: 16px; padding: 30px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); margin-bottom: 20px; }
  .category-badge { display: inline-block; font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; padding: 3px 10px; border-radius: 20px; margin-bottom: 14px; }
  .badge-vocab { background: #ebf8ff; color: #2c5282; }
  .badge-verbos { background: #e6fffa; color: #276749; }
  .badge-expr { background: #faf5ff; color: #553c9a; }
  .question { font-size: 1.1rem; font-weight: 600; line-height: 1.6; margin-bottom: 20px; }
  .options { display: flex; flex-direction: column; gap: 10px; }
  .option-btn { background: #f7fafc; border: 2px solid #e2e8f0; border-radius: 10px; padding: 13px 18px; font-size: 1rem; text-align: left; cursor: pointer; transition: all 0.15s; color: #2d3748; }
  .option-btn:hover:not(:disabled) { background: #ebf8ff; border-color: #90cdf4; }
  .option-btn.correct { background: #f0fff4; border-color: #68d391; color: #276749; font-weight: 600; }
  .option-btn.wrong { background: #fff5f5; border-color: #fc8181; color: #c53030; }
  .option-btn:disabled { cursor: default; }
  .feedback { margin-top: 16px; padding: 12px 16px; border-radius: 10px; font-size: 0.9rem; line-height: 1.5; display: none; }
  .feedback.show { display: block; }
  .feedback.ok  { background: #f0fff4; color: #276749; border-left: 4px solid #68d391; }
  .feedback.err { background: #fff5f5; color: #c53030; border-left: 4px solid #fc8181; }
  .next-btn { display: none; margin-top: 18px; width: 100%; padding: 14px; background: #2c5282; color: white; border: none; border-radius: 10px; font-size: 1rem; font-weight: 600; cursor: pointer; }
  .next-btn:hover { background: #2a4365; }
  .next-btn.show { display: block; }
  .results { display: none; text-align: center; padding: 40px 30px; }
  .results.show { display: block; }
  .score-circle { width: 120px; height: 120px; border-radius: 50%; background: linear-gradient(135deg, #2c5282, #90cdf4); display: flex; flex-direction: column; align-items: center; justify-content: center; margin: 0 auto 20px; color: white; }
  .score-circle .num { font-size: 2.2rem; font-weight: 700; line-height: 1; }
  .score-circle .denom { font-size: 0.85rem; opacity: 0.85; }
  .results h2 { font-size: 1.5rem; margin-bottom: 8px; }
  .results p { color: #718096; margin-bottom: 24px; }
  .btn-row { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  .restart-btn { padding: 13px 32px; background: #2c5282; color: white; border: none; border-radius: 10px; font-size: 1rem; font-weight: 600; cursor: pointer; }
  .home-btn { padding: 13px 32px; background: #edf2f7; color: #4a5568; border: none; border-radius: 10px; font-size: 1rem; font-weight: 600; cursor: pointer; text-decoration: none; display: inline-block; }
  .mistakes-list { text-align: left; margin-top: 28px; }
  .mistakes-list h3 { font-size: 1rem; color: #c53030; margin-bottom: 12px; }
  .mistake-item { background: #fff5f5; border-radius: 8px; padding: 10px 14px; margin-bottom: 8px; font-size: 0.88rem; line-height: 1.5; }
  .mistake-item strong { color: #c53030; }
  .mistake-item .correct-ans { color: #276749; font-weight: 600; }
</style>
</head>
<body>
<div class="container">
  <a class="back-link" href="index.html">← Voltar ao menu</a>
  <header>
    <h1>⛅ Tempo e Clima</h1>
    <p>vocabulário · verbos · descrições · expressões</p>
  </header>
  <div class="filter-row">
    <button class="filter-btn active" onclick="setFilter('todos',this)">Todos (18)</button>
    <button class="filter-btn" onclick="setFilter('vocab',this)">Vocabulário</button>
    <button class="filter-btn" onclick="setFilter('verbos',this)">Verbos</button>
    <button class="filter-btn" onclick="setFilter('expr',this)">Expressões</button>
  </div>
  <div class="progress-bar-wrap"><div class="progress-bar" id="progressBar" style="width:0%"></div></div>
  <div class="progress-label" id="progressLabel"></div>
  <div class="card" id="quizCard">
    <div class="category-badge" id="badge"></div>
    <div class="question" id="question"></div>
    <div class="options" id="options"></div>
    <div class="feedback" id="feedback"></div>
    <button class="next-btn" id="nextBtn" onclick="nextQuestion()">Próxima questão →</button>
  </div>
  <div class="card results" id="results">
    <div class="score-circle"><span class="num" id="scoreNum"></span><span class="denom" id="scoreDenom"></span></div>
    <h2 id="resultsTitle"></h2><p id="resultsMsg"></p>
    <div class="btn-row">
      <button class="restart-btn" onclick="restart()">Repetir quiz</button>
      <a class="home-btn" href="index.html">Menu principal</a>
    </div>
    <div class="mistakes-list" id="mistakesList"></div>
  </div>
</div>
<script>
const allQuestions = [
  // Vocabulário
  { cat:"vocab", q:"Como se diz «дождь» em português?", options:["a neve","o calor","a chuva","o vento"], answer:2, explanation:"A CHUVA = дождь. O verbo: CHOVER. Está a chover = Идёт дождь." },
  { cat:"vocab", q:"Como se diz «снег» em português?", options:["a chuva","o nevoeiro","a neve","o gelo"], answer:2, explanation:"A NEVE = снег. O verbo: NEVAR. Está a nevar = Идёт снег." },
  { cat:"vocab", q:"«Nublado» significa:", options:["жарко","пасмурно/облачно","душно","ветрено"], answer:1, explanation:"NUBLADO = пасмурно, облачно. O céu está nublado = Небо затянуто облаками. Антоним: céu limpo/aberto = ясное небо." },
  { cat:"vocab", q:"«Abafado» significa:", options:["ветрено","холодно","душно/жарко и влажно","морозно"], answer:2, explanation:"ABAFADO = душно (жара + влажность). Que dia abafado! = Какой душный день! Muito comum em Portugal no verão." },
  { cat:"vocab", q:"«A precipitação» significa:", options:["жара","осадки (дождь/снег)","туман","влажность"], answer:1, explanation:"A PRECIPITAÇÃO = осадки (дождь, снег, град). Termo mais técnico/formal — usado em boletins meteorológicos." },
  { cat:"vocab", q:"Como se diz «климат» em português?", options:["o tempo","a temperatura","o clima","a estação"], answer:2, explanation:"O CLIMA = климат (долгосрочная характеристика). O TEMPO = погода (сейчас). Que tempo faz hoje? = Какая сегодня погода?" },
  { cat:"vocab", q:"«Moderado» no contexto de tempo significa:", options:["сильный","очень жаркий","умеренный","переменный"], answer:2, explanation:"MODERADO = умеренный. Temperatura moderada = умеренная температура. Vento moderado = умеренный ветер." },
  { cat:"vocab", q:"Qual a diferença: «o tempo» vs «o clima»?", options:["Não há diferença","Tempo = сейчас; Clima = многолетняя характеристика","Tempo = лето; Clima = зима","Tempo = Portugal; Clima = outros países"], answer:1, explanation:"O TEMPO = текущая погода (сегодня). O CLIMA = климат (за долгое время). O tempo hoje está mau, mas o clima de Portugal é ameno = Сегодня плохая погода, но климат Португалии мягкий." },
  // Verbos
  { cat:"verbos", q:"«Está a chover.» O que significa?", options:["Будет дождь","Идёт дождь (сейчас)","Шёл дождь","Дождь кончился"], answer:1, explanation:"ESTAR A + INFINITIVO = действие в процессе (сейчас). Está a chover = Идёт дождь. Também: Está chovendo (Brasil)." },
  { cat:"verbos", q:"«Ontem nevou muito.» Que tempo é?", options:["Presente","Imperfeito","PPS","Futuro"], answer:2, explanation:"NEVOU = PPS de NEVAR (eu nevou? Não — NEVAR é impessoal: nevou). PPS indica evento específico no passado: Ontem nevou muito = Вчера много шло снега." },
  { cat:"verbos", q:"«No inverno, ___ muito em Lisboa.» (chover, hábito)", options:["choveu","chove","chovia","vai chover"], answer:2, explanation:"CHOVIA = Imperfeito de CHOVER. Hábito/situação típica do passado: No inverno, chovia muito = Зимой шло много дождя (раньше/обычно). Presente: No inverno, chove muito = Зимой идёт много дождя (сейчас/обычно)." },
  { cat:"verbos", q:"«O sol está a ___» — qual verbo?", options:["chover","brilhar","nevar","soprar"], answer:1, explanation:"BRILHAR = светить, сиять. O sol está a brilhar = Светит солнце. Também: soprar (vento sopra = ветер дует)." },
  // Expressões
  { cat:"expr", q:"«Que tempo faz hoje?» É uma pergunta sobre:", options:["который час","какая погода сегодня","какое время года","сколько времени"], answer:1, explanation:"QUE TEMPO FAZ? = Какая погода? FAZ CALOR/FRIO = жарко/холодно. Está sol = Солнечно. Está a chover = Дождь." },
  { cat:"expr", q:"«Faz calor» significa:", options:["Холодно","Жарко","Ветрено","Пасмурно"], answer:1, explanation:"FAZ CALOR = жарко. FAZ FRIO = холодно. FAZ BOM TEMPO = хорошая погода. FAZ MAU TEMPO = плохая погода. Com FAZER — sem artigo!" },
  { cat:"expr", q:"«Está sol» significa:", options:["Солнечно","Облачно","Душно","Ясно и холодно"], answer:0, explanation:"ESTÁ SOL = солнечно. Также: HÁ SOL. Está muito sol hoje! = Сегодня очень солнечно!" },
  { cat:"expr", q:"«Apanhar sol» significa:", options:["прятаться от солнца","загорать","наблюдать за погодой","идти на улицу"], answer:1, explanation:"APANHAR SOL = загорать, греться на солнце. Apanhar chuva = попасть под дождь. Ex.: Ela foi à praia apanhar sol." },
  { cat:"expr", q:"«Hoje o tempo está péssimo.» Significa:", options:["Сегодня отличная погода","Сегодня очень плохая погода","Сегодня переменная погода","Сегодня умеренная погода"], answer:1, explanation:"PÉSSIMO = очень плохой (суперлатив от MAU). O tempo está péssimo = Погода ужасная. O tempo está ótimo = Погода отличная." },
  { cat:"expr", q:"«Leva um guarda-chuva, está a chover.» Что такое guarda-chuva?", options:["зонт","плащ","сапоги","шарф"], answer:0, explanation:"GUARDA-CHUVA = зонт (дословно: «защита от дождя»). Abrir/fechar o guarda-chuva = открыть/закрыть зонт." },
];

const badges = { vocab:"Vocabulário", verbos:"Verbos", expr:"Expressões" };
const badgeClass = { vocab:"badge-vocab", verbos:"badge-verbos", expr:"badge-expr" };
let filtered = [...allQuestions], current = 0, score = 0, mistakes = [];

function setFilter(cat, btn) {
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  filtered = cat === 'todos' ? [...allQuestions] : allQuestions.filter(q => q.cat === cat);
  current = 0; score = 0; mistakes = [];
  document.getElementById('quizCard').style.display = '';
  document.getElementById('results').className = 'card results';
  document.getElementById('mistakesList').innerHTML = '';
  loadQuestion();
}

function loadQuestion() {
  const q = filtered[current];
  document.getElementById('progressBar').style.width = (current / filtered.length * 100) + '%';
  document.getElementById('progressLabel').textContent = `Questão ${current + 1} de ${filtered.length}`;
  const badge = document.getElementById('badge');
  badge.textContent = badges[q.cat];
  badge.className = 'category-badge ' + badgeClass[q.cat];
  document.getElementById('question').textContent = q.q;
  const opts = document.getElementById('options');
  opts.innerHTML = '';
  q.options.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.textContent = opt;
    btn.onclick = () => selectAnswer(i);
    opts.appendChild(btn);
  });
  document.getElementById('feedback').className = 'feedback';
  document.getElementById('nextBtn').className = 'next-btn';
}

function selectAnswer(i) {
  const q = filtered[current];
  const btns = document.querySelectorAll('.option-btn');
  btns.forEach(b => b.disabled = true);
  const fb = document.getElementById('feedback');
  if (i === q.answer) {
    score++;
    btns[i].classList.add('correct');
    fb.className = 'feedback ok show';
    fb.textContent = 'Correto! ' + q.explanation;
  } else {
    btns[i].classList.add('wrong');
    btns[q.answer].classList.add('correct');
    fb.className = 'feedback err show';
    fb.textContent = 'Incorreto. ' + q.explanation;
    mistakes.push({ q: q.q, yours: q.options[i], correct: q.options[q.answer] });
  }
  document.getElementById('nextBtn').className = 'next-btn show';
}

function nextQuestion() {
  current++;
  if (current < filtered.length) { loadQuestion(); }
  else { showResults(); }
}

function showResults() {
  document.getElementById('quizCard').style.display = 'none';
  const r = document.getElementById('results');
  r.className = 'card results show';
  document.getElementById('scoreNum').textContent = score;
  document.getElementById('scoreDenom').textContent = '/ ' + filtered.length;
  const pct = Math.round(score / filtered.length * 100);
  document.getElementById('resultsTitle').textContent = pct >= 80 ? 'Muito bem!' : pct >= 60 ? 'Bom trabalho!' : 'Continua a praticar!';
  document.getElementById('resultsMsg').textContent = `Acertaste ${score} de ${filtered.length} questões (${pct}%).`;
  const ml = document.getElementById('mistakesList');
  if (mistakes.length) {
    ml.innerHTML = '<h3>Erros para rever:</h3>' + mistakes.map(m =>
      `<div class="mistake-item"><strong>${m.q}</strong><br>A tua resposta: ${m.yours}<br><span class="correct-ans">Correto: ${m.correct}</span></div>`
    ).join('');
  }
}

function restart() {
  current = 0; score = 0; mistakes = [];
  document.getElementById('quizCard').style.display = '';
  document.getElementById('results').className = 'card results';
  document.getElementById('mistakesList').innerHTML = '';
  loadQuestion();
}

loadQuestion();
</script>
</body>
</html>
