<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz -- tomar o pequeno-almoço                 // o pequeno-almoço / almoçar                                         // o almoço</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', Arial, sans-serif; background: #f0f4f8; color: #2d3748; min-height: 100vh; padding: 20px; }
  .container { max-width: 680px; margin: 0 auto; }
  header { text-align: center; padding: 30px 0 20px; }
  header h1 { font-size: 1.8rem; color: #744210; margin-bottom: 6px; }
  header p { color: #718096; font-size: 0.95rem; }
  .back-link { display: inline-block; margin-bottom: 16px; color: #718096; font-size: 0.88rem; text-decoration: none; }
  .back-link:hover { color: #744210; }
  .progress-bar-wrap { background: #e2e8f0; border-radius: 8px; height: 8px; margin: 20px 0; }
  .progress-bar { height: 8px; border-radius: 8px; background: linear-gradient(90deg, #d69e2e, #f6e05e); transition: width 0.4s ease; }
  .progress-label { text-align: right; font-size: 0.82rem; color: #718096; margin-top: 4px; }
  .card { background: white; border-radius: 16px; padding: 30px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); margin-bottom: 20px; }
  .category-badge { display: inline-block; font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; padding: 3px 10px; border-radius: 20px; margin-bottom: 14px; }
  .badge-gramática  { background: #fffbeb; color: #92400e; }
  .badge-vocabulário { background: #ecfdf5; color: #065f46; }
  .badge-prática { background: #eff6ff; color: #1e40af; }
  .question { font-size: 1.15rem; font-weight: 600; line-height: 1.5; margin-bottom: 20px; }
  .options { display: flex; flex-direction: column; gap: 10px; }
  .option-btn { background: #f7fafc; border: 2px solid #e2e8f0; border-radius: 10px; padding: 13px 18px; font-size: 1rem; text-align: left; cursor: pointer; transition: all 0.15s; color: #2d3748; }
  .option-btn:hover:not(:disabled) { background: #fffbeb; border-color: #f6d860; }
  .option-btn.correct { background: #f0fff4; border-color: #68d391; color: #276749; font-weight: 600; }
  .option-btn.wrong { background: #fff5f5; border-color: #fc8181; color: #c53030; }
  .option-btn:disabled { cursor: default; }
  .feedback { margin-top: 16px; padding: 12px 16px; border-radius: 10px; font-size: 0.9rem; line-height: 1.5; display: none; }
  .feedback.show { display: block; }
  .feedback.ok  { background: #f0fff4; color: #276749; border-left: 4px solid #68d391; }
  .feedback.err { background: #fff5f5; color: #c53030; border-left: 4px solid #fc8181; }
  .next-btn { display: none; margin-top: 18px; width: 100%; padding: 14px; background: #d69e2e; color: white; border: none; border-radius: 10px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: background 0.15s; }
  .next-btn:hover { background: #b7791f; }
  .next-btn.show { display: block; }
  .results { display: none; text-align: center; padding: 40px 30px; }
  .results.show { display: block; }
  .score-circle { width: 120px; height: 120px; border-radius: 50%; background: linear-gradient(135deg, #d69e2e, #f6e05e); display: flex; flex-direction: column; align-items: center; justify-content: center; margin: 0 auto 20px; color: white; }
  .score-circle .num { font-size: 2.2rem; font-weight: 700; line-height: 1; }
  .score-circle .denom { font-size: 0.85rem; opacity: 0.85; }
  .results h2 { font-size: 1.5rem; margin-bottom: 8px; }
  .results p { color: #718096; margin-bottom: 24px; }
  .btn-row { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  .restart-btn { padding: 13px 32px; background: #d69e2e; color: white; border: none; border-radius: 10px; font-size: 1rem; font-weight: 600; cursor: pointer; }
  .restart-btn:hover { background: #b7791f; }
  .home-btn { padding: 13px 32px; background: #edf2f7; color: #4a5568; border: none; border-radius: 10px; font-size: 1rem; font-weight: 600; cursor: pointer; text-decoration: none; display: inline-block; }
  .home-btn:hover { background: #e2e8f0; }
  .mistakes-list { text-align: left; margin-top: 28px; }
  .mistakes-list h3 { font-size: 1rem; color: #c53030; margin-bottom: 12px; }
  .mistake-item { background: #fff5f5; border-radius: 8px; padding: 10px 14px; margin-bottom: 8px; font-size: 0.88rem; line-height: 1.5; }
  .mistake-item strong { color: #c53030; }
  .mistake-item .correct-ans { color: #276749; font-weight: 600; }
</style>
</head>
<body>
<div class="container">
  <a class="back-link" href="index.html">← Voltar ao menu</a>
  <header>
    <h1>tomar o pequeno-almoço                 // o pequeno-almoço / almoçar                                         // o almoço</h1>
    <p>Урок 2026-08-14 · 18 вопросов</p>
  </header>
  <div class="progress-bar-wrap"><div class="progress-bar" id="progressBar" style="width:0%"></div></div>
  <div class="progress-label" id="progressLabel"></div>
  <div class="card" id="quizCard">
    <div class="category-badge" id="badge"></div>
    <div class="question" id="question"></div>
    <div class="options" id="options"></div>
    <div class="feedback" id="feedback"></div>
    <button class="next-btn" id="nextBtn" onclick="nextQuestion()">Próxima questão →</button>
  </div>
  <div class="card results" id="results">
    <div class="score-circle"><span class="num" id="scoreNum"></span><span class="denom" id="scoreDenom"></span></div>
    <h2 id="resultsTitle"></h2><p id="resultsMsg"></p>
    <div class="btn-row">
      <button class="restart-btn" onclick="restart()">Repetir quiz</button>
      <a class="home-btn" href="index.html">Menu principal</a>
    </div>
    <div class="mistakes-list" id="mistakesList"></div>
  </div>
</div>
<script>
const questions = [
  {
    "cat": "vocabulário",
    "q": "Как по-португальски называется приём пищи «завтрак»?",
    "options": [
      "o jantar",
      "o almoço",
      "o pequeno-almoço",
      "o lanche"
    ],
    "answer": 2,
    "explanation": "В европейском португальском завтрак — o pequeno-almoço. O jantar — ужин, o almoço — обед, o lanche — полдник."
  },
  {
    "cat": "vocabulário",
    "q": "Какое слово обозначает «полдник» (перекус во второй половине дня)?",
    "options": [
      "o almoço",
      "o lanche",
      "o jantar",
      "o pequeno-almoço"
    ],
    "answer": 1,
    "explanation": "O lanche — полдник/перекус, глагол lanchar. Порядок приёмов пищи: pequeno-almoço → almoço → lanche → jantar."
  },
  {
    "cat": "gramática",
    "q": "Выбери правильную форму: «___ 3 horas da tarde vou almoçar.»",
    "options": [
      "À",
      "Às",
      "Ao",
      "A"
    ],
    "answer": 1,
    "explanation": "Перед множественным числом (as 3 horas) предлог «a» сливается с артиклем «as» → «às». Форма «à» используется только с единственным числом женского рода (à 1 hora)."
  },
  {
    "cat": "gramática",
    "q": "Как правильно сказать «в полдень» по-португальски?",
    "options": [
      "à meio-dia",
      "às meio-dia",
      "ao meio-dia",
      "no meio-dia"
    ],
    "answer": 2,
    "explanation": "«Meio-dia» — мужского рода (ele), поэтому предлог «a» + «o» = «ao meio-dia». Ср.: «à meia-noite» — женский род."
  },
  {
    "cat": "vocabulário",
    "q": "Что означает выражение «o almoço está pronto»?",
    "options": [
      "Обед ещё готовится",
      "Обед готов / подан",
      "Обед был вкусным",
      "Обед уже съеден"
    ],
    "answer": 1,
    "explanation": "«Pronto/a» и «feito/a» оба означают «готово», употребляются со глаголом estar. «O almoço está pronto» = обед готов."
  },
  {
    "cat": "gramática",
    "q": "Вставь правильное слово: «Tens ___ caneta para mim?» (есть ли у тебя какая-нибудь ручка для меня?)",
    "options": [
      "qualquer",
      "nenhuma",
      "alguma",
      "muita"
    ],
    "answer": 2,
    "explanation": "«Alguma» используется в вопросах, когда мы не уверены в наличии чего-либо. «Qualquer» — любая (безразлично какая), «nenhuma» — никакой, «muita» — много."
  },
  {
    "cat": "gramática",
    "q": "Выбери правильную форму: «Podes vir ___ hora.» (Ты можешь прийти в любое время.)",
    "options": [
      "alguma",
      "nenhuma",
      "qualquer",
      "muita"
    ],
    "answer": 2,
    "explanation": "«Qualquer» используется, когда все варианты одинаково подходят и нет предпочтений. «A qualquer hora» = в любое время."
  },
  {
    "cat": "gramática",
    "q": "Как правильно сказать «В полночь» по-португальски?",
    "options": [
      "ao meia-noite",
      "à meia-noite",
      "às meia-noite",
      "na meia-noite"
    ],
    "answer": 1,
    "explanation": "«Meia-noite» — женского рода (ela), поэтому a + a = «à meia-noite». Ср.: «ao meio-dia» — мужской род."
  },
  {
    "cat": "gramática",
    "q": "Выбери правильное предложение о количестве:",
    "options": [
      "Há muito pessoas na rua.",
      "Há muitas pessoas na rua.",
      "Há muita pessoas na rua.",
      "Há muitас pessoas na rua."
    ],
    "answer": 1,
    "explanation": "«Muito» согласуется с существительным: pessoas — женский род, множественное число → «muitas». Правило: muito/muita/muitos/muitas + существительное."
  },
  {
    "cat": "gramática",
    "q": "Что означает «tanto faz»?",
    "options": [
      "Это очень много",
      "Всё равно / не имеет значения",
      "Он делает так много",
      "Это происходит так часто"
    ],
    "answer": 1,
    "explanation": "«Tanto faz» — устойчивое выражение, означает «всё равно», «без разницы». «Ele estuda tanto!» = он так много учится — другое употребление «tanto»."
  },
  {
    "cat": "vocabulário",
    "q": "Чем отличается «fatia» от «bocado»?",
    "options": [
      "Нет разницы, это синонимы",
      "«Fatia» — кусок, отрезанный ножом; «bocado» — кусок без разрезания",
      "«Bocado» — кусок хлеба, «fatia» — кусок мяса",
      "«Fatia» используется только для фруктов"
    ],
    "answer": 1,
    "explanation": "«Fatia» (slice) — ломтик, отрезанный ножом. «Bocado» (piece) — кусок, не обязательно отрезанный. «Pedaço» = bocado, но не о еде."
  },
  {
    "cat": "gramática",
    "q": "Выбери правильное предложение с «todos»:",
    "options": [
      "Todo os dias eu tomo o pequeno-almoço.",
      "Todos os dias eu tomo o pequeno-almoço.",
      "Todas os dias eu tomo o pequeno-almoço.",
      "Os todos dias eu tomo o pequeno-almoço."
    ],
    "answer": 1,
    "explanation": "«Todos os dias» = каждый день. «Todos» согласуется с «os dias» (мужской род, мн.ч.). Ср.: «o dia todo» = весь день (другой порядок и значение)."
  },
  {
    "cat": "prática",
    "q": "Как перевести на португальский: «Я уже говорила тебе это столько раз»?",
    "options": [
      "Eu já te disse isso tantos vezes.",
      "Eu já te disse isso tantas vezes.",
      "Eu já te disse isso muito vezes.",
      "Eu já te disse isso tanta vezes."
    ],
    "answer": 1,
    "explanation": "«Vezes» — женский род, множественное число → «tantas vezes». «Tanto/a/os/as» согласуется с существительным по роду и числу."
  },
  {
    "cat": "prática",
    "q": "Твой друг говорит «Anda cá!». Что он имеет в виду?",
    "options": [
      "Иди туда!",
      "Иди сюда! (ко мне)",
      "Оставайся здесь!",
      "Иди домой!"
    ],
    "answer": 1,
    "explanation": "«Cá» означает «сюда / здесь» (по направлению к говорящему). «Anda cá!» = иди сюда! В PE «cá» и «aqui» близки, но «cá» чаще с глаголами движения."
  },
  {
    "cat": "gramática",
    "q": "«Às tantas da noite» означает:",
    "options": [
      "Ровно в полночь",
      "Очень поздно ночью, точное время неизвестно",
      "В несколько часов ночи, точно",
      "Иногда ночью"
    ],
    "answer": 1,
    "explanation": "«Às tantas» — разговорное выражение: что-то случилось очень поздно, точное время неизвестно. «Às tantas da noite» ≈ «в какое-то время поздно ночью»."
  },
  {
    "cat": "prática",
    "q": "Выбери правильный вариант: «___ Portugal as pessoas são muito simpáticas.»",
    "options": [
      "Aqui em",
      "Lá em",
      "Cá em",
      "Ali em"
    ],
    "answer": 2,
    "explanation": "«Cá em Portugal» — типичное PE-выражение: «у нас в Португалии». «Cá» выражает принадлежность говорящего к месту. «Lá» — вдали от говорящего и слушающего."
  },
  {
    "cat": "gramática",
    "q": "Выбери правильную форму: «Não há ___ livro interessante aqui.»",
    "options": [
      "algum",
      "qualquer",
      "nenhum",
      "muito"
    ],
    "answer": 2,
    "explanation": "«Nenhum/nenhuma» используется в отрицательных предложениях и означает «никакой». «Não há nenhum livro» = нет ни одной книги. В PE двойное отрицание нормально: «não há nenhum»."
  },
  {
    "cat": "prática",
    "q": "Как правильно сказать «в 8 утра» по-португальски?",
    "options": [
      "às 8 horas de manhã",
      "às 8 horas da manhã",
      "às 8 horas pela manhã",
      "à 8 horas da manhã"
    ],
    "answer": 1,
    "explanation": "Правильная конструкция: «às [часы] da manhã/tarde/noite». «De manhã» используется без указания конкретного времени (= утром вообще), а с часами — «da manhã»."
  }
];
const labelMap = { "gramática":"Gramática", "vocabulário":"Vocabulário", "prática":"Prática" };
const classMap = { "gramática":"badge-gramática", "vocabulário":"badge-vocabulário", "prática":"badge-prática" };
let current=0,score=0,answered=false,mistakes=[],shuffled=[];
function shuffle(arr){return[...arr].sort(()=>Math.random()-0.5);}
function start(){shuffled=shuffle(questions);current=0;score=0;answered=false;mistakes=[];document.getElementById('results').classList.remove('show');document.getElementById('quizCard').style.display='block';renderQuestion();}
function renderQuestion(){
  const q=shuffled[current],total=shuffled.length;
  document.getElementById('progressBar').style.width=(current/total*100)+'%';
  document.getElementById('progressLabel').textContent=`Questão ${current+1} de ${total}`;
  const badge=document.getElementById('badge');
  badge.textContent=labelMap[q.cat]||q.cat;badge.className='category-badge '+(classMap[q.cat]||'badge-prática');
  document.getElementById('question').textContent=q.q;
  const opts=document.getElementById('options');opts.innerHTML='';
  q.options.forEach((opt,i)=>{
    const btn=document.createElement('button');btn.className='option-btn';btn.textContent=opt;
    btn.onclick=()=>selectAnswer(i,q);opts.appendChild(btn);
  });
  document.getElementById('feedback').className='feedback';
  document.getElementById('feedback').textContent='';
  document.getElementById('nextBtn').classList.remove('show');
  answered=false;
}
function selectAnswer(i,q){
  if(answered)return;answered=true;
  const btns=document.querySelectorAll('.option-btn');
  btns.forEach(b=>b.disabled=true);
  const fb=document.getElementById('feedback');
  if(i===q.answer){btns[i].classList.add('correct');score++;fb.className='feedback ok show';fb.textContent='✓ '+q.explanation;}
  else{btns[i].classList.add('wrong');btns[q.answer].classList.add('correct');fb.className='feedback err show';fb.textContent='✗ '+q.explanation;mistakes.push({q:q.q,correct:q.options[q.answer]});}
  document.getElementById('nextBtn').classList.add('show');
}
function nextQuestion(){
  current++;
  if(current>=shuffled.length){showResults();}else{renderQuestion();}
}
function showResults(){
  document.getElementById('quizCard').style.display='none';
  const res=document.getElementById('results');res.classList.add('show');
  const pct=Math.round(score/shuffled.length*100);
  document.getElementById('scoreNum').textContent=score;
  document.getElementById('scoreDenom').textContent='/'+shuffled.length;
  document.getElementById('resultsTitle').textContent=pct>=80?'Excelente!':pct>=60?'Muito bem!':'Continue a praticar!';
  document.getElementById('resultsMsg').textContent=`${pct}% — ${score} de ${shuffled.length} corretas`;
  const ml=document.getElementById('mistakesList');ml.innerHTML='';
  if(mistakes.length){
    const h=document.createElement('h3');h.textContent='Para rever:';ml.appendChild(h);
    mistakes.forEach(m=>{const d=document.createElement('div');d.className='mistake-item';d.innerHTML=`<strong>${m.q}</strong><br>→ <span class="correct-ans">${m.correct}</span>`;ml.appendChild(d);});
  }
}
function restart(){start();}
start();
</script>
</body>
</html>
