<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz -- Verbos de Comunicação e PÔR</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', Arial, sans-serif; background: #f0f4f8; color: #2d3748; min-height: 100vh; padding: 20px; }
  .container { max-width: 680px; margin: 0 auto; }
  header { text-align: center; padding: 30px 0 20px; }
  header h1 { font-size: 1.8rem; color: #c05621; margin-bottom: 6px; }
  header p { color: #718096; font-size: 0.95rem; }
  .back-link { display: inline-block; margin-bottom: 16px; color: #718096; font-size: 0.88rem; text-decoration: none; }
  .back-link:hover { color: #c05621; }
  .filter-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
  .filter-btn { padding: 7px 16px; border-radius: 20px; border: 2px solid #e2e8f0; background: white; font-size: 0.85rem; font-weight: 600; cursor: pointer; color: #718096; transition: all 0.15s; }
  .filter-btn.active { background: #c05621; border-color: #c05621; color: white; }
  .filter-btn:hover:not(.active) { border-color: #fbd38d; color: #c05621; }
  .progress-bar-wrap { background: #e2e8f0; border-radius: 8px; height: 8px; margin: 20px 0; }
  .progress-bar { height: 8px; border-radius: 8px; background: linear-gradient(90deg, #dd6b20, #fbd38d); transition: width 0.4s ease; }
  .progress-label { text-align: right; font-size: 0.82rem; color: #718096; margin-top: 4px; }
  .card { background: white; border-radius: 16px; padding: 30px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); margin-bottom: 20px; }
  .category-badge { display: inline-block; font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; padding: 3px 10px; border-radius: 20px; margin-bottom: 14px; }
  .badge-falar { background: #fffaf0; color: #c05621; }
  .badge-pedir { background: #fff5f5; color: #c53030; }
  .badge-por   { background: #faf5ff; color: #553c9a; }
  .question { font-size: 1.1rem; font-weight: 600; line-height: 1.6; margin-bottom: 20px; }
  .options { display: flex; flex-direction: column; gap: 10px; }
  .option-btn { background: #f7fafc; border: 2px solid #e2e8f0; border-radius: 10px; padding: 13px 18px; font-size: 1rem; text-align: left; cursor: pointer; transition: all 0.15s; color: #2d3748; }
  .option-btn:hover:not(:disabled) { background: #fffaf0; border-color: #fbd38d; }
  .option-btn.correct { background: #f0fff4; border-color: #68d391; color: #276749; font-weight: 600; }
  .option-btn.wrong { background: #fff5f5; border-color: #fc8181; color: #c53030; }
  .option-btn:disabled { cursor: default; }
  .feedback { margin-top: 16px; padding: 12px 16px; border-radius: 10px; font-size: 0.9rem; line-height: 1.5; display: none; }
  .feedback.show { display: block; }
  .feedback.ok  { background: #f0fff4; color: #276749; border-left: 4px solid #68d391; }
  .feedback.err { background: #fff5f5; color: #c53030; border-left: 4px solid #fc8181; }
  .next-btn { display: none; margin-top: 18px; width: 100%; padding: 14px; background: #dd6b20; color: white; border: none; border-radius: 10px; font-size: 1rem; font-weight: 600; cursor: pointer; }
  .next-btn:hover { background: #c05621; }
  .next-btn.show { display: block; }
  .results { display: none; text-align: center; padding: 40px 30px; }
  .results.show { display: block; }
  .score-circle { width: 120px; height: 120px; border-radius: 50%; background: linear-gradient(135deg, #dd6b20, #fbd38d); display: flex; flex-direction: column; align-items: center; justify-content: center; margin: 0 auto 20px; color: white; }
  .score-circle .num { font-size: 2.2rem; font-weight: 700; line-height: 1; }
  .score-circle .denom { font-size: 0.85rem; opacity: 0.85; }
  .results h2 { font-size: 1.5rem; margin-bottom: 8px; }
  .results p { color: #718096; margin-bottom: 24px; }
  .btn-row { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  .restart-btn { padding: 13px 32px; background: #dd6b20; color: white; border: none; border-radius: 10px; font-size: 1rem; font-weight: 600; cursor: pointer; }
  .home-btn { padding: 13px 32px; background: #edf2f7; color: #4a5568; border: none; border-radius: 10px; font-size: 1rem; font-weight: 600; cursor: pointer; text-decoration: none; display: inline-block; }
  .home-btn:hover { background: #e2e8f0; }
  .mistakes-list { text-align: left; margin-top: 28px; }
  .mistakes-list h3 { font-size: 1rem; color: #c53030; margin-bottom: 12px; }
  .mistake-item { background: #fff5f5; border-radius: 8px; padding: 10px 14px; margin-bottom: 8px; font-size: 0.88rem; line-height: 1.5; }
  .mistake-item strong { color: #c53030; }
  .mistake-item .correct-ans { color: #276749; font-weight: 600; }
</style>
</head>
<body>
<div class="container">
  <a class="back-link" href="index.html">← Voltar ao menu</a>
  <header>
    <h1>Verbos de Comunicação · PÔR</h1>
    <p>falar · dizer · contar · perguntar · pedir · pôr</p>
  </header>
  <div class="filter-row">
    <button class="filter-btn active" onclick="setFilter('todos',this)">Todos (20)</button>
    <button class="filter-btn" onclick="setFilter('falar',this)">Falar / Dizer / Contar</button>
    <button class="filter-btn" onclick="setFilter('pedir',this)">Perguntar / Pedir</button>
    <button class="filter-btn" onclick="setFilter('por',this)">PÔR</button>
  </div>
  <div class="progress-bar-wrap"><div class="progress-bar" id="progressBar" style="width:0%"></div></div>
  <div class="progress-label" id="progressLabel"></div>
  <div class="card" id="quizCard">
    <div class="category-badge" id="badge"></div>
    <div class="question" id="question"></div>
    <div class="options" id="options"></div>
    <div class="feedback" id="feedback"></div>
    <button class="next-btn" id="nextBtn" onclick="nextQuestion()">Próxima questão →</button>
  </div>
  <div class="card results" id="results">
    <div class="score-circle"><span class="num" id="scoreNum"></span><span class="denom" id="scoreDenom"></span></div>
    <h2 id="resultsTitle"></h2><p id="resultsMsg"></p>
    <div class="btn-row">
      <button class="restart-btn" onclick="restart()">Repetir quiz</button>
      <a class="home-btn" href="index.html">Menu principal</a>
    </div>
    <div class="mistakes-list" id="mistakesList"></div>
  </div>
</div>
<script>
const allQuestions = [
  // Falar / Dizer / Contar / Conversar / Explicar
  { cat:"falar", q:"Eu ___ com o meu chefe todos os dias. (разговариваю -- регулярно)", options:["digo","conto","falo","explico"], answer:2, explanation:"FALAR COM = разговаривать с кем-то. FALAR DE/SOBRE = говорить о чём-то. Это общий глагол для 'говорить / разговаривать'." },
  { cat:"falar", q:"Ela ___ que está cansada. (говорит, что... -- конкретные слова)", options:["fala","conta","diz","conversa"], answer:2, explanation:"DIZER QUE = сказать, что... (передача конкретного высказывания). Ela diz que está cansada = Она говорит, что устала. DIZER используется для конкретных слов и фраз." },
  { cat:"falar", q:"Podes ___ a história do que aconteceu? (рассказать историю)", options:["dizer","falar","contar","explicar"], answer:2, explanation:"CONTAR = рассказать (историю, событие). CONTAR UMA HISTÓRIA = рассказать историю. CONTAR ALGO A ALGUÉM = рассказать что-то кому-то. Отличие от FALAR: CONTAR подразумевает нарратив." },
  { cat:"falar", q:"O professor ___ as regras da gramática. (объяснил)", options:["contou","disse","falou","explicou"], answer:3, explanation:"EXPLICAR = объяснить (правила, концепцию, процесс). DIZER = сказать (что-то). FALAR = говорить (о чём-то). EXPLICAR передаёт смысл 'разъяснить, растолковать'." },
  { cat:"falar", q:"Eles ___ sobre o fim de semana no café. (болтали -- взаимный диалог)", options:["disseram","contaram","conversaram","falaram de"], answer:2, explanation:"CONVERSAR = беседовать, общаться (двусторонний диалог). FALAR DE = говорить о (более общее). CONVERSAR подчёркивает взаимность: оба участвуют в разговоре." },
  { cat:"falar", q:"___ a verdade! (скажи правду -- imperativo)", options:["Fala","Diz","Conta","Explica"], answer:1, explanation:"DIZER A VERDADE = сказать правду. DIZER = используется для конкретного содержания: dizer adeus, dizer olá, dizer a verdade, dizer uma mentira." },
  { cat:"falar", q:"Ele ___ três línguas: inglês, francês e espanhol. (говорит -- владеет)", options:["diz","conta","fala","conversa"], answer:2, explanation:"FALAR + língua = говорить на (языке). Falo inglês = Я говорю по-английски. Только FALAR, никогда DIZER или CONTAR com línguas." },
  { cat:"falar", q:"Ela ___ tudo à mãe: o que aconteceu, onde esteve. (рассказала всё)", options:["disse","falou","contou","explicou"], answer:2, explanation:"CONTAR = рассказать (передать подробный рассказ). CONTAR TUDO = рассказать всё. DIZER seria para palavras específicas, CONTAR para eventos e histórias." },
  { cat:"falar", q:"Qual frase está correta? (dizer adeus)", options:["Falo adeus quando saio.","Digo adeus quando saio.","Conto adeus quando saio.","Converso adeus quando saio."], answer:1, explanation:"DIZER ADEUS = прощаться / говорить до свидания. Expressões fixas com DIZER: dizer adeus, dizer olá, dizer obrigado, dizer que sim/não." },
  // Perguntar / Pedir
  { cat:"pedir", q:"Eu ___ se há lugar disponível. (спросил -- задал вопрос)", options:["disse","perguntei","contei","pedi"], answer:1, explanation:"PERGUNTAR = спросить (задать вопрос). PERGUNTAR SE = спросить, есть ли... PERGUNTAR é sempre para questões e dúvidas. Perguntei se há lugar = Я спросил, есть ли место." },
  { cat:"pedir", q:"Ela ___ à professora para repetir. (попросила что-то сделать)", options:["perguntou","disse","pediu","falou"], answer:2, explanation:"PEDIR PARA + infinitivo = попросить (кого-то) сделать что-то. PEDIR = попросить. PERGUNTAR = спросить. Pediu para repetir = Попросила повторить." },
  { cat:"pedir", q:"Podes ___ ao empregado a conta? (попросить принести счёт)", options:["perguntar","dizer","pedir","falar"], answer:2, explanation:"PEDIR A CONTA = попросить счёт. PEDIR что-то (предмет/услугу) = попросить. PERGUNTAR было бы для вопроса (Perguntar qual é o preço = Спросить, какая цена)." },
  { cat:"pedir", q:"O jornalista ___ ao ministro sobre as novas leis. (расспросил)", options:["pediu","disse","perguntou","contou"], answer:2, explanation:"PERGUNTAR SOBRE/ACERCA DE = расспрашивать о чём-то. Perguntou sobre as novas leis = Расспросил о новых законах. PERGUNTAR всегда для вопросов." },
  // POR
  { cat:"por", q:"Podes ___ a mesa para o jantar? (накрыть стол)", options:["fazer","meter","pôr","colocar"], answer:2, explanation:"PÔR A MESA = накрыть (на стол). Выражение-идиома. Также: METER A MESA (разговорный). PÔR = класть / ставить + многие идиоматические выражения." },
  { cat:"por", q:"Ela pôs os óculos e começou a ler. O que fez ela?", options:["Esqueceu os óculos","Partiu os óculos","Colocou os óculos","Tirou os óculos"], answer:2, explanation:"PÔR os óculos = надеть очки = COLOCAR os óculos. PÔS = PPS de PÔR (eu pus / tu puseste / ele pôs / nós pusemos / eles puseram)." },
  { cat:"por", q:"\"Vamos ___ em prática o que aprendemos.\" (применить на практике)", options:["fazer","pôr","dizer","colocar"], answer:1, explanation:"PÔR EM PRÁTICA = применить на практике / воплотить. Expressão fixa: pôr em prática uma ideia = реализовать идею. Pôr em prática = COLOCAR EM PRÁTICA." },
  { cat:"por", q:"Onde ___ as chaves quando chegas a casa? (кладёшь -- habitual)", options:["pões","colocas","metes","ponhas"], answer:0, explanation:"PÔR no Presente: eu ponho / tu PÕES / ele/ela põe / nós pomos / vocês põem. ONDE PÕES = куда ты кладёшь (habitual presente)." },
  { cat:"por", q:"Como se conjuga PÔR no Imperfeito: (ele) ___?", options:["poa","punha","ponha","pôia"], answer:1, explanation:"Imperfeito de PÔR: eu punha / tu punhas / ele PUNHA / nós púnhamos / vocês punham. Основа irregular PUN-. Conj. perfeita (PPS): pus, puseste, pôs, pusemos, puseram." },
  { cat:"por", q:"\"Ela pôs-se a chorar.\" O que significa?", options:["Ela parou de chorar","Ela começou a chorar","Ela fingiu chorar","Ela tentou chorar"], answer:1, explanation:"PÔR-SE A + infinitivo = начать (что-то делать). Pôs-se a chorar = Она начала плакать. Sinónimo: COMEÇAR A. Pôs-se a correr = Побежал / Начал бежать." },
  { cat:"por", q:"\"Põe isso de parte.\" O que significa?", options:["Descarta essa ideia","Guarda/reserva isso para depois","Coloca isso no lado esquerdo","Parte isso ao meio"], answer:1, explanation:"PÔR DE PARTE = reservar, guardar para depois / отложить. Põe isso de parte = Отложи это (на потом). Também: deixar de parte = ignorar / оставить в стороне." }
];

const badges = { falar:"Falar / Dizer / Contar", pedir:"Perguntar / Pedir", por:"PÔR" };
const badgeClass = { falar:"badge-falar", pedir:"badge-pedir", por:"badge-por" };
let filtered = [...allQuestions], current = 0, score = 0, mistakes = [];

function setFilter(cat, btn) {
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  filtered = cat === 'todos' ? [...allQuestions] : allQuestions.filter(q => q.cat === cat);
  current = 0; score = 0; mistakes = [];
  document.getElementById('quizCard').style.display = '';
  document.getElementById('results').className = 'card results';
  document.getElementById('mistakesList').innerHTML = '';
  loadQuestion();
}

function loadQuestion() {
  const q = filtered[current];
  document.getElementById('progressBar').style.width = (current / filtered.length * 100) + '%';
  document.getElementById('progressLabel').textContent = `Questão ${current + 1} de ${filtered.length}`;
  const badge = document.getElementById('badge');
  badge.textContent = badges[q.cat];
  badge.className = 'category-badge ' + badgeClass[q.cat];
  document.getElementById('question').textContent = q.q;
  const opts = document.getElementById('options');
  opts.innerHTML = '';
  q.options.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.textContent = opt;
    btn.onclick = () => selectAnswer(i);
    opts.appendChild(btn);
  });
  document.getElementById('feedback').className = 'feedback';
  document.getElementById('nextBtn').className = 'next-btn';
}

function selectAnswer(i) {
  const q = filtered[current];
  const btns = document.querySelectorAll('.option-btn');
  btns.forEach(b => b.disabled = true);
  const fb = document.getElementById('feedback');
  if (i === q.answer) {
    score++;
    btns[i].classList.add('correct');
    fb.className = 'feedback ok show';
    fb.textContent = 'Correto! ' + q.explanation;
  } else {
    btns[i].classList.add('wrong');
    btns[q.answer].classList.add('correct');
    fb.className = 'feedback err show';
    fb.textContent = 'Incorreto. ' + q.explanation;
    mistakes.push({ q: q.q, yours: q.options[i], correct: q.options[q.answer] });
  }
  document.getElementById('nextBtn').className = 'next-btn show';
}

function nextQuestion() {
  current++;
  if (current < filtered.length) { loadQuestion(); }
  else { showResults(); }
}

function showResults() {
  document.getElementById('quizCard').style.display = 'none';
  const r = document.getElementById('results');
  r.className = 'card results show';
  document.getElementById('scoreNum').textContent = score;
  document.getElementById('scoreDenom').textContent = '/ ' + filtered.length;
  const pct = Math.round(score / filtered.length * 100);
  document.getElementById('resultsTitle').textContent = pct >= 80 ? 'Muito bem!' : pct >= 60 ? 'Bom trabalho!' : 'Continua a praticar!';
  document.getElementById('resultsMsg').textContent = `Acertaste ${score} de ${filtered.length} questões (${pct}%).`;
  const ml = document.getElementById('mistakesList');
  if (mistakes.length) {
    ml.innerHTML = '<h3>Erros para rever:</h3>' + mistakes.map(m =>
      `<div class="mistake-item"><strong>${m.q}</strong><br>A tua resposta: ${m.yours}<br><span class="correct-ans">Correto: ${m.correct}</span></div>`
    ).join('');
  }
}

function restart() {
  current = 0; score = 0; mistakes = [];
  document.getElementById('quizCard').style.display = '';
  document.getElementById('results').className = 'card results';
  document.getElementById('mistakesList').innerHTML = '';
  loadQuestion();
}

loadQuestion();
</script>
</body>
</html>
