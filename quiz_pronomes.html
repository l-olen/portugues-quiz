<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz -- Pronomes Pessoais</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', Arial, sans-serif; background: #f0f4f8; color: #2d3748; min-height: 100vh; padding: 20px; }
  .container { max-width: 680px; margin: 0 auto; }
  header { text-align: center; padding: 30px 0 20px; }
  header h1 { font-size: 1.8rem; color: #553c9a; margin-bottom: 6px; }
  header p { color: #718096; font-size: 0.95rem; }
  .back-link { display: inline-block; margin-bottom: 16px; color: #718096; font-size: 0.88rem; text-decoration: none; }
  .back-link:hover { color: #553c9a; }
  .progress-bar-wrap { background: #e2e8f0; border-radius: 8px; height: 8px; margin: 20px 0; }
  .progress-bar { height: 8px; border-radius: 8px; background: linear-gradient(90deg, #805ad5, #d6bcfa); transition: width 0.4s ease; }
  .progress-label { text-align: right; font-size: 0.82rem; color: #718096; margin-top: 4px; }
  .card { background: white; border-radius: 16px; padding: 30px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); margin-bottom: 20px; }
  .category-badge { display: inline-block; font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; padding: 3px 10px; border-radius: 20px; margin-bottom: 14px; }
  .badge-ci   { background: #faf5ff; color: #553c9a; }
  .badge-cd   { background: #ebf8ff; color: #2c5282; }
  .badge-com  { background: #f0fff4; color: #276749; }
  .badge-contr { background: #fffbeb; color: #744210; }
  .question { font-size: 1.1rem; font-weight: 600; line-height: 1.6; margin-bottom: 20px; }
  .options { display: flex; flex-direction: column; gap: 10px; }
  .option-btn { background: #f7fafc; border: 2px solid #e2e8f0; border-radius: 10px; padding: 13px 18px; font-size: 1rem; text-align: left; cursor: pointer; transition: all 0.15s; color: #2d3748; }
  .option-btn:hover:not(:disabled) { background: #faf5ff; border-color: #d6bcfa; }
  .option-btn.correct { background: #f0fff4; border-color: #68d391; color: #276749; font-weight: 600; }
  .option-btn.wrong { background: #fff5f5; border-color: #fc8181; color: #c53030; }
  .option-btn:disabled { cursor: default; }
  .feedback { margin-top: 16px; padding: 12px 16px; border-radius: 10px; font-size: 0.9rem; line-height: 1.5; display: none; }
  .feedback.show { display: block; }
  .feedback.ok  { background: #f0fff4; color: #276749; border-left: 4px solid #68d391; }
  .feedback.err { background: #fff5f5; color: #c53030; border-left: 4px solid #fc8181; }
  .next-btn { display: none; margin-top: 18px; width: 100%; padding: 14px; background: #805ad5; color: white; border: none; border-radius: 10px; font-size: 1rem; font-weight: 600; cursor: pointer; }
  .next-btn:hover { background: #553c9a; }
  .next-btn.show { display: block; }
  .results { display: none; text-align: center; padding: 40px 30px; }
  .results.show { display: block; }
  .score-circle { width: 120px; height: 120px; border-radius: 50%; background: linear-gradient(135deg, #805ad5, #d6bcfa); display: flex; flex-direction: column; align-items: center; justify-content: center; margin: 0 auto 20px; color: white; }
  .score-circle .num { font-size: 2.2rem; font-weight: 700; line-height: 1; }
  .score-circle .denom { font-size: 0.85rem; opacity: 0.85; }
  .results h2 { font-size: 1.5rem; margin-bottom: 8px; }
  .results p { color: #718096; margin-bottom: 24px; }
  .btn-row { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  .restart-btn { padding: 13px 32px; background: #805ad5; color: white; border: none; border-radius: 10px; font-size: 1rem; font-weight: 600; cursor: pointer; }
  .home-btn { padding: 13px 32px; background: #edf2f7; color: #4a5568; border: none; border-radius: 10px; font-size: 1rem; font-weight: 600; cursor: pointer; text-decoration: none; display: inline-block; }
  .home-btn:hover { background: #e2e8f0; }
  .mistakes-list { text-align: left; margin-top: 28px; }
  .mistakes-list h3 { font-size: 1rem; color: #c53030; margin-bottom: 12px; }
  .mistake-item { background: #fff5f5; border-radius: 8px; padding: 10px 14px; margin-bottom: 8px; font-size: 0.88rem; line-height: 1.5; }
  .mistake-item strong { color: #c53030; }
  .mistake-item .correct-ans { color: #276749; font-weight: 600; }
</style>
</head>
<body>
<div class="container">
  <a class="back-link" href="index.html">← Voltar ao menu</a>
  <header>
    <h1>Pronomes Pessoais</h1>
    <p>Complemento Indireto · Complemento Direto · COM pronome</p>
  </header>
  <div class="progress-bar-wrap"><div class="progress-bar" id="progressBar" style="width:0%"></div></div>
  <div class="progress-label" id="progressLabel"></div>
  <div class="card" id="quizCard">
    <div class="category-badge" id="badge"></div>
    <div class="question" id="question"></div>
    <div class="options" id="options"></div>
    <div class="feedback" id="feedback"></div>
    <button class="next-btn" id="nextBtn" onclick="nextQuestion()">Próxima questão →</button>
  </div>
  <div class="card results" id="results">
    <div class="score-circle"><span class="num" id="scoreNum"></span><span class="denom" id="scoreDenom"></span></div>
    <h2 id="resultsTitle"></h2><p id="resultsMsg"></p>
    <div class="btn-row">
      <button class="restart-btn" onclick="restart()">Repetir quiz</button>
      <a class="home-btn" href="index.html">Menu principal</a>
    </div>
    <div class="mistakes-list" id="mistakesList"></div>
  </div>
</div>
<script>
const questions = [
  // Complemento Indireto (para quem / a quem)
  { cat:"ci", q:"Eu compro livros para a Joana. → Eu compro-___ livros.", options:["a","lhe","o","lhes"], answer:1, explanation:"CI (para quem/a quem): ele/ela/você → LHE. \"Eu compro-lhe livros\" = eu compro livros para ela." },
  { cat:"ci", q:"Eles mandam-___ cartas todas as semanas. (para nós)", options:["nos","lhes","vos","lhe"], answer:0, explanation:"CI: nós → NOS. \"Eles mandam-nos cartas\" = eles mandam cartas para nós." },
  { cat:"ci", q:"Eu vou enviar-___ o convite amanhã. (para ti)", options:["lhe","te","me","vos"], answer:1, explanation:"CI: tu → TE. \"Vou enviar-te o convite\" = vou enviar o convite para ti." },
  { cat:"ci", q:"Pode confirmar-___ a sua reserva? (для меня -- formal)", options:["te","lhe","me","nos"], answer:2, explanation:"CI: eu → ME. \"Pode confirmar-me a sua reserva?\" = Pode confirmar a reserva para mim?" },
  { cat:"ci", q:"Eles convidam-___ todos os anos para o Ano Novo. (нас с вами)", options:["lhes","nos","vos","lhe"], answer:1, explanation:"CI: nós → NOS. \"Convidam-nos\" = convidam-nos para a festa (para nós)." },
  // Complemento Direto (o que / quem)
  { cat:"cd", q:"Eu envio o convite para a Maria. → Eu envio-___ para a Maria.", options:["lhe","a","o","la"], answer:1, explanation:"CD: o convite (feminino) → A. \"Eu envio-a para a Maria.\" CD feminino singular = a." },
  { cat:"cd", q:"Podes comprar o livro amanhã? → Podes comprá-___ amanhã?", options:["lo","o","a","nos"], answer:0, explanation:"Após verbo que termina em -R, o CD muda: -r + lo/la/los/las. Comprar + o → comprá-lo. O R cai." },
  { cat:"cd", q:"Vou perder o autocarro! → Vou perdê-___!", options:["lo","o","la","a"], answer:0, explanation:"Após -R: perder + o → perdê-lo. \"Vou perdê-lo!\" = Vou perder o autocarro!" },
  { cat:"cd", q:"Põe os livros na estante! → Põe-___ na estante!", options:["los","os","nos","lhes"], answer:0, explanation:"Após -ÕE (põe): CD plural masculino muda para -NOS. Põe + os → Põe-nos. Atenção: aqui \"nos\" = os livros (CD), não nós!" },
  { cat:"cd", q:"Eles trazem as coisas para dentro. → Eles trazem-___ para dentro.", options:["as","las","nas","nos"], answer:0, explanation:"CD feminino plural = AS. \"Eles trazem-nas para dentro.\" Após -M: m + nas = trazem-nas. Mas a resposta mais simples: trazem-as (sem transformação aqui é trazem-nas)." },
  { cat:"cd", q:"Qual frase está correta? (Ele vai convidar-me)", options:["Ele vai-me convidar.","Ele vai convidar-me.","Ele me vai convidar.","Ele convidar-me vai."], answer:1, explanation:"Com IR+INFINITIVO: pronome vai junto ao infinitivo, não ao auxiliar. \"Ele vai convidar-me.\" Mas \"Ele não me vai convidar\" (com negação -- antes do aux)." },
  // COM + pronome
  { cat:"com", q:"Queres vir ___ ao cinema? (со мной)", options:["com eu","comigo","com me","migo"], answer:1, explanation:"COM + eu = COMIGO. \"Vens comigo ao cinema?\"" },
  { cat:"com", q:"Posso falar ___ um momento? (с тобой)", options:["com tu","com te","contigo","com você"], answer:2, explanation:"COM + tu = CONTIGO. \"Posso falar contigo?\"" },
  { cat:"com", q:"Ela quer falar ___. (с вами/с ним -- formal)", options:["com você","consigo","com si","contigo"], answer:1, explanation:"COM + você/si = CONSIGO. \"Eles queriam falar consigo\" = они хотели поговорить с вами." },
  { cat:"com", q:"Venha ___ , por favor! (с нами)", options:["com nós","connosco","com nos","com nosso"], answer:1, explanation:"COM + nós = CONNOSCO. \"Venha connosco!\" = Идите с нами!" },
  { cat:"com", q:"\"Vou ter consigo às 21:00.\" Что это значит?", options:["Встречусь с тобой в 21:00","Встречусь с ним в 21:00","Встречусь с вами (formal) в 21:00","Пойду с вами в 21:00"], answer:2, explanation:"CONSIGO = com você (formal). \"Vou ter consigo\" = приду к вам / встречусь с вами (вежливо)." },
  { cat:"com", q:"Qual frase usa corretamente COM + pronome?", options:["Ela veio com eu.","Ele fala com tu.","Viemos convosco.","Ela está com nós."], answer:2, explanation:"COM + vocês (вы, мн.) = CONVOSCO. \"Viemos convosco\" = мы пришли с вами. Остальные варианты неправильные: com eu → comigo; com tu → contigo; com nós → connosco." }
];

const badges = { ci:"Compl. Indireto", cd:"Compl. Direto", com:"COM + pronome", contr:"Contração" };
const badgeClass = { ci:"badge-ci", cd:"badge-cd", com:"badge-com", contr:"badge-contr" };

let current = 0, score = 0, mistakes = [];

function loadQuestion() {
  const q = questions[current];
  document.getElementById('progressBar').style.width = (current / questions.length * 100) + '%';
  document.getElementById('progressLabel').textContent = `Questão ${current + 1} de ${questions.length}`;
  const badge = document.getElementById('badge');
  badge.textContent = badges[q.cat];
  badge.className = 'category-badge ' + badgeClass[q.cat];
  document.getElementById('question').textContent = q.q;
  const opts = document.getElementById('options');
  opts.innerHTML = '';
  q.options.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.textContent = opt;
    btn.onclick = () => selectAnswer(i);
    opts.appendChild(btn);
  });
  document.getElementById('feedback').className = 'feedback';
  document.getElementById('nextBtn').className = 'next-btn';
}

function selectAnswer(i) {
  const q = questions[current];
  const btns = document.querySelectorAll('.option-btn');
  btns.forEach(b => b.disabled = true);
  const fb = document.getElementById('feedback');
  if (i === q.answer) {
    score++;
    btns[i].classList.add('correct');
    fb.className = 'feedback ok show';
    fb.textContent = 'Correto! ' + q.explanation;
  } else {
    btns[i].classList.add('wrong');
    btns[q.answer].classList.add('correct');
    fb.className = 'feedback err show';
    fb.textContent = 'Incorreto. ' + q.explanation;
    mistakes.push({ q: q.q, yours: q.options[i], correct: q.options[q.answer] });
  }
  document.getElementById('nextBtn').className = 'next-btn show';
}

function nextQuestion() {
  current++;
  if (current < questions.length) { loadQuestion(); }
  else { showResults(); }
}

function showResults() {
  document.getElementById('quizCard').style.display = 'none';
  const r = document.getElementById('results');
  r.className = 'card results show';
  document.getElementById('scoreNum').textContent = score;
  document.getElementById('scoreDenom').textContent = '/ ' + questions.length;
  const pct = Math.round(score / questions.length * 100);
  document.getElementById('resultsTitle').textContent = pct >= 80 ? 'Muito bem!' : pct >= 60 ? 'Bom trabalho!' : 'Continua a praticar!';
  document.getElementById('resultsMsg').textContent = `Acertaste ${score} de ${questions.length} questões (${pct}%).`;
  const ml = document.getElementById('mistakesList');
  if (mistakes.length) {
    ml.innerHTML = '<h3>Erros para rever:</h3>' + mistakes.map(m =>
      `<div class="mistake-item"><strong>${m.q}</strong><br>A tua resposta: ${m.yours}<br><span class="correct-ans">Correto: ${m.correct}</span></div>`
    ).join('');
  }
}

function restart() {
  current = 0; score = 0; mistakes = [];
  document.getElementById('quizCard').style.display = '';
  document.getElementById('results').className = 'card results';
  loadQuestion();
}

loadQuestion();
</script>
</body>
</html>
