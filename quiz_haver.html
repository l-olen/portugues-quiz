<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz -- HAVER</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', Arial, sans-serif; background: #f0f4f8; color: #2d3748; min-height: 100vh; padding: 20px; }
  .container { max-width: 680px; margin: 0 auto; }
  header { text-align: center; padding: 30px 0 20px; }
  header h1 { font-size: 1.8rem; color: #2c7a7b; margin-bottom: 6px; }
  header p { color: #718096; font-size: 0.95rem; }
  .back-link { display: inline-block; margin-bottom: 16px; color: #718096; font-size: 0.88rem; text-decoration: none; }
  .back-link:hover { color: #2c7a7b; }
  .filter-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
  .filter-btn { padding: 7px 16px; border-radius: 20px; border: 2px solid #e2e8f0; background: white; font-size: 0.85rem; font-weight: 600; cursor: pointer; color: #718096; transition: all 0.15s; }
  .filter-btn.active { background: #2c7a7b; border-color: #2c7a7b; color: white; }
  .filter-btn:hover:not(.active) { border-color: #81e6d9; color: #2c7a7b; }
  .progress-bar-wrap { background: #e2e8f0; border-radius: 8px; height: 8px; margin: 20px 0; }
  .progress-bar { height: 8px; border-radius: 8px; background: linear-gradient(90deg, #319795, #81e6d9); transition: width 0.4s ease; }
  .progress-label { text-align: right; font-size: 0.82rem; color: #718096; margin-top: 4px; }
  .card { background: white; border-radius: 16px; padding: 30px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); margin-bottom: 20px; }
  .category-badge { display: inline-block; font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; padding: 3px 10px; border-radius: 20px; margin-bottom: 14px; }
  .badge-formas { background: #e6fffa; color: #2c7a7b; }
  .badge-uso    { background: #ebf8ff; color: #2c5282; }
  .badge-tempo  { background: #faf5ff; color: #553c9a; }
  .question { font-size: 1.1rem; font-weight: 600; line-height: 1.6; margin-bottom: 20px; }
  .options { display: flex; flex-direction: column; gap: 10px; }
  .option-btn { background: #f7fafc; border: 2px solid #e2e8f0; border-radius: 10px; padding: 13px 18px; font-size: 1rem; text-align: left; cursor: pointer; transition: all 0.15s; color: #2d3748; }
  .option-btn:hover:not(:disabled) { background: #e6fffa; border-color: #81e6d9; }
  .option-btn.correct { background: #f0fff4; border-color: #68d391; color: #276749; font-weight: 600; }
  .option-btn.wrong { background: #fff5f5; border-color: #fc8181; color: #c53030; }
  .option-btn:disabled { cursor: default; }
  .feedback { margin-top: 16px; padding: 12px 16px; border-radius: 10px; font-size: 0.9rem; line-height: 1.5; display: none; }
  .feedback.show { display: block; }
  .feedback.ok  { background: #f0fff4; color: #276749; border-left: 4px solid #68d391; }
  .feedback.err { background: #fff5f5; color: #c53030; border-left: 4px solid #fc8181; }
  .next-btn { display: none; margin-top: 18px; width: 100%; padding: 14px; background: #319795; color: white; border: none; border-radius: 10px; font-size: 1rem; font-weight: 600; cursor: pointer; }
  .next-btn:hover { background: #2c7a7b; }
  .next-btn.show { display: block; }
  .results { display: none; text-align: center; padding: 40px 30px; }
  .results.show { display: block; }
  .score-circle { width: 120px; height: 120px; border-radius: 50%; background: linear-gradient(135deg, #319795, #81e6d9); display: flex; flex-direction: column; align-items: center; justify-content: center; margin: 0 auto 20px; color: white; }
  .score-circle .num { font-size: 2.2rem; font-weight: 700; line-height: 1; }
  .score-circle .denom { font-size: 0.85rem; opacity: 0.85; }
  .results h2 { font-size: 1.5rem; margin-bottom: 8px; }
  .results p { color: #718096; margin-bottom: 24px; }
  .btn-row { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  .restart-btn { padding: 13px 32px; background: #319795; color: white; border: none; border-radius: 10px; font-size: 1rem; font-weight: 600; cursor: pointer; }
  .home-btn { padding: 13px 32px; background: #edf2f7; color: #4a5568; border: none; border-radius: 10px; font-size: 1rem; font-weight: 600; cursor: pointer; text-decoration: none; display: inline-block; }
  .home-btn:hover { background: #e2e8f0; }
  .mistakes-list { text-align: left; margin-top: 28px; }
  .mistakes-list h3 { font-size: 1rem; color: #c53030; margin-bottom: 12px; }
  .mistake-item { background: #fff5f5; border-radius: 8px; padding: 10px 14px; margin-bottom: 8px; font-size: 0.88rem; line-height: 1.5; }
  .mistake-item strong { color: #c53030; }
  .mistake-item .correct-ans { color: #276749; font-weight: 600; }
</style>
</head>
<body>
<div class="container">
  <a class="back-link" href="index.html">← Voltar ao menu</a>
  <header>
    <h1>HAVER</h1>
    <p>há · houve · havia · haverá · há + tempo</p>
  </header>
  <div class="filter-row">
    <button class="filter-btn active" onclick="setFilter('todos',this)">Todos (15)</button>
    <button class="filter-btn" onclick="setFilter('formas',this)">Formas</button>
    <button class="filter-btn" onclick="setFilter('uso',this)">Uso</button>
    <button class="filter-btn" onclick="setFilter('tempo',this)">Há + tempo</button>
  </div>
  <div class="progress-bar-wrap"><div class="progress-bar" id="progressBar" style="width:0%"></div></div>
  <div class="progress-label" id="progressLabel"></div>
  <div class="card" id="quizCard">
    <div class="category-badge" id="badge"></div>
    <div class="question" id="question"></div>
    <div class="options" id="options"></div>
    <div class="feedback" id="feedback"></div>
    <button class="next-btn" id="nextBtn" onclick="nextQuestion()">Próxima questão →</button>
  </div>
  <div class="card results" id="results">
    <div class="score-circle"><span class="num" id="scoreNum"></span><span class="denom" id="scoreDenom"></span></div>
    <h2 id="resultsTitle"></h2><p id="resultsMsg"></p>
    <div class="btn-row">
      <button class="restart-btn" onclick="restart()">Repetir quiz</button>
      <a class="home-btn" href="index.html">Menu principal</a>
    </div>
    <div class="mistakes-list" id="mistakesList"></div>
  </div>
</div>
<script>
const allQuestions = [
  // Formas
  { cat:"formas", q:"___ muitas pessoas no mercado hoje. (є зараз -- presente)", options:["Houve","Havia","Há","Eram"], answer:2, explanation:"HÁ = есть / существует (Presente de HAVER, 3a pessoa). Используется для существования: Há pessoas = Есть люди. HAVER existencial всегда стоит в 3-м лице ед.ч." },
  { cat:"formas", q:"___ um grande incêndio na floresta no verão passado. (відбулось одноразово)", options:["Há","Havia","Houve","Haverá"], answer:2, explanation:"HOUVE = произошло (PPS de HAVER). Одноразовое событие в прошлом: Houve um acidente = Произошла авария. HAVER existencial -- impessoal, sem sujeito." },
  { cat:"formas", q:"Quando era pequena, ___ uma padaria na esquina. (была -- фон прошлого)", options:["há","houve","havia","terá"], answer:2, explanation:"HAVIA = было (Imperfeito de HAVER). Описание постоянного состояния или фона в прошлом. Havia silêncio = Была тишина. Havia muitas flores = Было много цветов." },
  { cat:"formas", q:"No futuro ___ mais tecnologia nas escolas.", options:["há","houve","havia","haverá"], answer:3, explanation:"HAVERÁ = будет (Futuro Simples de HAVER). Existência no futuro: Haverá mais pessoas = Будет больше людей." },
  { cat:"formas", q:"Há algo de errado: \"Haviam muitas pessoas na festa\"?", options:["Não, está correto","Sim -- HAVER existencial não varia: Havia muitas pessoas","Sim -- deve ser Têm muitas pessoas","Não, haviam é correto no plural"], answer:1, explanation:"HAVER existencial é sempre singular: HÁ, HAVIA, HOUVE -- nunca HAVAM, HAVIAM. Erro muito comum: dizer Haviam pessoas (errado). Correto: HAVIA pessoas. Só o HAVER auxiliar concorda com o sujeito." },
  { cat:"formas", q:"\"Não ___ nada a fazer aqui.\" -- presente", options:["houve","haveria","há","havia"], answer:2, explanation:"HÁ = есть / existe (presente). Não há nada a fazer = Нечего делать. Expressão muito comum no quotidiano." },
  // Uso
  { cat:"uso", q:"Qual a diferença entre \"Há um problema\" e \"Houve um problema\"?", options:["Não há diferença","Há = existe agora; Houve = aconteceu no passado","Há = futuro; Houve = presente","Há = muitos; Houve = um"], answer:1, explanation:"HÁ = существует сейчас (presente). HOUVE = произошло / было (PPS). Há um problema = Есть проблема (сейчас). Houve um problema = Была проблема / Произошла проблема." },
  { cat:"uso", q:"\"Havia filas no supermercado quando chegámos.\" O que indica?", options:["As filas aparecem no futuro","As filas eram o estado/fundo quando chegaram","As filas ocorreram uma vez nesse momento","As filas são habituais hoje"], answer:1, explanation:"HAVIA = imperfeito = estado/contexto de fundo. Quando chegaram, as filas já existiam (состояние в прошлом). Контраст: HOUVE filas = filas que apareceram como evento." },
  { cat:"uso", q:"\"Houve\" ou \"Havia\" tempestade ontem à noite -- qual a diferença?", options:["Só Houve é correto","Só Havia é correto","Ambos corretos mas sentido diferente","Nenhum é correto"], answer:2, explanation:"HOUVE tempestade = буря случилась (событие). HAVIA tempestade = буря была / продолжалась (состояние/фон). Quando acordei, havia tempestade (состояние) vs Houve uma tempestade às 23:00 (конкретное событие)." },
  { cat:"uso", q:"\"___ muita gente na praia.\" O que é mais formal: Há ou Tem?", options:["Tem é mais formal","Há é mais formal","São igualmente formais","Ambos estão errados"], answer:1, explanation:"HÁ é mais formal e gramaticalmente correto. TEM (verbo TER) é muito usado na língua falada: Tem muita gente aqui (разговорный). Em textos formais: HÁ muita gente. Ambos são compreendidos." },
  { cat:"uso", q:"Complete: \"___ de haver uma solução para este problema.\" (наверное есть решение)", options:["Há","Tem","Deve","Houve"], answer:2, explanation:"DEVE HAVER = deve existir / provavelmente existe. Deve haver uma solução = Наверное есть решение. Combina o modal DEVER + HAVER no infinitivo." },
  // Há + tempo
  { cat:"tempo", q:"___ três anos que moro em Lisboa. (уже 3 года живу)", options:["Faz","Há","Houve","Por"], answer:1, explanation:"HÁ + tempo + que + presente = уже X времени (действие продолжается). Há três anos que moro = Я живу уже 3 года. Variante: Moro em Lisboa há três anos." },
  { cat:"tempo", q:"\"Ela partiu ___ dois dias.\" Quando ela foi?", options:["daqui a dois dias","dois dias atrás","dois dias seguidos","ainda dois dias"], answer:1, explanation:"PARTIR + HÁ + tempo = dois dias atrás (ago). Ela partiu há dois dias = Она уехала два дня назад. HÁ com verbo no passado = ago." },
  { cat:"tempo", q:"___ quanto tempo estudas português?", options:["Faz","Há","Por","Desde"], answer:1, explanation:"HÁ QUANTO TEMPO = сколько времени (уже). Resposta: Há seis meses = Уже полгода. Também correto: Faz quanto tempo estudas?" },
  { cat:"tempo", q:"\"Há muito tempo\" pode significar:", options:["In a long time (no futuro)","A long time ago OU for a long time","Só: muito tempo atrás","Só: faz muito tempo que"], answer:1, explanation:"HÁ MUITO TEMPO tem dois sentidos: 1) muito tempo atrás (ago) -- Isso aconteceu há muito tempo. 2) faz muito tempo que (for a long time) -- Há muito tempo que não a vejo = Уже давно её не вижу." }
];

const badges = { formas:"Formas", uso:"Uso", tempo:"Há + tempo" };
const badgeClass = { formas:"badge-formas", uso:"badge-uso", tempo:"badge-tempo" };
let filtered = [...allQuestions], current = 0, score = 0, mistakes = [];

function setFilter(cat, btn) {
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  filtered = cat === 'todos' ? [...allQuestions] : allQuestions.filter(q => q.cat === cat);
  current = 0; score = 0; mistakes = [];
  document.getElementById('quizCard').style.display = '';
  document.getElementById('results').className = 'card results';
  document.getElementById('mistakesList').innerHTML = '';
  loadQuestion();
}

function loadQuestion() {
  const q = filtered[current];
  document.getElementById('progressBar').style.width = (current / filtered.length * 100) + '%';
  document.getElementById('progressLabel').textContent = `Questão ${current + 1} de ${filtered.length}`;
  const badge = document.getElementById('badge');
  badge.textContent = badges[q.cat];
  badge.className = 'category-badge ' + badgeClass[q.cat];
  document.getElementById('question').textContent = q.q;
  const opts = document.getElementById('options');
  opts.innerHTML = '';
  q.options.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.textContent = opt;
    btn.onclick = () => selectAnswer(i);
    opts.appendChild(btn);
  });
  document.getElementById('feedback').className = 'feedback';
  document.getElementById('nextBtn').className = 'next-btn';
}

function selectAnswer(i) {
  const q = filtered[current];
  const btns = document.querySelectorAll('.option-btn');
  btns.forEach(b => b.disabled = true);
  const fb = document.getElementById('feedback');
  if (i === q.answer) {
    score++;
    btns[i].classList.add('correct');
    fb.className = 'feedback ok show';
    fb.textContent = 'Correto! ' + q.explanation;
  } else {
    btns[i].classList.add('wrong');
    btns[q.answer].classList.add('correct');
    fb.className = 'feedback err show';
    fb.textContent = 'Incorreto. ' + q.explanation;
    mistakes.push({ q: q.q, yours: q.options[i], correct: q.options[q.answer] });
  }
  document.getElementById('nextBtn').className = 'next-btn show';
}

function nextQuestion() {
  current++;
  if (current < filtered.length) { loadQuestion(); }
  else { showResults(); }
}

function showResults() {
  document.getElementById('quizCard').style.display = 'none';
  const r = document.getElementById('results');
  r.className = 'card results show';
  document.getElementById('scoreNum').textContent = score;
  document.getElementById('scoreDenom').textContent = '/ ' + filtered.length;
  const pct = Math.round(score / filtered.length * 100);
  document.getElementById('resultsTitle').textContent = pct >= 80 ? 'Muito bem!' : pct >= 60 ? 'Bom trabalho!' : 'Continua a praticar!';
  document.getElementById('resultsMsg').textContent = `Acertaste ${score} de ${filtered.length} questões (${pct}%).`;
  const ml = document.getElementById('mistakesList');
  if (mistakes.length) {
    ml.innerHTML = '<h3>Erros para rever:</h3>' + mistakes.map(m =>
      `<div class="mistake-item"><strong>${m.q}</strong><br>A tua resposta: ${m.yours}<br><span class="correct-ans">Correto: ${m.correct}</span></div>`
    ).join('');
  }
}

function restart() {
  current = 0; score = 0; mistakes = [];
  document.getElementById('quizCard').style.display = '';
  document.getElementById('results').className = 'card results';
  document.getElementById('mistakesList').innerHTML = '';
  loadQuestion();
}

loadQuestion();
</script>
</body>
</html>
