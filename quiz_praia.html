<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz -- Praia e Mar</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', Arial, sans-serif; background: #f0f4f8; color: #2d3748; min-height: 100vh; padding: 20px; }
  .container { max-width: 680px; margin: 0 auto; }
  header { text-align: center; padding: 30px 0 20px; }
  header h1 { font-size: 1.8rem; color: #2b6cb0; margin-bottom: 6px; }
  header p { color: #718096; font-size: 0.95rem; }
  .back-link { display: inline-block; margin-bottom: 16px; color: #718096; font-size: 0.88rem; text-decoration: none; }
  .back-link:hover { color: #2b6cb0; }
  .filter-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
  .filter-btn { padding: 7px 16px; border-radius: 20px; border: 2px solid #e2e8f0; background: white; font-size: 0.85rem; font-weight: 600; cursor: pointer; color: #718096; transition: all 0.15s; }
  .filter-btn.active { background: #2b6cb0; border-color: #2b6cb0; color: white; }
  .filter-btn:hover:not(.active) { border-color: #90cdf4; color: #2b6cb0; }
  .progress-bar-wrap { background: #e2e8f0; border-radius: 8px; height: 8px; margin: 20px 0; }
  .progress-bar { height: 8px; border-radius: 8px; background: linear-gradient(90deg, #2b6cb0, #90cdf4); transition: width 0.4s ease; }
  .progress-label { text-align: right; font-size: 0.82rem; color: #718096; margin-top: 4px; }
  .card { background: white; border-radius: 16px; padding: 30px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); margin-bottom: 20px; }
  .category-badge { display: inline-block; font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; padding: 3px 10px; border-radius: 20px; margin-bottom: 14px; }
  .badge-vocab { background: #ebf8ff; color: #2c5282; }
  .badge-animais { background: #f0fff4; color: #276749; }
  .badge-expr { background: #faf5ff; color: #553c9a; }
  .badge-posicoes { background: #fffaf0; color: #744210; }
  .question { font-size: 1.1rem; font-weight: 600; line-height: 1.6; margin-bottom: 20px; }
  .options { display: flex; flex-direction: column; gap: 10px; }
  .option-btn { background: #f7fafc; border: 2px solid #e2e8f0; border-radius: 10px; padding: 13px 18px; font-size: 1rem; text-align: left; cursor: pointer; transition: all 0.15s; color: #2d3748; }
  .option-btn:hover:not(:disabled) { background: #ebf8ff; border-color: #90cdf4; }
  .option-btn.correct { background: #f0fff4; border-color: #68d391; color: #276749; font-weight: 600; }
  .option-btn.wrong { background: #fff5f5; border-color: #fc8181; color: #c53030; }
  .option-btn:disabled { cursor: default; }
  .feedback { margin-top: 16px; padding: 12px 16px; border-radius: 10px; font-size: 0.9rem; line-height: 1.5; display: none; }
  .feedback.show { display: block; }
  .feedback.ok  { background: #f0fff4; color: #276749; border-left: 4px solid #68d391; }
  .feedback.err { background: #fff5f5; color: #c53030; border-left: 4px solid #fc8181; }
  .next-btn { display: none; margin-top: 18px; width: 100%; padding: 14px; background: #2b6cb0; color: white; border: none; border-radius: 10px; font-size: 1rem; font-weight: 600; cursor: pointer; }
  .next-btn:hover { background: #2c5282; }
  .next-btn.show { display: block; }
  .results { display: none; text-align: center; padding: 40px 30px; }
  .results.show { display: block; }
  .score-circle { width: 120px; height: 120px; border-radius: 50%; background: linear-gradient(135deg, #2b6cb0, #90cdf4); display: flex; flex-direction: column; align-items: center; justify-content: center; margin: 0 auto 20px; color: white; }
  .score-circle .num { font-size: 2.2rem; font-weight: 700; line-height: 1; }
  .score-circle .denom { font-size: 0.85rem; opacity: 0.85; }
  .results h2 { font-size: 1.5rem; margin-bottom: 8px; }
  .results p { color: #718096; margin-bottom: 24px; }
  .btn-row { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  .restart-btn { padding: 13px 32px; background: #2b6cb0; color: white; border: none; border-radius: 10px; font-size: 1rem; font-weight: 600; cursor: pointer; }
  .home-btn { padding: 13px 32px; background: #edf2f7; color: #4a5568; border: none; border-radius: 10px; font-size: 1rem; font-weight: 600; cursor: pointer; text-decoration: none; display: inline-block; }
  .mistakes-list { text-align: left; margin-top: 28px; }
  .mistakes-list h3 { font-size: 1rem; color: #c53030; margin-bottom: 12px; }
  .mistake-item { background: #fff5f5; border-radius: 8px; padding: 10px 14px; margin-bottom: 8px; font-size: 0.88rem; line-height: 1.5; }
  .mistake-item strong { color: #c53030; }
  .mistake-item .correct-ans { color: #276749; font-weight: 600; }
</style>
</head>
<body>
<div class="container">
  <a class="back-link" href="index.html">← Voltar ao menu</a>
  <header>
    <h1>🏖️ Praia e Mar</h1>
    <p>vocabulário · animais · expressões · posições</p>
  </header>
  <div class="filter-row">
    <button class="filter-btn active" onclick="setFilter('todos',this)">Todos (20)</button>
    <button class="filter-btn" onclick="setFilter('vocab',this)">Vocabulário</button>
    <button class="filter-btn" onclick="setFilter('animais',this)">Animais</button>
    <button class="filter-btn" onclick="setFilter('expr',this)">Expressões</button>
    <button class="filter-btn" onclick="setFilter('posicoes',this)">Posições</button>
  </div>
  <div class="progress-bar-wrap"><div class="progress-bar" id="progressBar" style="width:0%"></div></div>
  <div class="progress-label" id="progressLabel"></div>
  <div class="card" id="quizCard">
    <div class="category-badge" id="badge"></div>
    <div class="question" id="question"></div>
    <div class="options" id="options"></div>
    <div class="feedback" id="feedback"></div>
    <button class="next-btn" id="nextBtn" onclick="nextQuestion()">Próxima questão →</button>
  </div>
  <div class="card results" id="results">
    <div class="score-circle"><span class="num" id="scoreNum"></span><span class="denom" id="scoreDenom"></span></div>
    <h2 id="resultsTitle"></h2><p id="resultsMsg"></p>
    <div class="btn-row">
      <button class="restart-btn" onclick="restart()">Repetir quiz</button>
      <a class="home-btn" href="index.html">Menu principal</a>
    </div>
    <div class="mistakes-list" id="mistakesList"></div>
  </div>
</div>
<script>
const allQuestions = [
  // Vocabulário
  { cat:"vocab", q:"Como se diz «песок» em português?", options:["a onda","a areia","a pedra","a rocha"], answer:1, explanation:"A AREIA = песок. A onda = волна. A pedra = камень. A rocha = скала." },
  { cat:"vocab", q:"«Dar um mergulho» significa:", options:["dar uma volta na praia","nadar muito rápido","mergulhar / нырнуть","fazer surf"], answer:2, explanation:"DAR UM MERGULHO = нырнуть. Também: MERGULHAR (глагол). Não confundir com NADAR = плавать." },
  { cat:"vocab", q:"Quem é o «nadador salvador»?", options:["um tubarão amigável","o surfista","o спасатель / lifeguard","quem nada mais rápido"], answer:2, explanation:"NADADOR SALVADOR = спасатель на пляже / lifeguard. Ele vigia o mar e salva pessoas em perigo." },
  { cat:"vocab", q:"«As algas» são:", options:["ondas grandes","водоросли / seaweed","peixes pequenos","медузы"], answer:1, explanation:"AS ALGAS = водоросли / seaweed. Crescem no fundo do mar e nas rochas." },
  { cat:"vocab", q:"Como se diz «глубина» em português?", options:["a altura","a largura","a profundidade","o comprimento"], answer:2, explanation:"A PROFUNDIDADE = глубина. A ALTURA = высота / высота. Cuidado: não confundir!" },
  { cat:"vocab", q:"«Pisar» significa:", options:["nadar","наступать (на что-то) / to step on","mergulhar","surfar"], answer:1, explanation:"PISAR = наступать. Cuidado para não pisar numa alforreca! = Осторожно, не наступи на медузу!" },
  { cat:"vocab", q:"O «colchão» na praia é:", options:["a toalha de praia","надувной матрас / inflatable mat","um chapéu de sol","as sandálias"], answer:1, explanation:"O COLCHÃO = надувной матрас. A TOALHA = полотенце. Ambos são essenciais na praia!" },
  // Animais
  { cat:"animais", q:"«A alforreca» é:", options:["um peixe","uma alga","медуза / jellyfish","um golfinho"], answer:2, explanation:"A ALFORRECA = медуза. Em Portugal também se diz MEDUSA. A caravela portuguesa é um tipo especial de alforreca — muito venenosa!" },
  { cat:"animais", q:"A «caravela portuguesa» é:", options:["um barco histórico","um tipo de alforreca muito venenosa","um peixe rápido","uma alga"], answer:1, explanation:"A CARAVELA PORTUGUESA = португальский кораблик — тип медузы, очень ядовитой. O nome vem da semelhança com os antigos barcos portugueses." },
  { cat:"animais", q:"Como se diz «дельфин» em português?", options:["a baleia","a orca","o tubarão","o golfinho"], answer:3, explanation:"O GOLFINHO = дельфин. A BALEIA = кит. A ORCA = косатка. O TUBARÃO = акула." },
  { cat:"animais", q:"«Venenoso» significa:", options:["очень grande","perigoso de tocar / ядовитый","muito rápido","difícil de ver"], answer:1, explanation:"VENENOSO = ядовитый / venomous. A caravela portuguesa é muito venenosa. O peixe aranha também é venenoso." },
  { cat:"animais", q:"O «peixe aranha» é:", options:["um peixe que parece uma aranha","um peixe venenoso que vive no fundo do mar","uma alforreca pequena","um golfinho jovem"], answer:1, explanation:"O PEIXE ARANHA = рыба-паук — peixe que se esconde na areia e é venenoso. Muito comum nas praias portuguesas. Cuidado ao caminhar na água rasa!" },
  { cat:"animais", q:"Qual é o maior animal do mar?", options:["o tubarão","a orca","a baleia","o golfinho"], answer:2, explanation:"A BALEIA = кит — o maior animal do mar. O TUBARÃO = акула. A ORCA = косатка (também muito grande)." },
  // Expressões
  { cat:"expr", q:"«Estar na mesma onda» significa:", options:["surfar juntos","быть на одной волне / to be on the same page","nadar ao mesmo tempo","ter medo do mar"], answer:1, explanation:"ESTAR NA MESMA ONDA = быть на одной волне / to be on the same wavelength. Expressão idiomática muito usada!" },
  { cat:"expr", q:"«Ele é boa onda» significa:", options:["ele surfa muito bem","ele é boa pessoa / с ним легко","ele tem medo do mar","ele é venenoso"], answer:1, explanation:"SER BOA ONDA = быть классным / хорошим человеком (gíria / сленг). Antónimo: ser má onda = быть неприятным." },
  { cat:"expr", q:"«Ter medo de» + sustantivo significa:", options:["gostar muito de","бояться чего-то / to be afraid of","ter nojo de","conhecer bem"], answer:1, explanation:"TER MEDO DE = бояться. Eu tenho medo de tubarões = Я боюсь акул. TER NOJO DE = испытывать отвращение к. Ela tem nojo de algas = Ей неприятны водоросли." },
  { cat:"expr", q:"«Apanhar a onda» significa:", options:["ter medo das ondas","поймать волну (surfar ou aproveitar o momento)","cair na água","mergulhar fundo"], answer:1, explanation:"APANHAR A ONDA = поймать волну. Pode ser literal (surfar) ou figurado (aproveitar o momento certo)." },
  // Posições
  { cat:"posicoes", q:"O nadador salvador está _____ na areia.", options:["deitado","sentado","de pé","a nadar"], answer:2, explanation:"ESTAR DE PÉ = стоять. ESTAR DEITADO = лежать. ESTAR SENTADO = сидеть. O nadador salvador está de pé para observar melhor o mar." },
  { cat:"posicoes", q:"«Ela está deitada na toalha.» Significa:", options:["она стоит","она сидит","она лежит","ela está a nadar"], answer:2, explanation:"ESTAR DEITADO/A = лежать. ESTAR SENTADO/A = сидеть. ESTAR DE PÉ = стоять. -O/-A согласуется с родом!" },
  { cat:"posicoes", q:"Na imagem, o surfista está _____ na prancha.", options:["deitado","sentado","de pé","a dormir"], answer:2, explanation:"ESTAR DE PÉ = стоять. O surfista fica de pé na prancha enquanto surfa as ondas. Na prancha de surf fica-se de pé!" },
];

const badges = { vocab:"Vocabulário", animais:"Animais", expr:"Expressões", posicoes:"Posições" };
const badgeClass = { vocab:"badge-vocab", animais:"badge-animais", expr:"badge-expr", posicoes:"badge-posicoes" };
let filtered = [...allQuestions], current = 0, score = 0, mistakes = [];

function setFilter(cat, btn) {
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  filtered = cat === 'todos' ? [...allQuestions] : allQuestions.filter(q => q.cat === cat);
  current = 0; score = 0; mistakes = [];
  document.getElementById('quizCard').style.display = '';
  document.getElementById('results').className = 'card results';
  document.getElementById('mistakesList').innerHTML = '';
  loadQuestion();
}

function loadQuestion() {
  const q = filtered[current];
  document.getElementById('progressBar').style.width = (current / filtered.length * 100) + '%';
  document.getElementById('progressLabel').textContent = `Questão ${current + 1} de ${filtered.length}`;
  const badge = document.getElementById('badge');
  badge.textContent = badges[q.cat];
  badge.className = 'category-badge ' + badgeClass[q.cat];
  document.getElementById('question').textContent = q.q;
  const opts = document.getElementById('options');
  opts.innerHTML = '';
  q.options.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.textContent = opt;
    btn.onclick = () => selectAnswer(i);
    opts.appendChild(btn);
  });
  document.getElementById('feedback').className = 'feedback';
  document.getElementById('nextBtn').className = 'next-btn';
}

function selectAnswer(i) {
  const q = filtered[current];
  const btns = document.querySelectorAll('.option-btn');
  btns.forEach(b => b.disabled = true);
  const fb = document.getElementById('feedback');
  if (i === q.answer) {
    score++;
    btns[i].classList.add('correct');
    fb.className = 'feedback ok show';
    fb.textContent = 'Correto! ' + q.explanation;
  } else {
    btns[i].classList.add('wrong');
    btns[q.answer].classList.add('correct');
    fb.className = 'feedback err show';
    fb.textContent = 'Incorreto. ' + q.explanation;
    mistakes.push({ q: q.q, yours: q.options[i], correct: q.options[q.answer] });
  }
  document.getElementById('nextBtn').className = 'next-btn show';
}

function nextQuestion() {
  current++;
  if (current < filtered.length) { loadQuestion(); }
  else { showResults(); }
}

function showResults() {
  document.getElementById('quizCard').style.display = 'none';
  const r = document.getElementById('results');
  r.className = 'card results show';
  document.getElementById('scoreNum').textContent = score;
  document.getElementById('scoreDenom').textContent = '/ ' + filtered.length;
  const pct = Math.round(score / filtered.length * 100);
  document.getElementById('resultsTitle').textContent = pct >= 80 ? 'Muito bem!' : pct >= 60 ? 'Bom trabalho!' : 'Continua a praticar!';
  document.getElementById('resultsMsg').textContent = `Acertaste ${score} de ${filtered.length} questões (${pct}%).`;
  const ml = document.getElementById('mistakesList');
  if (mistakes.length) {
    ml.innerHTML = '<h3>Erros para rever:</h3>' + mistakes.map(m =>
      `<div class="mistake-item"><strong>${m.q}</strong><br>A tua resposta: ${m.yours}<br><span class="correct-ans">Correto: ${m.correct}</span></div>`
    ).join('');
  }
}

function restart() {
  current = 0; score = 0; mistakes = [];
  document.getElementById('quizCard').style.display = '';
  document.getElementById('results').className = 'card results';
  document.getElementById('mistakesList').innerHTML = '';
  loadQuestion();
}

loadQuestion();
</script>
</body>
</html>
